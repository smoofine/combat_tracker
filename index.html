<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Combat Tracker — D&D 5e</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#12121e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Combat Tracker">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#12121e;--s1:#1c1c2e;--s2:#26263a;--s3:#303048;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e2e2f0;--muted:#7878a0;--hint:#4a4a68;
  --blue:#6b8eff;--blue-bg:rgba(107,142,255,0.12);--blue-border:rgba(107,142,255,0.3);
  --green:#5dd98a;--green-bg:rgba(93,217,138,0.12);--green-border:rgba(93,217,138,0.3);
  --amber:#f0b84a;--amber-bg:rgba(240,184,74,0.12);--amber-border:rgba(240,184,74,0.3);
  --red:#f06060;--red-bg:rgba(240,96,96,0.12);--red-border:rgba(240,96,96,0.3);
  --r:10px;--r-sm:7px
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.45;overscroll-behavior:none}

/* ── Import Screen ─────────────────────────────────── */
#screen-import{display:none;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;padding:2rem;text-align:center}
.imp-rune{font-size:2.8rem;margin-bottom:1.2rem}
.imp-title{font-size:1.35rem;font-weight:700;margin-bottom:.5rem}
.imp-sub{color:var(--muted);font-size:.88rem;line-height:1.7;margin-bottom:2rem;max-width:300px}
.imp-sub code{background:var(--s2);color:var(--blue);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:.83rem}
.btn-primary{background:var(--blue);color:#fff;border:none;padding:14px 0;
  border-radius:var(--r);font-size:.97rem;font-weight:600;cursor:pointer;width:100%;max-width:300px}
.btn-primary:active{opacity:.8}
#file-input{display:none}
.imp-hint{margin-top:1.2rem;font-size:.75rem;color:var(--hint);line-height:1.6}

/* ── Tracker Screen ────────────────────────────────── */
#screen-tracker{display:none;min-height:100dvh;flex-direction:column}

/* Header */
.header{background:var(--s1);border-bottom:1px solid var(--border);
  padding:10px 14px;display:flex;align-items:center;gap:8px;
  position:sticky;top:0;z-index:20}
.hdr-change{background:var(--s2);border:1px solid var(--border2);color:var(--muted);
  width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.hdr-change:active{opacity:.6}
.hdr-info{flex:1;min-width:0}
.hdr-name{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-meta{font-size:.73rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round-ctrl{display:flex;align-items:center;gap:4px;flex-shrink:0}
.round-btn{background:var(--s2);border:1px solid var(--border2);color:var(--muted);
  width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;line-height:1}
.round-btn:active{opacity:.6}
.round-display{background:var(--s2);border:1px solid var(--border);
  padding:3px 10px;border-radius:14px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.round-display span{color:var(--text);font-weight:600}

/* Content */
.content{padding:12px 14px 32px;flex:1}

/* HP row */
.hp-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px}
.hp-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;flex:1}
.hp-controls{display:flex;align-items:center;gap:8px}
.adj-btn{background:var(--s2);border:1px solid var(--border2);color:var(--text);
  width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:1.1rem;
  display:flex;align-items:center;justify-content:center}
.adj-btn:active{opacity:.6}
.hp-val{font-size:1.15rem;font-weight:700;min-width:72px;text-align:center;cursor:pointer}
.hp-max{font-size:.78rem;color:var(--muted);font-weight:400}
.hp-temp{font-size:.78rem;color:var(--amber);font-weight:600;margin-left:2px}
.calc-btn{background:var(--s2);border:1px solid var(--border2);color:var(--blue);
  width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.calc-btn:active{opacity:.6}
.calc-btn.open{background:var(--blue-bg);border-color:var(--blue-border)}

/* HP calculator panel */
.calc-panel{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
  padding:10px;margin-bottom:6px}
.calc-display{background:#0c0c14;border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 12px;text-align:right;font-size:1.4rem;font-weight:700;
  min-height:1.6em;margin-bottom:8px;letter-spacing:.02em;word-break:break-all;
  color:var(--text)}
.calc-display.empty{color:var(--hint)}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.calc-key{background:var(--s2);border:1px solid var(--border2);color:var(--text);
  border-radius:var(--r-sm);padding:11px 0;font-size:.95rem;font-weight:600;
  cursor:pointer;text-align:center}
.calc-key:active{opacity:.6}
.calc-key.op{color:var(--amber)}
.calc-key.die{color:var(--blue);font-size:.82rem}
.calc-key.clear{color:var(--red)}
.calc-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.calc-act{border-radius:var(--r-sm);padding:11px 0;font-size:.85rem;font-weight:700;
  cursor:pointer;text-align:center;border:none;color:#fff}
.calc-act:active{opacity:.7}
.calc-heal{background:#2d7d4f}
.calc-temp{background:#3a6b9e}
.calc-dmg{background:#8b2c2c}

/* Spell DC row */
.dc-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dc-badge{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:6px 12px;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dc-badge b{color:var(--amber);font-size:.95rem}
.trackers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-bottom:10px}
.tcard{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 10px;position:relative}
.tcard-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;
  padding-right:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard-dots{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.tdot{width:16px;height:16px;border-radius:50%;cursor:pointer;flex-shrink:0;
  border:1.5px solid var(--hint);background:transparent;transition:background .1s,border-color .1s}
.tdot.on{background:var(--blue);border-color:var(--blue)}
.tdot:active{opacity:.6}
.tcard-num{display:flex;align-items:center;gap:6px}
.tnum-val{font-size:1.1rem;font-weight:700}
.tnum-max{font-size:.78rem;color:var(--muted)}
.tnum-btn{background:var(--s2);border:1px solid var(--border2);color:var(--text);
  width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tnum-btn:active{opacity:.6}
.tcard-dice{font-size:.95rem;font-weight:600;color:var(--amber);letter-spacing:.02em;margin-bottom:3px}
.tcard-reset{font-size:.68rem;color:var(--hint)}
.pool-row{display:flex;gap:4px;margin-top:5px;align-items:center}
.pool-input{width:40px;background:var(--s2);border:1px solid var(--border2);color:var(--text);
  border-radius:6px;padding:3px 4px;font-size:.78rem;text-align:center;
  -moz-appearance:textfield}
.pool-input::-webkit-outer-spin-button,.pool-input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
.pool-btn{background:var(--blue-bg);border:1px solid var(--blue-border);color:var(--blue);
  border-radius:6px;padding:3px 0;font-size:.7rem;font-weight:600;cursor:pointer;flex:1;
  text-align:center}
.pool-btn:active{opacity:.6}
.x-btn{flex-shrink:0;align-self:flex-start;margin-top:1px;width:20px;height:20px;
  border-radius:50%;background:var(--s3);border:none;color:var(--hint);font-size:.65rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding:0;line-height:1;touch-action:manipulation}
.x-btn:active{opacity:.5}

/* Controls */
.ctrl-row{display:flex;gap:5px;margin-bottom:12px}
.btn-ctrl{flex:1;background:var(--s2);border:1px solid var(--border);color:var(--text);
  padding:8px 4px;border-radius:var(--r-sm);font-size:.78rem;cursor:pointer;text-align:center}
.btn-ctrl:active{opacity:.6}
.btn-ctrl.accent{color:var(--blue);border-color:var(--blue-border)}
.btn-ctrl.danger{color:var(--red);border-color:var(--red-border)}

/* Section */
.section{margin-bottom:12px}
.sec-head{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.sec-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d-action{background:var(--blue)} .d-bonus{background:var(--green)}
.d-reaction{background:var(--amber)} .d-combo{background:var(--muted)}
.sec-name{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sec-used{margin-left:auto;font-size:.7rem;color:var(--red)}

/* Ability button */
.ab{width:100%;text-align:left;background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:9px 11px 8px 11px;margin-bottom:4px;cursor:pointer;
  color:var(--text);font-family:inherit;font-size:.88rem;position:relative;
  display:flex;align-items:flex-start;gap:8px;transition:opacity .12s}
.ab:active{opacity:.65}
.ab.used{opacity:.35;cursor:default;text-decoration:line-through;text-decoration-color:var(--hint)}
.ab.locked{opacity:.3;cursor:not-allowed}
.ab-main{flex:1;min-width:0;padding-right:4px}
.ab-name{font-weight:600;margin-bottom:1px}
.ab-desc{font-size:.76rem;color:var(--muted);line-height:1.45}
.ab-more{font-size:.7rem;color:var(--blue);margin-top:3px;display:inline-block;cursor:pointer}
.ab-src{font-size:.66rem;color:var(--hint);margin-top:2px}
.ab-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.ab-costs{display:flex;gap:4px;flex-direction:column;align-items:flex-end}
.cost{font-size:.7rem;padding:2px 7px;border-radius:10px;white-space:nowrap;font-weight:500}
.c-blue{background:var(--blue-bg);color:var(--blue)}
.c-free{background:var(--s3);color:var(--muted)}
.c-locked{background:var(--red-bg);color:var(--red)}
.c-amber{background:var(--amber-bg);color:var(--amber)}

/* Combo */
.combo{border-left:3px solid var(--blue-border);background:var(--s1);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:9px 11px;margin-bottom:5px;cursor:pointer}
.combo:active{opacity:.65}
.combo.locked{border-left-color:var(--hint);opacity:.4;cursor:default}
.combo-name{font-weight:600;font-size:.88rem;margin-bottom:3px}
.combo-steps{font-size:.75rem;color:var(--muted);line-height:1.6}

/* Suggestions (universal combo system) */
.sugg-card{border-left:3px solid var(--blue-border);background:var(--s1);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:9px 11px;margin-bottom:5px;cursor:pointer}
.sugg-card:active{opacity:.65}
.sugg-cat{font-weight:600;font-size:.8rem;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.sugg-pick{display:flex;align-items:baseline;gap:6px;font-size:.82rem;margin-bottom:2px}
.sugg-slot{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--muted);min-width:38px;flex-shrink:0}
.sugg-name{font-weight:500}
.sugg-extra{font-size:.72rem;color:var(--muted)}
.sugg-empty{font-size:.78rem;color:var(--hint);font-style:italic}
.sugg-total{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:6px;padding-top:6px;border-top:1px dashed var(--border2);
  cursor:pointer;font-size:.8rem;font-weight:600;color:var(--blue)}
.sugg-total:active{opacity:.6}
.sugg-total-val{color:var(--amber)}

/* Utility / out-of-combat section */
.util-toggle{display:flex;align-items:center;gap:7px;cursor:pointer;
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:9px 11px;margin-bottom:8px;font-size:.82rem;color:var(--muted);font-weight:600}
.util-toggle .chev{margin-left:auto;font-size:.7rem;transition:transform .15s}
.util-toggle.open .chev{transform:rotate(90deg)}
.ab.util .ab-costs{flex-direction:column}
.usar-btn{background:var(--blue-bg);border:1px solid var(--blue-border);color:var(--blue);
  border-radius:var(--r-sm);padding:4px 9px;font-size:.7rem;font-weight:600;cursor:pointer;margin-top:4px}
.usar-btn:active{opacity:.6}
.usar-btn:disabled{opacity:.35;cursor:not-allowed}

/* Generic collapsible section header */
.sec-toggle{cursor:pointer}
.sec-toggle .chev{margin-left:auto;font-size:.65rem;color:var(--muted);transition:transform .15s}
.sec-toggle.collapsed .chev{transform:rotate(-90deg)}

/* Stepper (level/cost selectors for triggers & spell upcasting) */
.stepper{display:flex;align-items:center;gap:4px}
.stepper-btn{background:var(--s2);border:1px solid var(--border2);color:var(--text);
  width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:.85rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.stepper-btn:active{opacity:.6}
.stepper-btn:disabled{opacity:.3;cursor:not-allowed}
.stepper-val{font-size:.75rem;font-weight:700;min-width:36px;text-align:center;color:var(--blue)}

/* Trigger cards (Divine Smite, Metamagic, etc.) */
.trig{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:9px 11px;margin-bottom:5px;position:relative}
.trig-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:6px}
.trig-main{flex:1;min-width:0}
.trig-name{font-weight:600;font-size:.88rem;margin-bottom:1px}
.trig-desc{font-size:.76rem;color:var(--muted);line-height:1.45}
.trig-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trig-dmg{font-size:.78rem;color:var(--amber);font-weight:600}

.div{height:1px;background:var(--border);margin:10px 0}
.footer-btn{background:var(--s2);border:1px solid var(--border);color:var(--muted);
  padding:9px;border-radius:var(--r-sm);font-size:.78rem;cursor:pointer;width:100%;text-align:center;margin-top:8px}
.footer-btn:active{opacity:.6}

/* Trash modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);
  display:flex;align-items:flex-end;justify-content:center;z-index:200}
.modal-sheet{background:var(--s1);border-radius:var(--r) var(--r) 0 0;
  width:100%;max-width:480px;max-height:78vh;display:flex;flex-direction:column;
  border:1px solid var(--border2);border-bottom:none}
.modal-head{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;
  border-bottom:1px solid var(--border)}
.modal-title{font-weight:700;font-size:.95rem;flex:1}
.modal-close{background:var(--s2);border:1px solid var(--border2);color:var(--muted);
  width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.9rem;
  display:flex;align-items:center;justify-content:center}
.modal-close:active{opacity:.6}
.modal-body{overflow-y:auto;padding:8px 14px 14px;flex:1}
.modal-empty{color:var(--hint);font-size:.85rem;text-align:center;padding:24px 0}
.trash-group{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin:10px 0 6px}
.trash-item{display:flex;align-items:center;gap:8px;background:var(--s2);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;margin-bottom:5px}
.trash-name{flex:1;font-size:.86rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trash-restore{background:var(--blue-bg);border:1px solid var(--blue-border);color:var(--blue);
  border-radius:var(--r-sm);padding:6px 12px;font-size:.78rem;font-weight:600;cursor:pointer;flex-shrink:0}
.trash-restore:active{opacity:.6}
.modal-foot{padding:10px 14px;border-top:1px solid var(--border)}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--s3);border:1px solid var(--border2);color:var(--text);
  padding:9px 18px;border-radius:20px;font-size:.83rem;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:100;white-space:nowrap;max-width:88vw;
  overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.combo-used{box-shadow:0 0 0 2px var(--amber)!important;border-color:var(--amber)!important}
.passive-trait{opacity:.9;border-left:3px solid var(--muted);cursor:default}
.passive-trait:hover{filter:none}
.undo-btn{background:none;border:1px solid var(--border);border-radius:5px;color:var(--amber);font-size:.85rem;padding:2px 7px;cursor:pointer;line-height:1}
.undo-btn:hover{background:var(--amber);color:#000}

.pool-input{width:42px;font-size:.8rem;font-weight:700;text-align:center;
  background:var(--s2);border:1px solid var(--border2);border-radius:5px;
  color:var(--blue);padding:2px 3px;-moz-appearance:textfield;cursor:text}
.pool-input::-webkit-outer-spin-button,.pool-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pool-input:focus{outline:2px solid var(--blue);border-color:var(--blue)}

/* ── Active Effects Panel ── */
.eff-row{display:flex;align-items:flex-start;gap:8px;padding:7px 11px;border-bottom:1px solid var(--border)}
.eff-row:last-of-type{border-bottom:none}
.eff-icon{font-size:1rem;flex-shrink:0;margin-top:1px}
.eff-info{flex:1;min-width:0}
.eff-name{font-size:.85rem;font-weight:600;color:var(--text)}
.eff-flags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.eff-flag{font-size:.68rem;background:rgba(245,158,11,.15);color:var(--amber);
  border:1px solid rgba(245,158,11,.3);border-radius:4px;padding:1px 5px}
.eff-conc-hint{font-size:.68rem;color:var(--muted);margin-top:2px}
.eff-end-btn{flex-shrink:0;background:none;border:1px solid var(--border);
  border-radius:50%;width:20px;height:20px;color:var(--hint);cursor:pointer;
  font-size:.65rem;display:flex;align-items:center;justify-content:center;align-self:flex-start}
.eff-end-btn:hover{color:var(--red);border-color:var(--red)}
.eff-break-conc-btn{width:calc(100% - 22px);margin:6px 11px 8px;
  background:none;border:1px solid rgba(239,68,68,.35);color:var(--red);
  border-radius:6px;padding:5px;font-size:.78rem;cursor:pointer}
.eff-break-conc-btn:hover{background:rgba(239,68,68,.12)}

/* ── Effect activation badges on ability cards ── */
.eff-badge{display:flex;align-items:center;gap:4px;margin-top:5px;flex-wrap:wrap}
.eff-badge.active{color:var(--blue);font-size:.73rem;font-weight:600;cursor:pointer}
.eff-activate-btn{font-size:.71rem;background:rgba(245,158,11,.12);
  border:1px solid rgba(245,158,11,.4);color:var(--amber);border-radius:5px;
  padding:2px 7px;cursor:pointer;white-space:nowrap}
.eff-activate-btn:hover{background:rgba(245,158,11,.25)}
.target-toggle{font-size:.71rem;background:var(--s2);border:1px solid var(--border2);
  color:var(--muted);border-radius:4px;padding:2px 7px;cursor:pointer}
.target-toggle.active{background:rgba(96,165,250,.2);color:var(--blue);
  border-color:rgba(96,165,250,.5)}

/* ── Encounter State Panel ── */
.enc-panel{padding:8px 11px 4px}
.enc-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.enc-label{font-size:.78rem;color:var(--muted)}
.enc-conds{display:flex;flex-wrap:wrap;gap:5px;padding-bottom:8px}
.enc-toggle-btn{font-size:.72rem;background:var(--s2);border:1px solid var(--border2);
  color:var(--muted);border-radius:6px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.enc-toggle-btn.active{background:rgba(239,68,68,.15);color:var(--red);
  border-color:rgba(239,68,68,.4);font-weight:600}
</style>
</head>
<body>

<div id="screen-import">
  <div class="imp-rune">⚔️</div>
  <div class="imp-title">Combat Tracker</div>
  <p class="imp-sub">
    Exporta tu personaje desde Fight Club 5e:<br>
    <code>Personaje → ··· → Exportar XML</code><br>
    luego comparte o selecciona el archivo aquí.
  </p>
  <button class="btn-primary" onclick="document.getElementById('file-input').click()">
    Seleccionar XML de FC5e
  </button>
  <input type="file" id="file-input" accept=".xml,text/xml,application/xml">
  <p class="imp-hint">En Android, si instalaste esta PWA, FC5e puede<br>compartir el XML directamente aquí.</p>
</div>

<div id="screen-tracker">
  <div class="header">
    <button class="hdr-change" onclick="document.getElementById('file-input').click()" title="Cambiar personaje">⇄</button>
    <div class="hdr-info">
      <div class="hdr-name" id="hdr-name">—</div>
      <div class="hdr-meta" id="hdr-meta">—</div>
    </div>
    <div class="round-ctrl">
      <button class="round-btn" onclick="addRound(-1)">−</button>
      <div class="round-display">Ronda <span id="hdr-round">1</span></div>
      <button class="round-btn" onclick="addRound(1)">+</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<div id="toast"></div>
<div id="trash-modal"></div>

<script>
// ═══════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════
const $  = (el, sel) => el?.querySelector(sel)?.textContent?.trim() ?? '';
const $$ = (el, sel) => [...(el?.querySelectorAll(sel) ?? [])];
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ═══════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════
let char = null;
let G = { round:1, hp:null, tempHp:0, actionUsed:false, bonusUsed:false,
  reactionUsed:false, oncePerTurn:{}, trackers:{}, showUtility:false,
  collapsed:{}, triggerSel:{}, castLevel:{}, poolAmt:{},
  hidden:{ abilities:{}, trackers:{} },
  activeEffects:{}, encounterState:{ numTargets:1, targetParalyzed:false,
    targetAsleep:false, targetProne:false, targetBlinded:false,
    targetConc:false, alliesInRange:0 },
  castTarget:{}, comboUsed:{}, lastSnapshot:null };

// Maps populated on each render(), used by toggleDesc()
let SHORT_DESC = {};
let FULL_DESC  = {};
// Populated fresh by renderSuggestions(); maps combo-button index -> steps
let SUGGESTION_COMBOS = [];

// HP calculator (not persisted — resets each session)
let calcOpen = false;
let calcExpr = '';

// ═══════════════════════════════════════════════════
//  XML PARSER
// ═══════════════════════════════════════════════════
const WEAPON_TYPES = new Set([5, 6]); // 5 = melee weapon, 6 = ranged weapon
const FINESSE_BIT  = 2;
const ABILITY_KEYS = ['str','dex','con','int','wis','cha'];
const ABILITY_ES   = ['FUE','DES','CON','INT','SAB','CAR'];
// ═══════════════════════════════════════════════════
//  RESOURCE-POOL REGISTRY
//  Replaces the old single broad RE_PC_TRACKER lookup, which picked
//  the FIRST tracker matching ANY resource-sounding keyword anywhere on
//  the whole character — fine for a single-resource character, but wrong
//  the moment a character has two or more such pools.
//
//  Confirmed wrong on real data: Bo (Fighter/Psi Warrior) has both a
//  "Superiority Die" tracker and a "Psionic Energy" tracker. His Psionic
//  Power reaction (pc:1, text mentions "Psionic Energy") was silently
//  decrementing Superiority Die instead, because that tracker happens to
//  sit earlier in char.trackers. Multiclass casters (Dorym: Paladín +
//  Hechicero) have the same risk between Canalizar Divinidad and Puntos
//  de Hechicería.
//
//  Fix: every named FC5e resource pool gets its own entry here. Ability
//  text is scanned (via detectResKey) for the SPECIFIC phrase that names
//  which pool it spends from, and that key is stored on the ability
//  (ab.resKey) at parse time. findResTracker(resKey) then looks up the
//  tracker using ONLY that pool's own narrow regex — never "whichever
//  matches first". Order below matters only as a tie-breaker when an
//  ability's text happens to mention more than one pool's phrasing (rare);
//  more specific patterns are listed first.
// Display abbreviations match what was already shown before this fix
// (pcAbbrev used to special-case "Concentración" → "PC" literally — kept
// as-is here to avoid a gratuitous UI text change). "Canalizar Div." is
// spelled out instead of abbreviated to "CD" because that exact badge
// text is already used elsewhere for spell save DC (ab.dc) — reusing it
// here would visually collide with that badge on the same ability card.
// variableEligible: whether this pool has a genuine "spend a VARIABLE
// amount" mechanic in 5e (Twinned Spell scales with target count, Psionic
// power/Maneuvers can burn multiple dice, etc). Sorcery/psionic/
// superiority do; Monk Focus and Channel Divinity options are always a
// flat 1-per-use in actual game rules, so they're excluded here — see the
// classifyTrigger() comment below for why this distinction matters.
const RESOURCE_TYPES = [
  { key:'sorcery',         abbrev:'PH',            textRe: /puntos? de hechicer[ií]a|sorcery points?/i,                          trackerRe: /hechicer|sorcery/i,                 variableEligible:true },
  { key:'psionic',         abbrev:'dado psi.',      textRe: /psionic energy|punto(?:s)? de psi[oó]nica/i,                          trackerRe: /psionic energy|psi[oó]nica/i,       variableEligible:true },
  { key:'superiority',     abbrev:'dado sup.',      textRe: /superiority dice?|dados? de superioridad/i,                           trackerRe: /superiority|superioridad/i,         variableEligible:true },
  { key:'focus',           abbrev:'PC',             textRe: /puntos? de (?:concentraci[oó]n|enfoque)|focus points?/i,              trackerRe: /concentraci|enfoque|focus/i,        variableEligible:false },
  { key:'channeldivinity', abbrev:'Canalizar Div.', textRe: /(?:usar|utilizar)\s+(?:tu\s+)?canalizar divinidad|use your channel divinity/i, trackerRe: /canalizar divinidad|channel divinity/i, variableEligible:false },
];

// Finds which (if any) named resource pool an ability's text refers to.
// Returns the resKey string, or null if the text doesn't name a pool we
// recognize (e.g. truly unnamed/generic homebrew resources) — callers
// fall back to the legacy broad-match behavior in that case, same as
// before this fix, so previously-working but unnamed cases don't regress.
//
// onlyVariableEligible restricts the search to pools that can plausibly
// have a variable (player-chosen) cost — see classifyTrigger().
function detectResKey(text, onlyVariableEligible) {
  for (const r of RESOURCE_TYPES) {
    if (onlyVariableEligible && !r.variableEligible) continue;
    if (r.textRe.test(text)) return r.key;
  }
  return null;
}

// Legacy broad regex — kept ONLY as the last-resort fallback for
// abilities whose text doesn't name a specific known pool (detectResKey
// returns null). Equivalent to the original RE_PC_TRACKER behavior.
const RE_PC_TRACKER_FALLBACK = /concentraci|psionic energy|puntos? de|superiority|hechicer/i;

// Resolves the actual tracker object for a given resKey, narrowly. Falls
// back to the old "first resource-looking tracker" behavior only when
// resKey is null/unrecognized — see comment above.
function findResTracker(resKey) {
  if (resKey) {
    const def = RESOURCE_TYPES.find(r => r.key === resKey);
    if (def) {
      const t = char.trackers.find(t => def.trackerRe.test(t.label));
      if (t) return t;
    }
  }
  return char.trackers.find(t => RE_PC_TRACKER_FALLBACK.test(t.label));
}

// Display abbreviation for a resource cost badge. Looks up the known
// abbrev for resKey first; falls back to the tracker's own label (the old
// pcAbbrev() behavior for unrecognized/homebrew pools) when resKey is
// null/unmatched, then to a generic placeholder if there's no tracker at all.
function resAbbrev(resKey, fallbackLabel) {
  const def = RESOURCE_TYPES.find(r => r.key === resKey);
  if (def) return def.abbrev;
  return fallbackLabel || 'recurso';
}

function parseFC5eXML(xml) {
  // Strip BOM and any leading whitespace/garbage before <?xml or <character
  xml = xml.replace(/^\uFEFF/, '').trim();
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  const perr = doc.querySelector('parsererror');
  if (perr) throw new Error('XML malformado — ' + perr.textContent.slice(0,150));

  const ch = doc.querySelector('character');
  if (!ch) throw new Error('No se encontró elemento character');

  const name   = $(ch, 'name').split('||')[0].trim();
  const hpMax  = parseInt($(ch, 'hpMax'))     || 10;
  const hpCur  = parseInt($(ch, 'hpCurrent')) || hpMax;

  const scores = $(ch, 'abilities').replace(/,$/, '').split(',').map(Number);
  const [str, dex, con, int_, wis, cha] = scores;
  const m = s => Math.floor((s - 10) / 2);
  const mods = { str:m(str), dex:m(dex), con:m(con), int:m(int_), wis:m(wis), cha:m(cha) };

  // ── Classes (multiclass support) ───────────────────
  const classEls  = $$(ch, 'class');
  const classInfo = classEls.map(c => ({
    el:    c,
    name:  $(c, 'name'),
    level: parseInt($(c, 'level')) || 1
  }));
  const totalLevel = classInfo.reduce((s,c) => s + c.level, 0) || 1;
  const cName = classInfo.map(c => `${c.name} ${c.level}`).join(' / ');
  const prof  = Math.ceil(totalLevel / 4) + 1;
  const raceName = $(ch.querySelector('race'), 'name');

  // ── Trackers (per class, merged) ───────────────────
  let trackers = [];
  classInfo.forEach((ci, classIdx) => {
    const cls = ci.el;

    // Direct <tracker> children of <class> = the curated/selected resources
    [...cls.children].forEach((c, i) => {
      if (c.tagName.toLowerCase() !== 'tracker') return;
      const label = $(c, 'label');
      if (!label) return;
      const type      = parseInt($(c, 'type'))      || 1;
      const resetType = parseInt($(c, 'resetType')) || 0;
      const value     = $(c, 'value') !== '' ? parseInt($(c, 'value')) : null;
      const formula   = $(c, 'formula');
      const fNum      = parseInt(formula);
      const formulaIsNum = !isNaN(fNum) && String(fNum) === formula.trim();

      let max, isDice = false, diceFmt = null;
      if (type === 2 && /d/i.test(formula)) {
        isDice = true; diceFmt = formula;
        max = value ?? 0;
      } else {
        max = formulaIsNum ? fNum : (value ?? 0);
      }

      if (resetType > 0 && max > 0) {
        trackers.push({
          id:`t${classIdx}_${i}`, classIdx, label, type, resetType,
          max, current:max, isDice, diceFmt
        });
      }
    });
  });

  // De-duplicate trackers with same label (keep the one with the larger max)
  const trackerByLabel = {};
  trackers.forEach(t => {
    const key = t.label.toLowerCase();
    if (!trackerByLabel[key] || t.max > trackerByLabel[key].max) trackerByLabel[key] = t;
  });
  trackers = Object.values(trackerByLabel);

  // ── Spell slot trackers (from top-level <slots>, levels 1-9) ──
  // FC5e stores [idx0=?, lvl1, lvl2, ..., lvl9] — index 0 is not a slot level.
  // IMPORTANT: <class> elements also contain their own <slots>, so we must
  // only read the DIRECT child of <character>, not the first descendant match.
  const topSlotsEl = [...ch.children].find(c => c.tagName.toLowerCase() === 'slots');
  const slotsArr = (topSlotsEl?.textContent.trim() || '').replace(/,$/, '').split(',').map(n => parseInt(n) || 0);
  let maxSpellLevel = 0;
  for (let lvl = 1; lvl <= 9; lvl++) {
    const max = slotsArr[lvl] || 0;
    if (max > 0) {
      maxSpellLevel = lvl;
      trackers.push({
        id:`sl${lvl}`, label:`Espacios Nv.${lvl}`, type:1, resetType:2,
        max, current:max, isDice:false, diceFmt:null, isSpellSlot:true, spellLevel:lvl
      });
    }
  }

  // ── Pact Magic slots (Warlock) ──────────────────────
  // Pact Magic is a SEPARATE, independently-recharging slot pool — by RAW
  // it's explicitly excluded from the normal multiclass spell-slot table,
  // confirmed empirically: a pure 20th-level Warlock's top-level <slots>
  // above reads ALL ZEROS. The real slots live on the <class> element's
  // OWN <slots>/<slotsreset> pair instead (slotsreset:1 = short rest —
  // same 1=short/2=long convention used by <tracker><resetType> elsewhere).
  // Non-Pact classes (checked against Dorym, a real multiclass caster)
  // never carry a <slotsreset> tag at all, so this block is a no-op for
  // them — only classes that genuinely have an independent recharge cycle
  // light it up.
  //
  // Kept in a SEPARATE tracker id namespace (pactsl#, not sl#) rather than
  // merged into the regular sl# trackers: a Warlock/caster multiclass can
  // have a Pact slot and a normal slot at the very same nominal level
  // simultaneously (e.g. both 1st level), and those are two genuinely
  // distinct pools on a real character sheet — collapsing them into one
  // shared count would silently merge a short-rest pool with a long-rest
  // one. pactInfoByClassIdx lets the spell-parsing loop below tag which
  // spells should draw from the Pact pool instead of the normal one.
  const pactInfoByClassIdx = {};
  classInfo.forEach((ci, classIdx) => {
    const resetEl = [...ci.el.children].find(c => c.tagName.toLowerCase() === 'slotsreset');
    const resetType = resetEl ? (parseInt(resetEl.textContent) || 2) : 0;
    if (resetType <= 0) return; // no independent recharge cycle declared — not a Pact-style pool

    const ownSlotsEl = [...ci.el.children].find(c => c.tagName.toLowerCase() === 'slots');
    const ownArr = (ownSlotsEl?.textContent.trim() || '').replace(/,$/, '').split(',').map(n => parseInt(n) || 0);
    // RAW Pact Magic only ever has ONE active slot level at a time (it's
    // replaced wholesale as the Warlock levels up), but scan for the
    // highest non-zero entry rather than assuming a fixed index, in case
    // some homebrew "spread" variant ever populates more than one.
    let level = 0, max = 0;
    for (let lvl = 1; lvl <= 9; lvl++) {
      if ((ownArr[lvl] || 0) > 0) { level = lvl; max = ownArr[lvl]; }
    }
    if (level === 0) return;

    pactInfoByClassIdx[classIdx] = { level, max, resetType };
    // Folded into the SAME ceiling as normal slots (not tracked separately)
    // since every place that reads char.maxSpellLevel to cap an upcast
    // stepper still looks the resulting level up via the 'sl' prefix only
    // (never 'pactsl') — so on a pure Warlock or any character without
    // overlapping pools this is exactly right, and on a hypothetical
    // Warlock/caster multiclass (no test data for this combo yet) the
    // worst case is a normal-spell upcast stepper that *displays* one
    // extra selectable level than the character truly has, which simply
    // shows as locked (no tracker found) rather than mis-spending anything.
    maxSpellLevel = Math.max(maxSpellLevel, level);
    trackers.push({
      id:`pactsl${level}`, label:`Espacios de Pacto Nv.${level}`, type:1, resetType,
      max, current:max, isDice:false, diceFmt:null, isSpellSlot:true, spellLevel:level, isPactMagic:true
    });
  });

  // ── Feats: direct <feat> children of <class> = curated/selected list ──
  // (autolevel dumps EVERY subclass option; direct children only contain
  //  what was actually chosen for this character)
  const allFeats = [];
  classInfo.forEach((ci, classIdx) => {
    let direct = [...ci.el.children].filter(c => c.tagName.toLowerCase() === 'feat');
    if (direct.length === 0) {
      // Fallback: very old / minimal exports — scan autolevel
      direct = $$(ci.el, 'feat');
    }
    direct.forEach(f => {
      const n = $(f,'name'), tx = $(f,'text');
      if (n.length > 1) allFeats.push({ name:n, text:tx, source:'class', classIdx });
    });
  });
  ['race','background'].forEach(src => {
    $$(ch.querySelector(src), 'feat').forEach(f => {
      const n = $(f,'name'), tx = $(f,'text');
      if (n.length > 1) allFeats.push({ name:n, text:tx, source:src });
    });
  });

  // ── Items: non-weapon feats + weapon attacks + global spell mods ──
  const allItems = $$(ch, 'item');
  const itemFeats = [];
  const weapons   = [];
  let spellDcBonus = 0, spellAtkBonus = 0;
  allItems.forEach(it => {
    const itName = $(it,'name'), itText = $(it,'text');
    const type   = parseInt($(it,'type'));

    // Global spellcasting modifiers (type 7 = Spell Save DC, type 8 = Spell Attack)
    $$(it,'mod').forEach(md => {
      const mt = parseInt($(md,'type')) || 0;
      const mv = $(md,'value') !== '' ? parseInt($(md,'value')) : 0;
      if (mt === 7) spellDcBonus  += mv;
      if (mt === 8) spellAtkBonus += mv;
    });

    if (WEAPON_TYPES.has(type) && $(it,'damage1H')) {
      weapons.push({
        name: itName,
        type,
        damage1H: $(it,'damage1H'),
        damage2H: $(it,'damage2H'),
        weaponProperty: parseInt($(it,'weaponProperty')) || 0,
        mods: $$(it,'mod').map(md => ({
          type:  parseInt($(md,'type')) || 0,
          value: $(md,'value') !== '' ? parseInt($(md,'value')) : null
        }))
      });
    } else if (itName && itText) {
      itemFeats.push({ name:itName, text:itText, source:'item' });
    }
  });

  // ── Spells: direct <spell> children of each <class> ─────────────
  const spellEntries = [];
  const spellDC = {}; // abilityIdx -> { dc, atk }
  classInfo.forEach((ci, classIdx) => {
    const direct = [...ci.el.children].filter(c => c.tagName.toLowerCase() === 'spell');
    if (!direct.length) return;

    const saIdx = parseInt($(ci.el, 'spellAbility'));
    let abilityIdx = (saIdx >= 0 && saIdx <= 5) ? saIdx : null;

    if (abilityIdx !== null && !spellDC[abilityIdx]) {
      const abMod = mods[ABILITY_KEYS[abilityIdx]];
      spellDC[abilityIdx] = {
        dc:  8 + prof + abMod + spellDcBonus,
        atk: prof + abMod + spellAtkBonus
      };
    }

    const pactLevel = pactInfoByClassIdx[classIdx]?.level || null;

    direct.forEach((s, i) => {
      const sName = $(s,'name'), sText = $(s,'text');
      if (!sName || !sText) return;
      spellEntries.push({
        id:`sp${classIdx}_${i}`,
        name: sName.trim(),
        text: sText,
        level: parseInt($(s,'level')) || 0,
        time: $(s,'time'),
        range: $(s,'range'),
        duration: $(s,'duration'),
        ritual: $(s,'ritual') === '1',
        rolls: $$(s,'roll').map(r => r.textContent.trim()).filter(Boolean),
        abilityIdx,
        pactSlotLevel: pactLevel
      });
    });
  });

  // ── Custom resource pools (Lay on Hands, item charges, etc.) ──
  // MUST run BEFORE buildAbilities so that when buildAbilities searches
  // trackers for ownPool matches (to fix the Imponer las Manos → PH
  // collision), the pool trackers already exist in the array.
  const poolSeen = new Set();
  [...allFeats, ...itemFeats].forEach((e, i) => {
    const key = e.name.toLowerCase();
    if (poolSeen.has(key)) return;
    const pool = detectResourcePool(e.name, e.text, classInfo, totalLevel, mods, prof);
    if (!pool) return;
    poolSeen.add(key);
    trackers.push({
      id:`pool${i}`, label: pool.label, type:1, resetType: pool.resetType,
      max: pool.max, current: pool.max, isDice:false, diceFmt:null, isPool:true
    });
  });

  // Trackers are now complete (native + pool-synthesized); pass them to
  // buildAbilities so ownPool detection works correctly.
  const abilities = buildAbilities(
    [...allFeats, ...itemFeats], totalLevel, mods, prof, weapons, spellEntries, spellDC, trackers
  );

  return { name, hpMax, hpCur, cName, cLvl:totalLevel, classInfo, raceName, prof, mods, trackers, abilities, spellDC, maxSpellLevel };
}

// ── Classify a single ability text ──────────────────
const RE_REACTION = /as a reaction|use (?:your|a) reaction|your reaction to|como reacci[oó]n|reacci[oó]n\s*[-\u2013]|llevar a cabo una reacci/i;
const RE_BONUS    = /as a bonus action|bonus action to|bonus action on your turn|acci[oó]n adicional|acci[oó]n adici[oó]nal|parte de la acci[oó]n adicional/i;
const RE_ACTION   = /as an action[^s]|using an action|as your action|como acci[oó]n[^e]|llevar a cabo la acci[oó]n/i;

function detectAction(name, text) {
  if (RE_REACTION.test(text)) return 'reaction';
  if (RE_BONUS.test(text))    return 'bonus';
  if (RE_ACTION.test(text))   return 'action';
  return null;
}

// ── Classify a spell by its <time> field ────────────
function detectSpellTime(time) {
  const tl = (time || '').toLowerCase();
  if (/reacci|reaction/.test(tl)) return 'reaction';
  if (/bonus action|acci[oó]n adicional/.test(tl)) return 'bonus';
  if (/action|acci[oó]n/.test(tl)) return 'action';
  return 'utility'; // rituals, "X minutes/hours" — outside the turn structure
}

// ── PC / resource cost detection ────────────────────
// "Channel Divinity" usage was previously excluded here because the old
// single shared RE_PC_TRACKER lookup couldn't tell two resource pools
// apart on the same character (see RESOURCE_TYPES above for the full
// story — confirmed colliding with Puntos de Hechicería on Dorym, a
// Paladín/Hechicero). Now that every ability carries its own resKey and
// findResTracker() looks up ONLY that pool, it's safe to detect again.
function detectPCCost(text) {
  const m = text.toLowerCase().match(/(?:gastar|gastando|expend)\s+(?:one|1|(\d+))\s+(?:punto|p\.c\.|psionic energy|superiority)/);
  if (m) return m[1] ? parseInt(m[1]) : 1;
  if (/(?:usar|utilizar)\s+(?:tu\s+)?canalizar divinidad|use your channel divinity/i.test(text)) return 1;
  return 0;
}

// ═══════════════════════════════════════════════════
//  "FREE ACTION" / TRIGGERED FEATURE DETECTION
//  Features that DON'T consume the action economy but
//  DO spend a resource when a trigger condition is met
//  (Divine Smite, Metamagic, etc.)
// ═══════════════════════════════════════════════════
const RE_TRIGGER_WORD    = /\bcuando\b|\bwhen you\b|inmediatamente (?:despu[eé]s|cuando)|immediately after/i;
const RE_SLOTSPEND_SRC   = 'gastar(?:le)?\\s+(?:uno de tus |un )?espacios? de conjuro|expend(?:ing)?\\s+a\\s+spell\\s+slot|consumir(?:[aá]s)?\\s+.*espacio\\s+de\\s+conjuro';
// (RE_VARIABLE_RES removed — superseded by detectResKey()/RESOURCE_TYPES above,
// which both detects AND identifies which specific pool an ability draws from)
const RE_METAMAGIC_CTX   = /lanzas un conjuro|cast(?:ing)? a (?:sorcerer )?spell/i;

// Same phrase as RE_SLOTSPEND_SRC, but rejects matches preceded by a
// negation ("sin gastar"/"without expending") within a short window.
// Without this, free innate-casting traits (Drow High Magic, Fey
// Teleportation — "cast X once, sin gastar un espacio de conjuro") get
// misclassified as Divine-Smite-style triggers, since they're the OPPOSITE:
// spending NO slot at all, not spending one to add bonus damage.
function hasRealSlotSpend(text) {
  const re = new RegExp(RE_SLOTSPEND_SRC, 'gi');
  let m;
  while ((m = re.exec(text))) {
    const before = text.slice(Math.max(0, m.index - 20), m.index);
    if (/\b(sin|without)\b/i.test(before)) continue;
    return true;
  }
  return false;
}

// "You can cast spell X once with this trait, and regain the ability when
// you finish a short/long rest" — the standard racial innate-spellcasting
// pattern (Drow High Magic, Tiefling/Genie lineages, Fey Ancestry variants,
// etc). Not a spell-slot spend, not a fixed/variable point cost, not the
// "N times your level" pool formula — none of our other detectors catch
// it, so today these abilities show up with no usage tracking at all.
//
// Requires "cast"/"lanzar" near "once"/"una vez" (not just "once" anywhere
// in the text) — caught during testing against the Test_PC druid corpus:
// several HB/TP subclass features use "...a number of times equal to your
// Wisdom modifier (minimum of once), and you regain..." which has no
// casting verb at all but would otherwise false-positive on a bare
// once+regain+rest scan, and wrongly collapse a scaling pool into a
// 1-charge tracker. Returns a resetType (1=short, 2=long), or null.
const RE_INNATE_SPELL_ANCHOR = /\bcast\b[\s\S]{0,60}?\bonce\b|\blanzar\b[\s\S]{0,60}?\buna vez\b/gi;

function detectInnateSpellUse(text) {
  const re = new RegExp(RE_INNATE_SPELL_ANCHOR.source, 'gi');
  let m;
  while ((m = re.exec(text))) {
    const isSpanish = /una vez/i.test(m[0]);
    const onceIdx = text.toLowerCase().indexOf(isSpanish ? 'una vez' : 'once', m.index);
    const before = text.slice(Math.max(0, onceIdx - 20), onceIdx);
    if (/minimum of\s*$|m[ií]nimo de\s*$/i.test(before)) continue; // variable-size pool, not innate cast
    const after = text.slice(m.index, m.index + 300);
    const restMatch = after.match(/\bregain\b[\s\S]{0,80}?\b(short|long)\s+rest|\brecuperas\b[\s\S]{0,80}?\bdescanso\s+(corto|largo)/i);
    if (restMatch) {
      const word = (restMatch[1] || restMatch[2] || '').toLowerCase();
      return { resetType: (word === 'short' || word === 'corto') ? 1 : 2 };
    }
  }
  return null;
}

// Parses "Xd Y for/at level 1, plus Zd Y for each level above, up to N d Y"
// style scaling text (Divine Smite and similar). Returns null if the text
// doesn't match this pattern.
function detectScalingDamage(text) {
  const diceRe = /(\d+)d(\d+)/g;
  let m, base = null, perLevel = null, max = null;
  while ((m = diceRe.exec(text))) {
    const before = text.slice(Math.max(0, m.index - 35), m.index);
    const after  = text.slice(m.index + m[0].length, m.index + m[0].length + 55);
    const entry = { n:+m[1], die:+m[2] };
    if (/m[aá]ximo (?:de|of)\s*$|maximum of\s*$/i.test(before)) {
      max = entry;
    } else if (!base && /^[^.]*(?:nivel|level)\s*1\b|^[^.]*1(?:st|°|º)?.?\s*level/i.test(after)) {
      base = entry;
    } else if (!perLevel && /^[^.]*(?:por cada nivel|each (?:spell )?level|cada nivel adicional)/i.test(after)) {
      perLevel = entry;
    }
  }
  if (base && perLevel) {
    let maxN = base.n + 8 * perLevel.n, maxLevel = 9;
    if (max) { maxN = max.n; maxLevel = 1 + Math.round((max.n - base.n) / perLevel.n); }
    return { die: base.die, baseN: base.n, perLevelN: perLevel.n, maxN, maxLevel: Math.min(9, maxLevel) };
  }
  return null;
}

// Classifies a feat that detectAction() couldn't place into action/bonus/
// reaction as a "trigger" — something that fires off another event
// (a hit, casting a spell, etc.) and spends a resource instead of a slot
// in the turn structure.
// Same phrase as RE_SLOTSPEND_SRC, used to catch the NEGATED case (free
// innate casting — Star Map, Draconic Gift's Fog/Invisibility options,
// Drow High Magic) even though hasRealSlotSpend() correctly rejects it as
// a Smite-style trigger. Their actual usage limits vary too much to model
// generically yet (fixed 1, proficiency-bonus-sized, tied to another
// resource's duration) — but without this, they'd vanish from the trigger
// list entirely (confirmed against 5 real Test_PC druid features:
// Star Map, Draconic Gift, Gift of the Green, Walker in Dreams, Verdant
// Grasp), which is worse than showing them untracked.
const RE_FREE_INNATE_CAST = /(?:cast|lanza(?:r|s)?)[\s\S]{0,80}?(?:without expending|sin gastar)[\s\S]{0,30}?(?:spell slot|espacio de conjuro)/i;

function classifyTrigger(text) {
  // Checked BEFORE the RE_TRIGGER_WORD gate below: "cast X once without
  // expending a spell slot" is a strong enough standalone signal on its
  // own — it doesn't need "cuando"/"when you" framing to mean something.
  // Confirmed needed on real data: Warlock's Mystic Arcanum is curated as
  // 4 near-identical feats (6th/7th/8th/9th tier). Only the 6th-tier entry
  // happens to ALSO contain a trailing "...when you finish a long rest"
  // sentence (a scaling note that mentions the other 3 tiers); the 7th/8th
  // /9th tier entries are shorter and never say "cuando"/"when you" at
  // all. Gating on RE_TRIGGER_WORD first meant 3 of the 4 real tiers were
  // silently dropped (matched neither detectAction nor classifyTrigger),
  // even though their matching trackers were already being synthesized
  // correctly by detectResourcePool — the ability just never displayed.
  if (RE_FREE_INNATE_CAST.test(text)) {
    return { triggerKind:'free', pc:0, scaling:null, variablePC:false, resKey:null };
  }
  if (!RE_TRIGGER_WORD.test(text)) return null;

  if (hasRealSlotSpend(text)) {
    return { triggerKind:'smite', pc:0, scaling: detectScalingDamage(text), variablePC:false, resKey:null };
  }
  const fixedPC = detectPCCost(text);
  const isMeta  = RE_METAMAGIC_CTX.test(text);
  if (fixedPC > 0) {
    // detectPCCost already required an explicit spend verb ("gastar"/
    // "expend"/"usar Canalizar Divinidad"), so any resKey it implies is safe.
    return { triggerKind: isMeta ? 'metamagic' : 'resource', pc:fixedPC, scaling:null, variablePC:false, resKey: detectResKey(text) };
  }
  // Fallback: no fixed count found, but the text might still describe a
  // variable-cost spend (Conjuro Gemelo/Twinned Spell scales with target
  // level, etc). Restricted to variableEligible pools ONLY — confirmed
  // false-positive on Rhyo otherwise: "Metabolismo Asombroso" mentions
  // "puntos de concentración" but only to describe REGAINING them
  // ("puedes recuperar todos los puntos... gastados"), not spending any.
  // There's no real 5e mechanic for variable-cost Focus/Channel Divinity
  // spends, so excluding those two keys here removes the false trigger
  // without needing fragile spend-vs-regain verb detection on free text.
  const resKey = detectResKey(text, /*onlyVariableEligible=*/true);
  if (resKey) {
    return { triggerKind: isMeta ? 'metamagic' : 'resource', pc:0, scaling:null, variablePC:true, resKey };
  }
  return null;
}

// ═══════════════════════════════════════════════════
//  CUSTOM RESOURCE POOL / CHARGES DETECTION
//  Features like Lay on Hands ("a pool equal to five times
//  your paladin level") or items with N charges become extra
//  trackers, independent of their action-economy classification.
// ═══════════════════════════════════════════════════
const NUM_WORDS = { uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,
  one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10 };

// Multiplier × class-level pool (e.g. "five times your paladin level").
// Guard: the match must appear in a USES context (preceded by "pool", "uses",
// "number of", or "reserva" within 120 chars) — confirmed false-positive
// without this on Doomsday Device (HB Artificer), where "five times your
// artificer level" describes the HP of a constructed device, and "pool"
// appears later as flavor text ("a pool of acid"). The nearby-word check
// replaces the old whole-text RE_POOL_WORD scan.
const RE_POOL_LEVEL = /(\d+|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|one|two|three|four|five|six|seven|eight|nine|ten)\s*(?:veces|times|[×x])\s*(?:tu nivel de\s+([a-záéíóúñ]+)|your\s+([a-z]+)\s+level)/i;
const RE_POOL_CONTEXT = /\b(?:pool|reserva|piscina|uses?|usos?|number of charges|cargas?)\b/i;

// Charges ("has N charges"). Guard: if "this item"/"this weapon"/"this armor"/
// "this device" immediately precedes the match, it's describing an ITEM's
// stats inside a feat's d20 table, not the feature's own uses — confirmed on
// Expanded Contraptions (HB Artificer): "This item has 4 charges".
// Intentionally does NOT block "the staff has 10 charges" or generic "the
// [noun] has N charges" — those are legitimate item pools (Staff of the
// Woodlands). Only "this [category]" (pointing to a table entry) is excluded.
const RE_CHARGES = /(?:tiene|has|with)\s+(\d+)\s+(?:cargas?|charges)/i;
const RE_CHARGES_ITEM_PREFIX = /\bthis\s+(?:item|weapon|armor|device|cantrip|tool)\s*$/i;

// "N times equal to your [ability] modifier (minimum of once)" and
// "N times equal to your proficiency bonus" — confirmed needed against
// ALL six characters in the corpus: Bo (STR/CON/WIS), Rhyo (WIS/CON
// via Focus), Dorym (CHA), Test_PC Druid (WIS/PB), Warlock (CHA/PB),
// and 38 feats in the Artificer (INT/PB). Currently NONE of these produce
// a tracker unless they also happen to have a native <tracker> element —
// the feature displays but with no visible usage limit.
//
// "minimum of once"/"minimum of 1" guard prevents synthesizing a tracker
// for abilities that just mention "healing equal to your INT modifier" or
// "damage equal to your CHA modifier" — those contain the same phrase
// structure but are NOT pool-size formulas.
const RE_SCALING_BY_MOD = /number of times equal to(?:\s+(?:twice|double|half))?\s+your\s+(strength|dexterity|constitution|intelligence|wisdom|charisma|str|dex|con|int|wis|cha)\s+modifier|veces igual a tu modificador de\s+(fuerza|destreza|constituci[oó]n|inteligencia|sabidur[ií]a|carisma)/i;
const RE_SCALING_BY_PROF = /number of times equal to your proficiency bonus|veces igual a tu bono de competencia/i;
const RE_SCALING_REGAIN = /\bregain(?:\s+all)?\s+(?:expended\s+)?uses|\brecuperas?\s+(?:todos\s+los\s+usos|las\s+cargas?)/i;

// Multiplier modifiers for "twice/double/half" variants
const RE_SCALING_MULT = /\b(twice|double)\b/i;
const RE_SCALING_HALF = /\bhalf\b/i;

const ABILITY_MOD_NAME = {
  strength:'str', str:'str', fuerza:'str',
  dexterity:'dex', dex:'dex', destreza:'dex',
  constitution:'con', con:'con', 'constituci\u00f3n':'con', constitucion:'con',
  intelligence:'int', int:'int', inteligencia:'int',
  wisdom:'wis', wis:'wis', 'sabidur\u00eda':'wis', sabiduria:'wis',
  charisma:'cha', cha:'cha', carisma:'cha'
};

function stripAccents(s) {
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

// Returns a tracker-shaped object, or null if no pool/charges pattern found.
// mods and prof are passed through from parseFC5eXML to resolve scaling formulas.
function detectResourcePool(name, text, classInfo, totalLevel, mods, prof) {
  const resetType = /short rest|descanso corto/i.test(text) ? 1 : 2;

  // ── Multiplier × level (e.g. "five times your paladin level") ──────
  const m1 = text.match(RE_POOL_LEVEL);
  if (m1) {
    // Require pool-context word within 120 chars of the match (not anywhere
    // in the full feat text, to avoid matching HP formulas of summoned creatures)
    const nearCtx = text.slice(Math.max(0, m1.index - 120), m1.index + 120);
    if (RE_POOL_CONTEXT.test(nearCtx)) {
      const raw = m1[1].toLowerCase();
      const mult = NUM_WORDS[raw] ?? parseInt(raw);
      const classWord = stripAccents(m1[2] || m1[3] || '');
      let lvl = totalLevel;
      const match = classInfo.find(ci => {
        const cw = stripAccents(ci.name).trim();
        return cw && (cw.includes(classWord) || classWord.includes(cw));
      });
      if (match) lvl = match.level;
      else if (classInfo.length === 1) lvl = classInfo[0].level;
      const max = mult * lvl;
      if (max > 0) return { label:name, max, resetType, isPool:true };
    }
  }

  // ── N charges on an item/feature ────────────────────────────────
  const m2 = text.match(RE_CHARGES);
  if (m2) {
    const before30 = text.slice(Math.max(0, m2.index - 30), m2.index);
    if (!RE_CHARGES_ITEM_PREFIX.test(before30)) {
      const max = parseInt(m2[1]);
      if (max > 0) return { label:name, max, resetType, isPool:true };
    }
  }

  // ── N times equal to [ability modifier / proficiency bonus] ─────
  // Only synthesize a pool when the text also contains a regain-uses
  // phrase ("regain all expended uses when you finish a rest") — this
  // guards against false matches where "N times equal to your X modifier"
  // describes a damage bonus or healing amount, not a use-count formula.
  if (mods && RE_SCALING_REGAIN.test(text)) {
    const mMod = text.match(RE_SCALING_BY_MOD);
    if (mMod) {
      const rawName = stripAccents(mMod[1] || mMod[2] || '');
      const key = ABILITY_MOD_NAME[rawName];
      if (key && mods[key] !== undefined) {
        // "twice/double your X modifier" or "half your X modifier" variants
        const multStr = text.slice(Math.max(0, mMod.index - 30), mMod.index);
        let base = mods[key];
        if (RE_SCALING_MULT.test(multStr)) base = base * 2;
        else if (RE_SCALING_HALF.test(multStr)) base = Math.ceil(base / 2);
        const max = Math.max(1, base);   // "minimum of once" → at least 1
        return { label:name, max, resetType, isPool:true };
      }
    }
    const mProf = text.match(RE_SCALING_BY_PROF);
    if (mProf && prof) {
      return { label:name, max: Math.max(1, prof), resetType, isPool:true };
    }
  }

  // ── Innate spellcasting (racial "cast once, regain on rest") ─────
  const innate = detectInnateSpellUse(text);
  if (innate) return { label:name, max:1, resetType:innate.resetType, isPool:true };

  return null;
}

// ── Short description from full text ───────────────
function shortDesc(text) {
  const clean = text.replace(/\n/g,' ').replace(/\s+/g,' ').trim();
  const m = clean.match(/^.{20,140}?[.!?]/);
  if (m) return m[0];
  return clean.slice(0, 130) + (clean.length > 130 ? '…' : '');
}
function fullDescClean(text) {
  return text.replace(/\n{2,}/g,'\n').trim();
}

// ═══════════════════════════════════════════════════
//  ACTIVE EFFECTS ENGINE
// ═══════════════════════════════════════════════════
//  G.activeEffects = {
//    [id]: { id, label, sourceId, concentration, duration,
//             roundsLeft, appliesTo, mechanicFlags:[] }
//  }
//  G.encounterState = {
//    targetParalyzed: bool, targetAsleep: bool,
//    targetProne: bool, targetBlinded: bool,
//    targetConc: bool, numTargets: int, alliesInRange: int
//  }
//
//  mechanicFlags (strings consumed by buildSuggestions):
//    'extra_attack_action'    → Haste: 1 acción extra de ataque por turno
//    'double_speed'           → Haste: velocidad x2
//    'prevents_spellcasting'  → Rabia: no puede lanzar conjuros
//    'advantage_atk'          → ventaja en ataques (invisible, Blessing…)
//    'disadvantage_atk'       → desventaja en ataques
//    'bps_resistance'         → resistencia a cortante/perforante/contundente
//    'advantage_saving'       → ventaja en saving throws
//    'ac_bonus'               → bonus de CA mientras activo
//    'atk_bonus'              → bonus a ataques mientras activo
//    'crit_range_19'          → crítico en 19-20 (Champion Fighter, etc.)
//    'additional_spell_action' → puede lanzar un conjuro adicional (acción del hechizo)
//    'temp_hp_regen'          → regenera THP cada turno
// ═══════════════════════════════════════════════════

// EFFECT_CATALOG: named effect templates.
// Each ability/spell that generates an effect refers to one of these by key.
// The parser tags abilities at parse-time with an 'effectKey' field; the
// render uses that to offer an "Activar efecto" button; G.activeEffects
// stores the live instance with its runtime state.
const EFFECT_CATALOG = {
  haste_self: {
    label: '⚡ Acelerar (propio)',
    mechanicFlags: ['extra_attack_action', 'double_speed', 'ac_bonus'],
    concentration: true,
    appliesTo: 'self'
  },
  haste_ally: {
    label: '⚡ Acelerar (aliado)',
    mechanicFlags: [],           // no self-benefit
    concentration: true,
    appliesTo: 'ally'
  },
  rage: {
    label: '🔥 Rabia',
    mechanicFlags: ['advantage_atk', 'bps_resistance', 'prevents_spellcasting'],
    concentration: false,
    appliesTo: 'self'
  },
  bless: {
    label: '✨ Bendición (propio)',
    mechanicFlags: ['advantage_saving', 'atk_bonus'],
    concentration: true,
    appliesTo: 'self'
  },
  bless_ally: {
    label: '✨ Bendición (aliados)',
    mechanicFlags: [],
    concentration: true,
    appliesTo: 'ally'
  },
  invisibility_self: {
    label: '👁️ Invisibilidad (propio)',
    mechanicFlags: ['advantage_atk', 'disadvantage_vs_self'],
    concentration: true,
    appliesTo: 'self'
  },
  invisibility_ally: {
    label: '👁️ Invisibilidad (aliado)',
    mechanicFlags: [],
    concentration: true,
    appliesTo: 'ally'
  },
  aid: {
    label: '🛡️ Auxilio',
    mechanicFlags: ['temp_hp_regen'],
    concentration: false,
    appliesTo: 'ally'
  },
  shield_of_faith: {
    label: '🛡️ Escudo de Fe',
    mechanicFlags: ['ac_bonus'],
    concentration: true,
    appliesTo: 'self'
  },
  hex: {
    label: '🎯 Maldición',
    mechanicFlags: ['hex_active'],     // bonus d6 daño en ataques
    concentration: true,
    appliesTo: 'target'
  },
  hunters_mark: {
    label: '🎯 Marca del Cazador',
    mechanicFlags: ['hunters_mark_active'],
    concentration: true,
    appliesTo: 'target'
  },
  faerie_fire: {
    label: '✨ Fuego de las Hadas',
    mechanicFlags: ['advantage_atk'],  // advantage against lit targets
    concentration: true,
    appliesTo: 'target'
  },
  hypnotic_pattern: {
    label: '🌀 Modelo Hipnótico',
    mechanicFlags: ['control_aoe_active'],
    concentration: true,
    appliesTo: 'area'
  },
  spirit_guardians: {
    label: '👼 Guardianes Espirituales',
    mechanicFlags: ['spirit_guardians_active'],
    concentration: true,
    appliesTo: 'self'
  },
  concentration_generic: {
    label: '🔮 Concentración (activa)',
    mechanicFlags: [],
    concentration: true,
    appliesTo: 'generic'
  }
};

// ── Text patterns → effectKey detection ──────────────
// Checked at parse time on every action/bonus/utility ability/spell.
// Order matters: first match wins for each ability.
const EFFECT_TAG_RULES = [
  // Haste / Acelerar
  { key:'haste_self',     selfOrAlly:true,
    re:/\bace?le(?:rate?|rar)\b.*(?:you gain an additional action|ganas? una acci[oó]n adicional)|velocidad se duplica|doubl(?:es?|ing) (?:your )?speed/i },
  // Rage / Rabia (Barbarian)
  { key:'rage',           selfOrAlly:false,
    re:/entras? en est(?:ado de )?rabia|you enter a rage\b|while raging/i },
  // Bless / Bendición
  { key:'bless',          selfOrAlly:true,
    re:/\bbendicione?s?\b|\bbless(?:ing)?\b/i },
  // Hex / Maldición de Brujo
  { key:'hex',            selfOrAlly:false,
    re:/\bhex\b(?! blade)|\bmaldici[oó]n\b(?!.*enfermedad)/i },
  // Hunter's Mark / Marca del Cazador
  { key:'hunters_mark',   selfOrAlly:false,
    re:/marca del cazador|hunter'?s? mark/i },
  // Faerie Fire / Fuego de las Hadas
  { key:'faerie_fire',    selfOrAlly:false,
    re:/faerie fire|fuego de (?:la[sz]? )?hadas?/i },
  // Hypnotic Pattern / Modelo Hipnótico
  { key:'hypnotic_pattern', selfOrAlly:false,
    re:/hypnotic pattern|modelo hipn[oó]tico/i },
  // Spirit Guardians / Guardianes Espirituales
  { key:'spirit_guardians', selfOrAlly:false,
    re:/spirit guardians?|guardianes? espirituales?/i },
  // Invisibility / Invisibilidad — requires "become invisible", not just "invisible"
  // (the Shield spell text says "an invisible barrier" but that's not a buff on the caster)
  { key:'invisibility_self', selfOrAlly:true,
    re:/\binvisibilit(?:y|ies)\b|(?:te vuelves?|become[s]?)\s+invisible/i },
  // Aid / Auxilio
  { key:'aid',            selfOrAlly:false,
    re:/\baid\b|\bauxilio\b/i },
  // Shield of Faith / Escudo de Fe
  { key:'shield_of_faith', selfOrAlly:false,
    re:/shield of faith|escudo de fe/i },
];

// detectEffectKey: returns the first matching effectKey for a given ability,
// plus whether it needs a Self/Ally mode selector.
function detectEffectKey(name, text) {
  const combined = (name + ' ' + text).replace(/\n/g,' ');
  for (const rule of EFFECT_TAG_RULES) {
    if (rule.re.test(combined)) {
      return { effectKey: rule.key, selfOrAlly: rule.selfOrAlly };
    }
  }
  // Generic concentration detection: spells that say "concentration" in
  // their duration and have buff/defense/control effects should at least
  // mark that casting them starts concentration, so the engine can filter
  // out other concentration spells from suggestions.
  if (/\bconcentraci[oó]n\b|\bconcentration\b/i.test(combined) &&
      (/(buff|defense|control|heal)/.test((text+name).toLowerCase()))) {
    return { effectKey: 'concentration_generic', selfOrAlly: false };
  }
  return null;
}

// ── Active effects helpers ───────────────────────────
function hasEffect(flag) {
  return Object.values(G.activeEffects || {}).some(e => e.mechanicFlags.includes(flag));
}
function isConcentrating() {
  return Object.values(G.activeEffects || {}).some(e => e.concentration);
}
function activateEffect(sourceId, effectKey, appliesTo) {
  const catalog = EFFECT_CATALOG[effectKey];
  if (!catalog) return;
  // Break existing concentration if activating a new concentration spell
  if (catalog.concentration && isConcentrating()) {
    breakConcentration();
  }
  const id = `eff_${sourceId}_${effectKey}`;
  if (!G.activeEffects) G.activeEffects = {};
  G.activeEffects[id] = {
    id, label: catalog.label,
    sourceId, effectKey,
    concentration: catalog.concentration,
    appliesTo: appliesTo || catalog.appliesTo,
    mechanicFlags: [...catalog.mechanicFlags],
    roundsLeft: null
  };
  save(); render();
}
function deactivateEffect(id) {
  if (G.activeEffects) delete G.activeEffects[id];
  save(); render();
}
function breakConcentration() {
  if (!G.activeEffects) return;
  Object.keys(G.activeEffects).forEach(id => {
    if (G.activeEffects[id].concentration) delete G.activeEffects[id];
  });
}
function tickEffects() {
  if (!G.activeEffects) return;
  Object.entries(G.activeEffects).forEach(([id, eff]) => {
    if (eff.roundsLeft !== null) {
      eff.roundsLeft--;
      if (eff.roundsLeft <= 0) delete G.activeEffects[id];
    }
  });
}


//  Classifies any ability/spell by what it DOES, based on
//  its description text (bilingual EN/ES). Powers the
//  generic "Sugerencias" combo system below.
// ═══════════════════════════════════════════════════
const TAG_RULES = [
  { tag:'heal',    re:/recuper(?:as?|aci[oó]n)\b|san(?:a|ar|as|aci[oó]n)\b|cura(?:s|ci[oó]n)?\b|regain.*hit points|hit points.*regain|heal(?:ing)?\b/i },
  { tag:'defense', re:/resistencia a|resistance to|puntos de golpe temporal|temporary hit points|\bca\s*\+|armor class|esquivar|dodge|cobertura total|immunity|inmunidad/i },
  { tag:'mobility',re:/velocidad de (?:vuelo|excavaci[oó]n|trepar|nataci[oó]n)|flying speed|teletransport|teleport|salto.*(?:pies|feet)|jump|no provoca? ataques? de oportunidad|without provoking opportunity/i },
  { tag:'damage',  re:/\d+d\d+|puntos? de da[ñn]o|hit points of damage|damage\b/i },
  { tag:'buff',    re:/ventaja en|advantage on|bonificador (?:a|de)|bonus to|gana[ns]? .* puntos de golpe m[aá]ximos|increases by/i },
];

// Condition keywords (used both for "control" — inflicting — and for
// detecting "cure" abilities, which remove these same conditions).
// NOTE: "invisible"/"invisibility" deliberately excluded — invisibility is
// almost always a buff (defense/utility), not an offensive control effect,
// so adding it here would misclassify the Invisibility spell as "control".
const RE_CONDITION = /aturdid|paraliz|asustad[oa]|incapacitad|derribad[oa]|apresad[oa]|ralentiz|hechizad[oa]|cegad[oa]|ensordecid[oa]|envenenad[oa]|agotamiento|inconscien|stunned|paralyz|frightened|incapacitated|prone|restrained|grappled|slowed|charmed|blinded|deafened|poisoned|petrif|exhaust|unconscious/i;
// "ends/cures/removes a condition" — these are SUPPORT, not control.
const RE_CURE = /termina(?:s|r)?\s+(?:un[oa]?|uno de|with|one of)|ends? (?:one of |a )?(?:the following )?condition|cures?\b|elimina(?:s|r)?\s+(?:un[oa]?|uno de)|remove(?:s)?\s+(?:one|a|the)|restablec/i;

function tagAbility(ab) {
  const text = (ab.full || ab.desc || '') + ' ' + (ab.name || '');
  const tags = [];
  for (const r of TAG_RULES) if (r.re.test(text)) tags.push(r.tag);

  if (RE_CONDITION.test(text)) {
    if (RE_CURE.test(text)) {
      if (!tags.includes('heal')) tags.push('heal'); // curing a condition = support
    } else {
      tags.push('control'); // inflicting a condition on a target
    }
  }

  if (!tags.length) tags.push('utility');
  return tags;
}

// ── Rough average-damage estimate for ranking "best damage" ──
// Prefers <roll> from the XML (already-resolved dice, e.g. "2d8+%0") over
// regexing the description text, which is fragile (catches the first
// NdM+K it finds, even if it's flavor text rather than the actual damage).
// A spell can have multiple <roll> entries (e.g. duplicate cross-class
// listings, or primary+secondary effects) — we take the highest average,
// since "best damage" ranking just needs a representative top estimate.
function estimateDamage(ab) {
  if (ab.dmgEstimate != null) return ab.dmgEstimate; // precomputed for weapon/unarmed attacks
  if (ab.rolls && ab.rolls.length) {
    let best = 0;
    ab.rolls.forEach(r => {
      const modStr = ab.spellAbilityMod != null ? String(ab.spellAbilityMod) : '0';
      const resolved = r.replace(/%0/g, modStr);
      const m = resolved.match(/(\d+)d(\d+)(?:\s*\+\s*(-?\d+))?/);
      if (m) {
        const n = +m[1], die = +m[2], bonus = m[3] ? +m[3] : 0;
        const avg = Math.round((n * (die+1) / 2 + bonus) * 10) / 10;
        if (avg > best) best = avg;
      }
    });
    if (best > 0) return best;
  }
  const text = ab.full || ab.desc || '';
  const m = text.match(/(\d+)d(\d+)(?:\s*\+\s*(\d+))?/);
  if (!m) return 0;
  const n = +m[1], die = +m[2], bonus = m[3] ? +m[3] : 0;
  return Math.round((n * (die+1) / 2 + bonus) * 10) / 10;
}

// Passive feats to skip (headers that describe a mechanics system rather
// than a specific always-on benefit):
const SKIP_PASSIVE = /^((?:clase |class )?(?:inicial|starting)|convertirse en|atributos b[aá]sicos|lanzamiento de conjuros|spellcasting|estilo de combate$|fighting style$|juramento sagrado|sacred oath|martial archetype|archetipo marcial|artificer speciali|eldritch invocations?|invocaciones m|pact boon|boon of|battle ready|weapon bond|arcane armor$|spell\s*casting$|forma de magia|forma mágica|^(fighter|barbarian|wizard|cleric|druid|paladin|monk|rogue|ranger|bard|sorcerer|warlock|artificer)$|creating (a|an)|ability score (increase|improvement)|extra attack$|ataque adicional$|indomitable$|martial versatility$|versatilidad marcial$|subclase de|nivel \d+:)/i;
// HEADERS that explain a mechanic but aren't themselves a usable ability
// — the real options live in separate sibling feats with their own names
// (e.g. Dorym's actual Channel Divinity picks are "Ira de la Naturaleza"
// and "Expulsar Infieles", not a feat literally named "Canalizar
// Divinidad"). Confirmed via Test_PC/Dorym: without this, the header text
// ("...utilizar Canalizar Divinidad...", "cuando empleas...") matches the
// channeldivinity resKey pattern just like the real options do, creating
// a phantom third "ability" that duplicates/shadows the real ones.
// "Artificer Specialist" is the equivalent header for all Artificer
// subclass descriptions — each concrete subclass option is its own feat
// with the pattern "Artificer Specialist: [Name]".
const SKIP_NAMES_EXACT = /^(canalizar divinidad|channel divinity|artificer specialist)$/i;

const SKIP_NAMES = /^(description|descripci[oó]n|characteristics|caracter[ií]sticas|suggested characteristics|specialty|talent|starting\s|multiclass|proficiency|equipment|languages|idiomas|age|size|speed|ability score improvement|style$|instructor$|well-rounded|trained for|creating a|heraldic|xanathar|artificers? in many worlds|creating an artificer|tool proficiency|tools of the trade|the right tool|spellcasting$)/i;

function buildAbilities(entries, level, mods, prof, weapons, spellEntries, spellDC, trackers) {
  const out = { action:[], bonus:[], reaction:[], utility:[], trigger:[], passive:[] };


  const attacks = level >= 11 ? 3 : level >= 5 ? 2 : 1;

  // ── Base unarmed attack ──────────────────────────
  const abMod   = Math.max(mods.str, mods.dex);
  const unarmedB = abMod + prof;
  const unarmedSign = abMod >= 0 ? '+' : '';
  const unarmedDie = level >= 5 ? 8 : 4;
  const unarmedD = `1d${unarmedDie}${unarmedSign}${abMod}`;
  const unarmedObj = {
    id:'__attack', name:'Atacar (sin armas)',
    desc:`${attacks} ${attacks>1?'ataques':'ataque'} · +${unarmedB} al impacto · ${unarmedD}`,
    full:null, pc:0, once:false, source:'class', spellLevel:0, dc:null,
    dmgEstimate: Math.round(attacks * ((unarmedDie+1)/2 + abMod) * 10) / 10
  };
  unarmedObj.tags = tagAbility(unarmedObj);
  out.action.push(unarmedObj);

  // ── Weapon attacks ────────────────────────────────
  weapons.filter(w => !/unarmed|sin armas/i.test(w.name)).forEach((w, wi) => {
    const finesse  = (w.weaponProperty & FINESSE_BIT) !== 0;
    const isRanged = w.type === 6;
    const abMod    = isRanged ? mods.dex : (finesse ? Math.max(mods.str, mods.dex) : mods.str);

    let modAtk = 0, modDmg = 0, hasMods = false;
    (w.mods || []).forEach(md => {
      if (md.type === 1) {           // Weapon Attacks (+) modifier
        hasMods = true;
        const v = md.value != null ? md.value : prof; // "no value" = + Proficiency Bonus
        modAtk += v;
        if (md.value == null) modDmg += v; // extra prof-style mods also boost damage
      } else if (md.type === 2) {    // Weapon Damage (+) modifier
        hasMods = true;
        modDmg += (md.value != null ? md.value : prof);
      }
    });

    // Fallback for weapons without explicit <mod> data: read "+N" from the name
    if (!hasMods) {
      const magicM = w.name.match(/\+(\d)\b/);
      const magicB = magicM ? parseInt(magicM[1]) : 0;
      modAtk = magicB; modDmg = magicB;
    }

    const atkB    = abMod + prof + modAtk;
    const dmgB    = abMod + modDmg;
    const dmgSign = dmgB >= 0 ? '+' : '';
    let dmgStr = `${w.damage1H}${dmgSign}${dmgB}`;
    if (w.damage2H) dmgStr += ` (2 manos: ${w.damage2H}${dmgSign}${dmgB})`;

    const diceM = w.damage1H.match(/(\d+)d(\d+)/);
    const dmgEst = diceM ? (+diceM[1] * (+diceM[2]+1)/2 + dmgB) : dmgB;

    const wObj = {
      id:`w${wi}`, name:`Atacar con ${w.name}`,
      desc:`${attacks} ${attacks>1?'ataques':'ataque'} · +${atkB} al impacto · ${dmgStr}`,
      full:null, pc:0, once:false, source:'weapon', spellLevel:0, dc:null,
      dmgEstimate: Math.round(attacks * dmgEst * 10) / 10
    };
    wObj.tags = tagAbility(wObj);
    out.action.push(wObj);
  });

  // ── Feats / item abilities ────────────────────────
  const seen = new Set();
  entries.forEach((e, idx) => {
    if (SKIP_NAMES.test(e.name) || SKIP_NAMES_EXACT.test(e.name.trim())) return;
    if (e.text.length < 30) return;

    const key = e.name.toLowerCase();
    if (seen.has(key)) return;

    const pushTrigger = (trig) => {
      seen.add(key);
      const desc = shortDesc(e.text);
      const full = fullDescClean(e.text);
      const obj = {
        id:`e${idx}`, name:e.name, desc,
        full: (full !== desc ? full : null),
        pc:trig.pc, once:false, source:e.source, spellLevel:0, dc:null,
        triggerKind: trig.triggerKind, scaling: trig.scaling, variablePC: trig.variablePC,
        resKey: trig.resKey
      };
      obj.tags = tagAbility(obj);
      out.trigger.push(obj);
    };

    // Metamagic options modify a spell being cast — their text often
    // describes the EFFECT in action-economy terms (e.g. "...the casting
    // time becomes 1 bonus action"), which would otherwise be mistaken
    // for the feature's OWN cost. Metamagic always wins.
    const trig = classifyTrigger(e.text);
    if (trig && trig.triggerKind === 'metamagic') { pushTrigger(trig); return; }

    const type = detectAction(e.name, e.text);

    if (!type) {
      // Not tied to the action economy — maybe it's a triggered/"free"
      // feature (Divine Smite, Stunning Strike, etc.) that spends a resource.
      if (trig) { pushTrigger(trig); return; }

      // Passive / always-on traits: show in dedicated section if the text
      // has meaningful mechanical content (≥40 chars, not pure proficiency
      // or flavor). Confirmed useful against all 6 corpus characters.
      const desc = shortDesc(e.text);
      if (e.text && e.text.length >= 40 && desc.length >= 20 && !SKIP_PASSIVE.test(e.name.trim())) {
        seen.add(key);
        const full = fullDescClean(e.text);
        out.passive.push({
          id:`e${idx}`, name:e.name, desc,
          full:(full!==desc?full:null), source:e.source
        });
      }
      return;
    }

    seen.add(key);

    // If this ability has its own named resource pool (e.g. "Imponer las
    // Manos" has a 40-point healing pool), set pc=0 and store ownPool so
    // the render can show an inline pool stepper instead of charging from
    // an unrelated sorcery/PC tracker. Without this, the "gastar 5 puntos
    // de golpe de tu reserva" phrase in the Lay on Hands description was
    // matching detectPCCost (which finds any "gastar N puntos"), and then
    // the null resKey fell back to RE_PC_TRACKER_FALLBACK, which picked
    // "Puntos de Hechicería" on Dorym — confirmed live bug.
    const poolTracker = (trackers || []).find(t =>
      t.isPool && t.label.toLowerCase() === e.name.trim().toLowerCase()
    );
    const pc     = poolTracker ? 0 : detectPCCost(e.text);
    const resKey = pc > 0 ? detectResKey(e.text) : null;
    const ownPool = poolTracker?.id ?? null;
    const once   = /once (?:on each|per) turn|una vez por turno/i.test(e.text);
    const desc   = shortDesc(e.text);
    const full   = fullDescClean(e.text);
    const effInfo = detectEffectKey(e.name, e.text);

    const obj = {
      id:`e${idx}`, name:e.name, desc,
      full: (full !== desc ? full : null),
      pc, once, source:e.source, spellLevel:0, dc:null, resKey, ownPool,
      effectKey: effInfo?.effectKey ?? null,
      selfOrAlly: effInfo?.selfOrAlly ?? false
    };
    obj.tags = tagAbility(obj);
    out[type].push(obj);
  });

  // ── Spells ─────────────────────────────────────────
  const RE_SAVE = /salvaci[oó]n de|tirada de salvaci[oó]n|saving throw/i;
  (spellEntries || []).forEach(sp => {
    const stype = detectSpellTime(sp.time);

    const key = sp.name.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);

    const dcInfo = (sp.abilityIdx !== null) ? spellDC[sp.abilityIdx] : null;
    const hasSave = RE_SAVE.test(sp.text);
    const dc = (hasSave && dcInfo) ? dcInfo.dc : null;

    const levelLabel = sp.level === 0 ? 'Truco' : `Nivel ${sp.level}`;
    const metaParts = [levelLabel];
    if (sp.ritual) metaParts.push('Ritual');
    if (sp.time && stype === 'utility') metaParts.push(sp.time);
    if (sp.range)    metaParts.push(sp.range);
    if (sp.duration && !/^instantaneous|^instant[aá]neo/i.test(sp.duration)) metaParts.push(sp.duration);

    let full = fullDescClean(sp.text);
    if (sp.range || sp.duration) {
      full = `${sp.range ? 'Alcance: '+sp.range : ''}${sp.range && sp.duration ? ' · ' : ''}${sp.duration ? 'Duración: '+sp.duration : ''}\n\n${full}`;
    }
    const desc = shortDesc(sp.text);
    const spellAbilityMod = (sp.abilityIdx !== null) ? mods[ABILITY_KEYS[sp.abilityIdx]] : null;
    const effInfo = detectEffectKey(sp.name, sp.text);

    const obj = {
      id: sp.id, name: sp.name, desc,
      full: (full !== desc ? full : null),
      pc:0, once:false, source:'spell',
      spellLevel: sp.level, dc,
      meta: metaParts.join(' · '),
      rolls: sp.rolls, spellAbilityMod,
      slotPrefix: sp.pactSlotLevel ? 'pactsl' : 'sl',
      slotLevel: sp.pactSlotLevel || sp.level,
      effectKey: effInfo?.effectKey ?? null,
      selfOrAlly: effInfo?.selfOrAlly ?? false
    };
    obj.tags = tagAbility(obj);
    out[stype].push(obj);
  });

  return out;
}

// ═══════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════
function render() {
  if (!char) return;
  SHORT_DESC = {}; FULL_DESC = {};

  document.getElementById('hdr-name').textContent = char.name;
  document.getElementById('hdr-meta').textContent =
    `${char.cName} · ${char.raceName}`;
  document.getElementById('hdr-round').textContent = G.round;

  const hp = G.hp ?? char.hpCur;
  let h = '';

  // ── HP ──────────────────────────────────────────
  const tempHp = G.tempHp || 0;
  h += `<div class="hp-row">
