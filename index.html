    <span class="hp-label">Puntos de golpe</span>
    <div class="hp-controls">
      ${tempHp > 0 ? `<span class="hp-temp">+${tempHp}</span>` : ''}
      <button class="adj-btn" onclick="chHP(-1)">−</button>
      <div class="hp-val" onclick="toggleCalc()">${hp}<span class="hp-max"> / ${char.hpMax}</span></div>
      <button class="adj-btn" onclick="chHP(1)">+</button>
      <button class="calc-btn ${calcOpen?'open':''}" onclick="toggleCalc()" title="Calculadora">🧮</button>
    </div>
  </div>`;

  if (calcOpen) {
    const exprEmpty = calcExpr.length === 0;
    h += `<div class="calc-panel">
      <div class="calc-display ${exprEmpty?'empty':''}">${esc(calcExpr || '0')}</div>
      <div class="calc-grid">
        <button class="calc-key die" onclick="calcRoll(4)">d4</button>
        <button class="calc-key die" onclick="calcRoll(6)">d6</button>
        <button class="calc-key die" onclick="calcRoll(8)">d8</button>
        <button class="calc-key clear" onclick="calcBackspace()">⌫</button>

        <button class="calc-key die" onclick="calcRoll(10)">d10</button>
        <button class="calc-key die" onclick="calcRoll(12)">d12</button>
        <button class="calc-key die" onclick="calcRoll(20)">d20</button>
        <button class="calc-key op" onclick="calcKey('/')">÷</button>

        <button class="calc-key" onclick="calcKey('7')">7</button>
        <button class="calc-key" onclick="calcKey('8')">8</button>
        <button class="calc-key" onclick="calcKey('9')">9</button>
        <button class="calc-key op" onclick="calcKey('*')">×</button>

        <button class="calc-key" onclick="calcKey('4')">4</button>
        <button class="calc-key" onclick="calcKey('5')">5</button>
        <button class="calc-key" onclick="calcKey('6')">6</button>
        <button class="calc-key op" onclick="calcKey('-')">−</button>

        <button class="calc-key" onclick="calcKey('1')">1</button>
        <button class="calc-key" onclick="calcKey('2')">2</button>
        <button class="calc-key" onclick="calcKey('3')">3</button>
        <button class="calc-key op" onclick="calcKey('+')">+</button>

        <button class="calc-key" onclick="calcKey('0')">0</button>
        <button class="calc-key" onclick="calcKey('(')">(</button>
        <button class="calc-key" onclick="calcKey(')')">)</button>
        <button class="calc-key clear" onclick="calcClear()">C</button>
      </div>
      <div class="calc-actions">
        <button class="calc-act calc-heal" onclick="calcApply('heal')">CURAR</button>
        <button class="calc-act calc-temp" onclick="calcApply('temp')">PG TEMP</button>
        <button class="calc-act calc-dmg" onclick="calcApply('damage')">DAÑO</button>
      </div>
    </div>`;
  }

  // ── Spell DC / attack bonus ───────────────────────
  const dcKeys = Object.keys(char.spellDC || {});
  if (dcKeys.length > 0) {
    h += `<div class="dc-row">`;
    dcKeys.forEach(k => {
      const info = char.spellDC[k];
      const ab = ABILITY_ES[parseInt(k)] || '';
      h += `<div class="dc-badge">CD conjuros (${ab}): <b>${info.dc}</b></div>`;
      h += `<div class="dc-badge">Ataque conjuros: <b>+${info.atk}</b></div>`;
    });
    h += `</div>`;
  }

  // ── Trackers ─────────────────────────────────────
  const visTrackers = char.trackers.filter(t => !G.hidden.trackers[t.id]);
  const hiddenTCount = char.trackers.length - visTrackers.length;

  if (visTrackers.length > 0) {
    const trCollapsed = !!G.collapsed.trackers;
    h += `<div class="util-toggle sec-toggle ${trCollapsed?'collapsed':''}" onclick="toggleSection('trackers')">
      <span>📊 Recursos (${visTrackers.length})</span>
      <span class="chev">▾</span>
    </div>`;
    if (!trCollapsed) {
    h += `<div class="trackers-grid">`;
    visTrackers.forEach(t => {
      const cur = G.trackers[t.id] ?? t.max;
      const reset = t.resetType === 1 ? 'DsC' : t.resetType === 2 ? 'DsL' : '';
      h += `<div class="tcard">`;
      h += `<button class="x-btn" onclick="hideTracker('${t.id}')" title="Ocultar">✕</button>`;
      h += `<div class="tcard-label">${esc(t.label)}</div>`;

      if (t.isDice && t.diceFmt) {
        h += `<div class="tcard-dice">${esc(t.diceFmt)}</div>`;
        if (t.max > 0) {
          h += `<div class="tcard-num">
            <button class="tnum-btn" onclick="chTracker('${t.id}',-1)">−</button>
            <span class="tnum-val">${cur}</span>
            <span class="tnum-max">/ ${t.max}</span>
            <button class="tnum-btn" onclick="chTracker('${t.id}',1)">+</button>
          </div>`;
        }
      } else if (t.max <= 8) {
        h += `<div class="tcard-dots">`;
        for (let i = 0; i < t.max; i++) {
          h += `<div class="tdot ${i<cur?'on':''}" onclick="clickTDot('${t.id}',${i})"></div>`;
        }
        h += `</div>`;
        h += `<div style="font-size:.78rem;color:var(--muted)">${cur} / ${t.max}</div>`;
      } else {
        h += `<div class="tcard-num">
          <button class="tnum-btn" onclick="chTracker('${t.id}',-1)">−</button>
          <span class="tnum-val">${cur}</span>
          <span class="tnum-max">/ ${t.max}</span>
          <button class="tnum-btn" onclick="chTracker('${t.id}',1)">+</button>
        </div>`;
        if (t.isPool) {
          const amt = G.poolAmt[t.id] ?? Math.min(5, t.max);
          h += `<div class="pool-row">
            <input type="number" inputmode="numeric" class="pool-input" id="poolamt-${t.id}"
              value="${amt}" min="1" max="${t.max}"
              onchange="setPoolAmt('${t.id}',this.value)">
            <button class="pool-btn" onclick="poolSpend('${t.id}')">Gastar</button>
          </div>`;
        }
      }

      if (reset) h += `<div class="tcard-reset">${reset}</div>`;
      h += `</div>`;
    });
    h += `</div>`;
    }
  }

  // ── Controls ─────────────────────────────────────
  h += `<div class="ctrl-row">
    <button class="btn-ctrl accent" onclick="finTurn()">Fin de turno</button>
    <button class="btn-ctrl" onclick="shortRest()">Desc. corto</button>
    <button class="btn-ctrl danger" onclick="longRest()">Desc. largo</button>
  </div>`;

  let hiddenACount = 0;

  // ── Estado activo del personaje + encuentro ───────
  h += renderActiveEffectsPanel();
  h += renderEncounterStatePanel();

  // ── Mejoras y disparadores ENCIMA de las secciones de acción ─────
  const trigAll = char.abilities.trigger || [];
  hiddenACount += trigAll.filter(a => G.hidden.abilities[a.id]).length;
  h += renderTriggerSection();

  // ── Sugerencias para este turno (desplegable) ─────────────────────
  h += renderSuggestions();

  // ── Secciones de acción / adicional / reacción ────────────────────
  const secs = [
    { key:'action',   label:'Acción',           dot:'d-action',   flag:'actionUsed' },
    { key:'bonus',    label:'Acción adicional',  dot:'d-bonus',    flag:'bonusUsed' },
    { key:'reaction', label:'Reacción',          dot:'d-reaction', flag:'reactionUsed' },
  ];

  secs.forEach(sec => {
    const all = char.abilities[sec.key] || [];
    const abs = all.filter(a => !G.hidden.abilities[a.id]);
    hiddenACount += all.length - abs.length;
    if (!abs.length) return;
    const slotUsed = G[sec.flag];
    const collapsed = !!G.collapsed[sec.key];

    // Undo button: shown when this section's action has been spent
    const undoBtn = slotUsed
      ? `<button class="undo-btn" onclick="event.stopPropagation();undoAction('${sec.flag}')" title="Deshacer">↩</button>`
      : '';

    h += `<div class="section"><div class="sec-head sec-toggle ${collapsed?'collapsed':''}" onclick="toggleSection('${sec.key}')">
      <div class="sec-dot ${sec.dot}"></div>
      <span class="sec-name">${sec.label} (${abs.length})</span>
      <span style="margin-left:auto;display:flex;align-items:center;gap:6px">
        ${slotUsed ? '<span class="sec-used" style="margin-left:0">usada</span>' : ''}
        ${undoBtn}
        <span class="chev">▾</span>
      </span>
    </div>`;

    if (!collapsed) {
    abs.forEach(ab => {
      const onceUsed = ab.once && G.oncePerTurn[ab.id];
      const pcTracker = ab.pc > 0 ? findResTracker(ab.resKey) : null;
      const pcCur = pcTracker ? (G.trackers[pcTracker.id] ?? pcTracker.max) : 99;
      const pcOk  = pcCur >= ab.pc;

      // Own-pool abilities (e.g. Imponer las Manos): availability gated
      // on pool having points left, NOT on a separate resource tracker.
      const ownPoolTracker = ab.ownPool ? char.trackers.find(t => t.id === ab.ownPool) : null;
      const ownPoolCur = ownPoolTracker ? (G.trackers[ownPoolTracker.id] ?? ownPoolTracker.max) : null;
      const ownPoolAmt = G.poolAmt[ab.ownPool || ''] ?? Math.min(5, ownPoolTracker?.max ?? 1);
      const ownPoolOk = ownPoolTracker ? ownPoolCur > 0 : true;

      // Spell slot availability / upcasting.
      // Pact Magic spells (ab.slotPrefix === 'pactsl') don't get the normal
      // upcast stepper: by RAW you don't choose what level to cast a
      // Warlock spell at — every spell you know is automatically cast at
      // your full Pact slot level.
      let slotOk = true, slotTracker = null, castLevel = ab.spellLevel;
      let canUpcast = false, maxCastLevel = ab.spellLevel;
      const slotPrefix = ab.slotPrefix || 'sl';
      if (ab.spellLevel > 0) {
        if (slotPrefix === 'pactsl') {
          castLevel = ab.slotLevel;
          slotTracker = char.trackers.find(t => t.id === `pactsl${castLevel}`);
        } else {
          maxCastLevel = Math.max(ab.spellLevel, char.maxSpellLevel || ab.spellLevel);
          canUpcast = maxCastLevel > ab.spellLevel;
          castLevel = Math.min(Math.max(G.castLevel[ab.id] ?? ab.spellLevel, ab.spellLevel), maxCastLevel);
          slotTracker = char.trackers.find(t => t.id === `sl${castLevel}`);
        }
        const slotCur = slotTracker ? (G.trackers[slotTracker.id] ?? slotTracker.max) : 0;
        slotOk = slotTracker ? slotCur > 0 : false;
      }

      const dis   = slotUsed || onceUsed || !pcOk || !slotOk || !ownPoolOk;
      const cls2  = slotUsed ? 'used' : (!pcOk || onceUsed || !slotOk || !ownPoolOk ? 'locked' : '');

      // combo-highlight: borde resaltado si esta habilidad fue usada en el último combo
      const comboHighlight = G.comboUsed && G.comboUsed[ab.id] ? ' combo-used' : '';

      let fn;
      if (ownPoolTracker) {
        fn = dis ? '' : `useAbPool('${ab.id}','${sec.flag}','${ab.ownPool}',${ownPoolAmt})`;
      } else {
        fn = dis ? '' : `useAb('${ab.id}','${sec.flag}',${ab.pc},${ab.once},${ab.spellLevel>0?castLevel:0},'${ab.resKey||''}','${slotPrefix}')`;
      }
      const srcLabel = ab.source === 'item'   ? '📦 ítem' :
                       ab.source === 'weapon' ? '🗡 arma' :
                       ab.source === 'race'   ? '🧬 raza' :
                       ab.source === 'background' ? '🗺 trasfondo' :
                       ab.source === 'spell'  ? '🔮 conjuro' : '';

      SHORT_DESC[ab.id] = ab.desc;
      if (ab.full) FULL_DESC[ab.id] = ab.full;

      // Pool stepper: permite +/- O escritura directa con teclado numérico
      let costBadge;
      if (ownPoolTracker) {
        const poolMax = ownPoolTracker.max;
        const poolRemain = ownPoolCur ?? poolMax;
        costBadge = `<div class="stepper" onclick="event.stopPropagation()">
          <button class="stepper-btn" onclick="setPoolAmt('${ab.ownPool}',-1,1,${poolRemain})" ${ownPoolAmt<=1?'disabled':''}>−</button>
          <input type="number" class="pool-input" value="${ownPoolAmt}" min="1" max="${poolRemain}"
            onclick="event.stopPropagation()"
            onchange="event.stopPropagation();setPoolAmtDirect('${ab.ownPool}',this.value,1,${poolRemain})"
            oninput="event.stopPropagation()"
            inputmode="numeric" pattern="[0-9]*" title="Puntos a gastar">
          <span class="stepper-val" style="min-width:auto;font-size:.68rem;color:${ownPoolOk?'var(--muted)':'var(--red)'}">/${poolRemain}</span>
          <button class="stepper-btn" onclick="setPoolAmt('${ab.ownPool}',1,1,${poolRemain})" ${ownPoolAmt>=poolRemain?'disabled':''}>+</button>
        </div>`;
      } else if (ab.spellLevel > 0) {
        if (canUpcast) {
          costBadge = `<div class="stepper" onclick="event.stopPropagation()">
            <button class="stepper-btn" onclick="setCastLevel('${ab.id}',-1,${ab.spellLevel},${maxCastLevel})" ${castLevel<=ab.spellLevel?'disabled':''}>−</button>
            <span class="stepper-val" style="${slotOk?'':'color:var(--red)'}">Nv.${castLevel}</span>
            <button class="stepper-btn" onclick="setCastLevel('${ab.id}',1,${ab.spellLevel},${maxCastLevel})" ${castLevel>=maxCastLevel?'disabled':''}>+</button>
          </div>`;
        } else {
          costBadge = `<span class="cost ${slotOk?'c-blue':'c-locked'}">Nv.${ab.spellLevel}</span>`;
        }
      } else if (ab.pc > 0) {
        costBadge = `<span class="cost ${pcOk?'c-blue':'c-locked'}">${ab.pc} ${esc(resAbbrev(ab.resKey, pcTracker?.label))}</span>`;
      } else {
        costBadge = `<span class="cost c-free">gratis</span>`;
      }

      // ── Effect activation badge / Self-Ally toggle ──────────
      let effectBadge = '';
      if (ab.effectKey) {
        const cat = EFFECT_CATALOG[ab.effectKey];
        const activeId = Object.keys(G.activeEffects || {}).find(id =>
          G.activeEffects[id].sourceId === ab.id
        );
        if (activeId) {
          // Effect is active — show deactivate button
          effectBadge = `<span class="eff-badge active" onclick="event.stopPropagation();deactivateEffect('${activeId}')" title="Desactivar efecto">🔵 Activo ✕</span>`;
        } else if (cat) {
          if (ab.selfOrAlly) {
            // Show Self/Ally toggle before the activate button
            const castTarget = G.castTarget[ab.id] || 'self';
            effectBadge = `<span class="eff-badge" onclick="event.stopPropagation()">
              <button class="target-toggle ${castTarget==='self'?'active':''}" onclick="event.stopPropagation();setCastTarget('${ab.id}','self')">Yo</button>
              <button class="target-toggle ${castTarget==='ally'?'active':''}" onclick="event.stopPropagation();setCastTarget('${ab.id}','ally')">Aliado</button>
              <button class="eff-activate-btn" onclick="event.stopPropagation();activateEffect('${ab.id}','${ab.effectKey}','${castTarget}')">⚡ Activar</button>
            </span>`;
          } else {
            effectBadge = `<span class="eff-badge" onclick="event.stopPropagation()">
              <button class="eff-activate-btn" onclick="event.stopPropagation();activateEffect('${ab.id}','${ab.effectKey}','${cat.appliesTo}')">⚡ Activar</button>
            </span>`;
          }
        }
      }

      // Layout reorganizado: [ab-main] [ab-right: costs + X]
      // X ya no es position:absolute — vive en .ab-right para no solapar el stepper
      h += `<div class="ab ${cls2}${comboHighlight}" onclick="${fn}">
        <div class="ab-main">
          <div class="ab-name">${esc(ab.name)}</div>
          <div class="ab-desc" id="desc-${ab.id}">${esc(ab.desc)}</div>
          ${ab.full ? `<span class="ab-more" id="more-${ab.id}" onclick="event.stopPropagation();toggleDesc('${ab.id}')">ver más ▾</span>` : ''}
          ${ab.meta || srcLabel ? `<div class="ab-src">${ab.meta ? esc(ab.meta) : ''}${ab.meta && srcLabel ? ' · ' : ''}${srcLabel}</div>` : ''}
          ${effectBadge}
        </div>
        <div class="ab-right">
          <button class="x-btn" onclick="event.stopPropagation();hideAbility('${ab.id}')" title="Ocultar">✕</button>
          <div class="ab-costs">
            ${costBadge}
            ${ab.dc != null ? `<span class="cost c-amber">CD ${ab.dc}</span>` : ''}
            ${ab.once ? `<span class="cost ${onceUsed?'c-locked':'c-amber'}">${onceUsed?'✓ usada':'1/turno'}</span>` : ''}
          </div>
        </div>
      </div>`;
    });
    }
    h += `</div>`;
  });

  // ── Out-of-combat / utility section ───────────────
  const utilAll = char.abilities.utility || [];
  hiddenACount += utilAll.filter(a => G.hidden.abilities[a.id]).length;
  h += renderUtilitySection();

  // ── Rasgos pasivos / siempre activos ──────────────
  h += renderPassiveSection();

  // ── Footer: open recycle bin ──────────────────────
  const totalHidden = hiddenACount + hiddenTCount;
  if (totalHidden > 0) {
    h += `<button class="footer-btn" onclick="openTrash()">🗑 Elementos ocultos (${totalHidden})</button>`;
  }

  document.getElementById('content').innerHTML = h;
}

// ═══════════════════════════════════════════════════
//  UNIVERSAL SUGGESTION ENGINE
//  Looks at every currently-available ability/spell and
//  groups the best picks by what they accomplish, so the
//  same code works for any character built in FC5e.
// ═══════════════════════════════════════════════════
const SUGGESTION_CATS = [
  { key:'damage',   label:'💥 Mayor daño' },
  { key:'heal',     label:'❤️ Curación / Soporte' },
  { key:'control',  label:'🌀 Control de combate' },
  { key:'defense',  label:'🛡️ Defensa / Supervivencia' },
  { key:'mobility', label:'💨 Movilidad' },
];
const SLOT_LABELS = { action:'Acción', bonus:'Adicional', reaction:'Reacción' };

function matchesCategory(tags, cat) {
  switch (cat) {
    case 'damage':   return tags.includes('damage') && !tags.includes('heal');
    case 'heal':     return tags.includes('heal') || (tags.includes('buff') && !tags.includes('damage') && !tags.includes('control'));
    case 'control':  return tags.includes('control');
    case 'defense':  return tags.includes('defense');
    case 'mobility': return tags.includes('mobility');
    default: return false;
  }
}

function abilityAvailable(ab, secFlag) {
  if (G[secFlag]) return false;
  if (ab.once && G.oncePerTurn[ab.id]) return false;

  // ── Active effect constraints ────────────────────
  // Cannot cast spells while raging
  if (hasEffect('prevents_spellcasting') && ab.spellLevel > 0) return false;
  // Cannot cast a concentration spell if already concentrating
  if (isConcentrating() && ab.effectKey) {
    const cat = EFFECT_CATALOG[ab.effectKey];
    if (cat?.concentration) return false;
  }

  if (ab.pc > 0) {
    const pcTracker = findResTracker(ab.resKey);
    const pcCur = pcTracker ? (G.trackers[pcTracker.id] ?? pcTracker.max) : 99;
    if (pcCur < ab.pc) return false;
  }
  if (ab.spellLevel > 0) {
    const lvl = ab.slotLevel || ab.spellLevel;
    const prefix = ab.slotPrefix || 'sl';
    const st = char.trackers.find(t => t.id === `${prefix}${lvl}`);
    const cur = st ? (G.trackers[st.id] ?? st.max) : 0;
    if (cur <= 0) return false;
  }
  return true;
}

// Finds the best currently-affordable "smite"-style trigger (Divine Smite
// and similar): the highest spell-slot level (within the feature's own cap)
// that still has a slot remaining, and the bonus damage it would deal.
function bestSmiteOption() {
  const smites = (char.abilities.trigger || [])
    .filter(a => !G.hidden.abilities[a.id])
    .filter(a => a.triggerKind === 'smite' && a.scaling);
  if (!smites.length) return null;

  const ab = smites[0];
  const cap = Math.min(ab.scaling.maxLevel, char.maxSpellLevel || ab.scaling.maxLevel);
  for (let L = cap; L >= 1; L--) {
    const t = char.trackers.find(t => t.id === `sl${L}`);
    const cur = t ? (G.trackers[t.id] ?? t.max) : 0;
    if (cur > 0) {
      const dice = Math.min(ab.scaling.maxN, ab.scaling.baseN + (L-1)*ab.scaling.perLevelN);
      const dmg  = Math.round(dice * (ab.scaling.die+1) / 2 * 10) / 10;
      return { ab, level:L, dice, die:ab.scaling.die, dmg };
    }
  }
  return null;
}

function buildSuggestions() {
  const results = [];
  const ES = G.encounterState || {};
  const numTargets = Math.max(1, ES.numTargets || 1);

  // ── Context modifiers derived from active effects + encounter state ──
  // These scalars adjust the "value" of certain suggestion categories
  // without changing whether they're shown — the engine still shows all
  // available categories, but ranks within a category using these weights.
  const atkAdvantage    = hasEffect('advantage_atk')      || ES.targetParalyzed || ES.targetAsleep || ES.targetProne;
  const atkBonus        = hasEffect('atk_bonus');          // Bless adds d4
  const hexActive       = hasEffect('hex_active');         // +d6 per hit
  const huntersMarkActive = hasEffect('hunters_mark_active'); // +d6 per hit
  const extraAtkAction  = hasEffect('extra_attack_action') && !G.actionUsed; // Haste self
  const spellsBlocked   = hasEffect('prevents_spellcasting');
  const targetVulnerable = ES.targetParalyzed || ES.targetAsleep; // auto-crit if adjacent

  SUGGESTION_CATS.forEach(cat => {
    const picks = {};
    const secsToSearch = ['action', 'bonus', 'reaction'];

    secsToSearch.forEach(sec => {
      const secFlag = sec === 'action' ? 'actionUsed' : sec === 'bonus' ? 'bonusUsed' : 'reactionUsed';
      let candidates = (char.abilities[sec] || [])
        .filter(ab => !G.hidden.abilities[ab.id])
        .filter(ab => matchesCategory(ab.tags || [], cat.key))
        .filter(ab => abilityAvailable(ab, secFlag));

      // Block spells if raging
      if (spellsBlocked) candidates = candidates.filter(ab => ab.spellLevel === 0);

      if (!candidates.length) return;

      let best;
      if (cat.key === 'damage') {
        best = candidates.reduce((a, b) => {
          // Rank by estimated damage, boosted by context:
          // × numTargets for AoE-tagged spells, ×1.5 for advantage (more expected hits),
          // +hex/hunter's mark flat bonus per hit
          const scoreOf = x => {
            let d = estimateDamage(x);
            if ((x.tags||[]).includes('aoe')) d *= Math.min(numTargets, 4);
            if (atkAdvantage && (x.source === 'weapon' || (x.tags||[]).includes('damage'))) d *= 1.25;
            if (hexActive || huntersMarkActive) d += 3.5; // expected d6
            return d;
          };
          return scoreOf(b) > scoreOf(a) ? b : a;
        });
      } else {
        // For non-damage categories, prefer higher-level spells (more impactful)
        best = candidates.reduce((a, b) => (b.spellLevel || 0) > (a.spellLevel || 0) ? b : a);
      }
      picks[sec] = { ab: best, secFlag };
    });

    if (cat.key === 'damage') {
      let smite = null;
      if (picks.action && picks.action.ab.source === 'weapon') {
        smite = bestSmiteOption();
      }
      if (Object.keys(picks).length || smite) {
        let total = 0;
        Object.values(picks).forEach(p => total += estimateDamage(p.ab));
        if (smite) total += smite.dmg;
        if (atkAdvantage) total *= 1.1;   // rough EV increase from advantage
        results.push({ ...cat, picks, smite, total });
      }
      return;
    }

    if (Object.keys(picks).length) results.push({ ...cat, picks });
  });

  // ── EXTRA ACTION from Haste ──────────────────────
  // Haste on self gives one extra action that can only be used for Attack,
  // Dash, Disengage, Hide, or Use Object — NOT for a leveled spell. We
  // synthesize a synthetic "use your extra Haste attack" suggestion here.
  if (extraAtkAction) {
    const weaponAttack = [...(char.abilities.action || [])].find(ab =>
      ab.source === 'weapon' && !G.hidden.abilities[ab.id] && !G.actionUsed
    );
    if (weaponAttack) {
      // Show as a special combo note, not a spendable resource — Haste's
      // extra action is free, but RAW it must be declared and used on the
      // character's turn.
      results.unshift({
        key: 'haste_extra',
        label: '⚡ Acción extra (Acelerar)',
        picks: { action: { ab: weaponAttack, secFlag: 'actionUsed' } },
        smite: bestSmiteOption(),
        total: estimateDamage(weaponAttack) * (atkAdvantage ? 1.25 : 1),
        isHasteExtra: true
      });
    }
  }

  return results;
}

function renderSuggestions() {
  const suggestions = buildSuggestions();
  const collapsed = !!G.collapsed.suggestions;

  let h = `<div class="section"><div class="sec-head sec-toggle ${collapsed?'collapsed':''}" onclick="toggleSection('suggestions')">
    <div class="sec-dot d-combo"></div>
    <span class="sec-name">Sugerencias para este turno</span>
    <span class="chev" style="margin-left:auto">▾</span>
  </div>`;

  if (collapsed) return h + `</div>`;

  if (!suggestions.length) {
    h += `<div class="sugg-card"><div class="sugg-empty">Sin opciones disponibles ahora — termina el turno o descansa para recuperar recursos.</div></div>`;
    return h + `</div>`;
  }

  SUGGESTION_COMBOS = [];

  suggestions.forEach(s => {
    h += `<div class="sugg-card"><div class="sugg-cat">${s.label}</div>`;
    let partCount = 0;
    ['action','bonus','reaction'].forEach(sec => {
      const pick = s.picks[sec];
      if (!pick) return;
      partCount++;
      const ab = pick.ab;
      const fn = `useAb('${ab.id}','${pick.secFlag}',${ab.pc},${ab.once},${(ab.slotLevel||ab.spellLevel||0)},'${ab.resKey||''}','${ab.slotPrefix||'sl'}')`;
      let extra = '';
      if (s.key === 'damage') {
        const d = estimateDamage(ab);
        if (d) extra = `~${d} dmg`;
      } else if (ab.dc != null) {
        extra = `CD ${ab.dc}`;
      } else if (ab.spellLevel > 0) {
        extra = `Nv.${ab.spellLevel}`;
      }
      h += `<div class="sugg-pick" onclick="${fn}">
        <span class="sugg-slot">${SLOT_LABELS[sec]}</span>
        <span class="sugg-name">${esc(ab.name)}</span>
        ${extra ? `<span class="sugg-extra">${esc(extra)}</span>` : ''}
      </div>`;
    });

    if (s.key === 'damage' && s.smite) {
      partCount++;
      const sm = s.smite;
      h += `<div class="sugg-pick" onclick="useSmite('${sm.ab.id}',${sm.level})">
        <span class="sugg-slot">Disparador</span>
        <span class="sugg-name">${esc(sm.ab.name)} (Nv.${sm.level})</span>
        <span class="sugg-extra">+${sm.dice}d${sm.die} ~${sm.dmg} dmg</span>
      </div>`;
    }

    if (s.key === 'damage' && partCount > 1) {
      const steps = [];
      ['action','bonus','reaction'].forEach(sec => {
        const p = s.picks[sec];
        if (p) steps.push({ type:'ability', id:p.ab.id, secFlag:p.secFlag, pc:p.ab.pc, once:p.ab.once, spellLevel:(p.ab.slotLevel||p.ab.spellLevel||0), resKey:p.ab.resKey, slotPrefix:p.ab.slotPrefix });
      });
      if (s.smite) steps.push({ type:'smite', level:s.smite.level });
      SUGGESTION_COMBOS.push(steps);
      const idx = SUGGESTION_COMBOS.length - 1;
      h += `<div class="sugg-total" onclick="applySuggestionCombo(${idx})">
        <span>⚡ Aplicar combo completo</span>
        <span class="sugg-total-val">~${s.total} dmg</span>
      </div>`;
    }

    h += `</div>`;
  });

  return h + `</div>`;
}

// ═══════════════════════════════════════════════════
//  ACTIVE EFFECTS + ENCOUNTER STATE PANELS
// ═══════════════════════════════════════════════════
function renderActiveEffectsPanel() {
  const effects = Object.values(G.activeEffects || {});
  const enc = G.encounterState || {};
  const hasAny = effects.length > 0;
  if (!hasAny) return '';

  const collapsed = !!G.collapsed.activeEffects;
  let h = `<div class="section" style="border-color:var(--amber)"><div class="sec-head sec-toggle ${collapsed?'collapsed':''}" onclick="toggleSection('activeEffects')" style="background:rgba(245,158,11,.08)">
    <span style="font-size:.85rem">⚡</span>
    <span class="sec-name" style="color:var(--amber)">Estado activo (${effects.length})</span>
    <span class="chev" style="margin-left:auto">▾</span>
  </div>`;
  if (collapsed) return h + '</div>';

  effects.forEach(eff => {
    const flags = eff.mechanicFlags.map(f => {
      const labels = {
        extra_attack_action:'+ acción de ataque', double_speed:'velocidad ×2',
        prevents_spellcasting:'❌ conjuros', advantage_atk:'ventaja ataques',
        disadvantage_atk:'desventaja ataques', bps_resistance:'res. C/P/C',
        advantage_saving:'ventaja salv.', ac_bonus:'+ CA', atk_bonus:'+ ataque',
        hex_active:'daño maldición', hunters_mark_active:'marca del cazador',
        spirit_guardians_active:'guardianes', control_aoe_active:'control AoE',
        disadvantage_vs_self:'desventaja contra mí'
      };
      return labels[f] || f;
    }).filter(Boolean);

    h += `<div class="eff-row">
      <span class="eff-icon">${eff.concentration ? '🔮' : '✨'}</span>
      <div class="eff-info">
        <div class="eff-name">${esc(eff.label)}</div>
        ${flags.length ? `<div class="eff-flags">${flags.map(f=>`<span class="eff-flag">${esc(f)}</span>`).join('')}</div>` : ''}
        ${eff.concentration ? `<div class="eff-conc-hint">Concentración — se pierde al recibir daño</div>` : ''}
      </div>
      <button class="eff-end-btn" onclick="deactivateEffect('${eff.id}')" title="Finalizar efecto">✕</button>
    </div>`;
  });

  h += `<button class="eff-break-conc-btn" onclick="breakConcentration();save();render()">💔 Romper concentración</button>`;
  return h + '</div>';
}

function renderEncounterStatePanel() {
  const collapsed = !!G.collapsed.encounterState;
  const enc = G.encounterState || {};
  const anyActive = enc.targetParalyzed || enc.targetAsleep || enc.targetProne ||
                    enc.targetBlinded || enc.targetConc || enc.numTargets > 1 || enc.alliesInRange > 0;

  let h = `<div class="section"><div class="sec-head sec-toggle ${collapsed?'collapsed':''}" onclick="toggleSection('encounterState')">
    <span style="font-size:.85rem">🗺️</span>
    <span class="sec-name">Estado del encuentro${anyActive ? ' ●' : ''}</span>
    <span class="chev" style="margin-left:auto">▾</span>
  </div>`;
  if (collapsed) return h + '</div>';

  const toggle = (key, label, icon) => {
    const on = !!enc[key];
    return `<button class="enc-toggle-btn ${on?'active':''}" onclick="toggleEncounter('${key}')">${icon} ${label}</button>`;
  };

  h += `<div class="enc-panel">
    <div class="enc-row">
      <span class="enc-label">Objetivos en AoE</span>
      <div class="stepper" onclick="event.stopPropagation()">
        <button class="stepper-btn" onclick="adjEncounter('numTargets',-1,1,12)">−</button>
        <span class="stepper-val">${enc.numTargets || 1}</span>
        <button class="stepper-btn" onclick="adjEncounter('numTargets',1,1,12)">+</button>
      </div>
    </div>
    <div class="enc-row">
      <span class="enc-label">Aliados en rango</span>
      <div class="stepper" onclick="event.stopPropagation()">
        <button class="stepper-btn" onclick="adjEncounter('alliesInRange',-1,0,8)">−</button>
        <span class="stepper-val">${enc.alliesInRange || 0}</span>
        <button class="stepper-btn" onclick="adjEncounter('alliesInRange',1,0,8)">+</button>
      </div>
    </div>
    <div class="enc-conds">
      ${toggle('targetParalyzed','Objetivo paralizado','🔒')}
      ${toggle('targetAsleep','Objetivo dormido','💤')}
      ${toggle('targetProne','Objetivo derribado','⬇️')}
      ${toggle('targetBlinded','Objetivo cegado','🙈')}
      ${toggle('targetConc','Objetivo concentrado','🔮')}
    </div>
  </div>`;

  if (anyActive) {
    h += `<button class="eff-break-conc-btn" onclick="resetEncounterState()">🔄 Limpiar estado</button>`;
  }

  return h + '</div>';
}

function setCastTarget(abId, target) {
  if (!G.castTarget) G.castTarget = {};
  G.castTarget[abId] = target;
  render();
}

function toggleEncounter(key) {
  if (!G.encounterState) G.encounterState = { numTargets:1, targetParalyzed:false, targetAsleep:false, targetProne:false, targetBlinded:false, targetConc:false, alliesInRange:0 };
  G.encounterState[key] = !G.encounterState[key];
  save(); render();
}

function adjEncounter(key, delta, min, max) {
  if (!G.encounterState) G.encounterState = { numTargets:1, alliesInRange:0 };
  G.encounterState[key] = Math.min(max, Math.max(min, (G.encounterState[key] || (key==='numTargets'?1:0)) + delta));
  save(); render();
}

function resetEncounterState() {
  G.encounterState = { numTargets:1, targetParalyzed:false, targetAsleep:false, targetProne:false, targetBlinded:false, targetConc:false, alliesInRange:0 };
  save(); render();
}

// ═══════════════════════════════════════════════════
//  PASSIVE / ALWAYS-ON TRAITS SECTION
// ═══════════════════════════════════════════════════
function renderPassiveSection() {
  const all = (char.abilities.passive || []).filter(a => !G.hidden.abilities[a.id]);
  if (!all.length) return '';

  const collapsed = !!G.collapsed.passive;
  let h = `<div class="section"><div class="sec-head sec-toggle ${collapsed?'collapsed':''}" onclick="toggleSection('passive')">
    <div class="sec-dot d-utility"></div>
    <span class="sec-name">🔵 Rasgos pasivos (${all.length})</span>
    <span class="chev" style="margin-left:auto">▾</span>
  </div>`;
  if (collapsed) return h + `</div>`;

  all.forEach(ab => {
    SHORT_DESC[ab.id] = ab.desc;
    if (ab.full) FULL_DESC[ab.id] = ab.full;
    const srcLabel = ab.source === 'item' ? '📦 ítem' : ab.source === 'race' ? '🧬 raza' : ab.source === 'background' ? '🗺 trasfondo' : '';
    h += `<div class="ab passive-trait">
      <button class="x-btn" onclick="hideAbility('${ab.id}')" title="Ocultar">✕</button>
      <div class="ab-main">
        <div class="ab-name">${esc(ab.name)}</div>
        <div class="ab-desc" id="desc-${ab.id}">${esc(ab.desc)}</div>
        ${ab.full ? `<span class="ab-more" id="more-${ab.id}" onclick="toggleDesc('${ab.id}')">ver más ▾</span>` : ''}
        ${srcLabel ? `<div class="ab-src">${srcLabel}</div>` : ''}
      </div>
    </div>`;
  });
  return h + `</div>`;
}

// ═══════════════════════════════════════════════════
//  OUT-OF-COMBAT / UTILITY SECTION
//  Rituals, long-casting spells, exploration & social
//  tools. Not tied to the turn structure — using one
//  spends its resource (if any) right away, so it
//  carries over correctly into a later combat.
// ═══════════════════════════════════════════════════
function renderUtilitySection() {
  const all = (char.abilities.utility || []).filter(a => !G.hidden.abilities[a.id]);
  if (!all.length) return '';

  const open = !!G.showUtility;
  let h = `<div class="util-toggle ${open?'open':''}" onclick="toggleUtility()">
    <span>🧭 Fuera de combate (${all.length})</span>
    <span class="chev">▶</span>
  </div>`;
  if (!open) return h;

  h += `<div class="section">`;
  all.forEach(ab => {
    SHORT_DESC[ab.id] = ab.desc;
    if (ab.full) FULL_DESC[ab.id] = ab.full;

    let slotOk = true, slotTracker = null;
    const uSlotPrefix = ab.slotPrefix || 'sl';
    const uSlotLevel = ab.slotLevel || ab.spellLevel;
    if (ab.spellLevel > 0) {
      slotTracker = char.trackers.find(t => t.id === `${uSlotPrefix}${uSlotLevel}`);
      const slotCur = slotTracker ? (G.trackers[slotTracker.id] ?? slotTracker.max) : 0;
      slotOk = slotTracker ? slotCur > 0 : false;
    }
    const srcLabel = ab.source === 'item'   ? '📦 ítem' :
                     ab.source === 'race'   ? '🧬 raza' :
                     ab.source === 'background' ? '🗺 trasfondo' :
                     ab.source === 'spell'  ? '🔮 conjuro' : '';

    h += `<div class="ab util">
      <button class="x-btn" onclick="hideAbility('${ab.id}')" title="Ocultar">✕</button>
      <div class="ab-main">
        <div class="ab-name">${esc(ab.name)}</div>
        <div class="ab-desc" id="desc-${ab.id}">${esc(ab.desc)}</div>
        ${ab.full ? `<span class="ab-more" id="more-${ab.id}" onclick="toggleDesc('${ab.id}')">ver más ▾</span>` : ''}
        ${ab.meta || srcLabel ? `<div class="ab-src">${ab.meta?esc(ab.meta):''}${ab.meta&&srcLabel?' · ':''}${srcLabel}</div>` : ''}
      </div>
      <div class="ab-costs">
        ${ab.spellLevel>0
          ? `<span class="cost ${slotOk?'c-blue':'c-locked'}">Nv.${ab.spellLevel}</span>`
          : `<span class="cost c-free">gratis</span>`}
        ${ab.dc!=null ? `<span class="cost c-amber">CD ${ab.dc}</span>` : ''}
        ${ab.spellLevel>0 ? `<button class="usar-btn" onclick="useUtility('${ab.id}',${uSlotLevel},'${uSlotPrefix}')" ${slotOk?'':'disabled'}>Usar</button>` : ''}
      </div>
    </div>`;
  });
  h += `</div>`;
  return h;
}

function toggleSection(key) { G.collapsed[key] = !G.collapsed[key]; save(); render(); }
function setCastLevel(id, delta, min, max) {
  const cur = G.castLevel[id] ?? min;
  G.castLevel[id] = Math.max(min, Math.min(max, cur + delta));
  save(); render();
}
function toggleUtility() { G.showUtility = !G.showUtility; save(); render(); }
function useUtility(id, spellLevel, slotPrefix) {
  spendSpellSlot(spellLevel, slotPrefix);
  save(); render();
  toast('Espacio de conjuro gastado');
}

// ═══════════════════════════════════════════════════
//  "MEJORAS Y DISPARADORES" SECTION
//  Free/triggered features: Divine Smite (scales with the
//  spell slot spent), Metamagic, and other "spend a resource
//  when X happens" abilities that don't use the action economy.
// ═══════════════════════════════════════════════════
// (pcAbbrev removed — superseded by resAbbrev() above, which uses resKey
// directly instead of re-deriving the abbreviation from a tracker label)

function renderTriggerSection() {
  const all = (char.abilities.trigger || []).filter(a => !G.hidden.abilities[a.id]);
  if (!all.length) return '';

  const collapsed = !!G.collapsed.trigger;
  let h = `<div class="section"><div class="sec-head sec-toggle ${collapsed?'collapsed':''}" onclick="toggleSection('trigger')">
    <div class="sec-dot d-combo"></div>
    <span class="sec-name">⚡ Mejoras y disparadores (${all.length})</span>
    <span class="chev" style="margin-left:auto">▾</span>
  </div>`;
  if (collapsed) return h + `</div>`;

  const maxSlotLevel = char.maxSpellLevel || 0;

  all.forEach(ab => {
    SHORT_DESC[ab.id] = ab.desc;
    if (ab.full) FULL_DESC[ab.id] = ab.full;
    const srcLabel = ab.source === 'item' ? '📦 ítem' :
                     ab.source === 'race' ? '🧬 raza' :
                     ab.source === 'background' ? '🗺 trasfondo' : '';
    const displayName = ab.triggerKind === 'metamagic' && !/metamagi/i.test(ab.name)
      ? `🔀 Metamagia: ${ab.name}` : ab.name;

    // Resolved per-ability (not once for the whole section) — each trigger
    // may draw from a different resource pool on the same character (e.g.
    // Dorym has both Puntos de Hechicería for Metamagia and Canalizar
    // Divinidad; resolving this once globally picked whichever pool came
    // first in char.trackers, regardless of which one the ability text
    // actually named).
    const pcTracker = (ab.pc > 0 || ab.variablePC) ? findResTracker(ab.resKey) : null;
    const resLabel = resAbbrev(ab.resKey, pcTracker?.label);

    h += `<div class="trig">
      <button class="x-btn" onclick="hideAbility('${ab.id}')" title="Ocultar">✕</button>
      <div class="trig-head">
        <div class="trig-main">
          <div class="trig-name">${esc(displayName)}</div>
          <div class="trig-desc" id="desc-${ab.id}">${esc(ab.desc)}</div>
          ${ab.full ? `<span class="ab-more" id="more-${ab.id}" onclick="toggleDesc('${ab.id}')">ver más ▾</span>` : ''}
          ${srcLabel ? `<div class="ab-src">${srcLabel}</div>` : ''}
        </div>
      </div>`;

    if (ab.triggerKind === 'smite') {
      const min = 1;
      const max = ab.scaling ? Math.min(ab.scaling.maxLevel, maxSlotLevel || ab.scaling.maxLevel) : (maxSlotLevel || 1);
      const sel = Math.min(Math.max(G.triggerSel[ab.id] ?? min, min), Math.max(max,min));
      const slotT = char.trackers.find(t => t.id === `sl${sel}`);
      const slotCur = slotT ? (G.trackers[slotT.id] ?? slotT.max) : 0;
      const slotOk = slotCur > 0;
      let dmgLabel = '';
      if (ab.scaling) {
        const dice = Math.min(ab.scaling.maxN, ab.scaling.baseN + (sel-1)*ab.scaling.perLevelN);
        dmgLabel = `+${dice}d${ab.scaling.die}`;
      }

      h += `<div class="trig-foot">
        <span class="sugg-slot" style="min-width:auto">Espacio</span>
        <div class="stepper">
          <button class="stepper-btn" onclick="setTriggerLevel('${ab.id}',-1,${min},${max})" ${sel<=min?'disabled':''}>−</button>
          <span class="stepper-val">Nv.${sel}</span>
          <button class="stepper-btn" onclick="setTriggerLevel('${ab.id}',1,${min},${max})" ${sel>=max?'disabled':''}>+</button>
        </div>
        ${dmgLabel ? `<span class="trig-dmg">${dmgLabel}</span>` : ''}
        <button class="usar-btn" onclick="useSmite('${ab.id}',${sel})" ${slotOk?'':'disabled'} style="margin-top:0;margin-left:auto">Usar</button>
      </div>`;
    } else {
      // metamagic / generic resource trigger
      if (ab.variablePC) {
        const cost = Math.min(Math.max(G.triggerSel[ab.id] ?? 1, 1), 9);
        const cur = pcTracker ? (G.trackers[pcTracker.id] ?? pcTracker.max) : 0;
        const ok = cur >= cost;
        h += `<div class="trig-foot">
          <span class="sugg-slot" style="min-width:auto">Costo</span>
          <div class="stepper">
            <button class="stepper-btn" onclick="setTriggerLevel('${ab.id}',-1,1,9)" ${cost<=1?'disabled':''}>−</button>
            <span class="stepper-val">${cost} ${esc(resLabel)}</span>
            <button class="stepper-btn" onclick="setTriggerLevel('${ab.id}',1,1,9)" ${cost>=9?'disabled':''}>+</button>
          </div>
          <button class="usar-btn" onclick="useTriggerResource('${ab.id}')" ${ok?'':'disabled'} style="margin-top:0;margin-left:auto">Usar</button>
        </div>`;
      } else if (ab.pc > 0) {
        const cur = pcTracker ? (G.trackers[pcTracker.id] ?? pcTracker.max) : 0;
        const ok = cur >= ab.pc;
        h += `<div class="trig-foot">
          <span class="cost ${ok?'c-blue':'c-locked'}">${ab.pc} ${esc(resLabel)}</span>
          <button class="usar-btn" onclick="useTriggerResource('${ab.id}')" ${ok?'':'disabled'} style="margin-top:0;margin-left:auto">Usar</button>
        </div>`;
      }
    }

    h += `</div>`;
  });

  return h + `</div>`;
}

function setTriggerLevel(id, delta, min, max) {
  const cur = G.triggerSel[id] ?? min;
  G.triggerSel[id] = Math.max(min, Math.min(max, cur + delta));
  save(); render();
}
function useSmite(id, level) {
  applySmite(level);
  save(); render();
  toast(`Espacio Nv.${level} gastado`);
}
// Pool-based ability use: spends N points from the named own pool instead
// of charging an unrelated resource tracker (fix for Imponer las Manos).
function useAbPool(id, flag, poolId, amount) {
  G[flag] = true;
  G.lastSnapshot = { flag, poolId, amount, trackers: { ...G.trackers } };
  const t = char.trackers.find(t => t.id === poolId);
  if (t) G.trackers[poolId] = Math.max(0, (G.trackers[poolId] ?? t.max) - amount);
  save(); render();
}

function setPoolAmt(poolId, delta, min, max) {
  const cur = G.poolAmt[poolId] ?? Math.min(5, max);
  G.poolAmt[poolId] = Math.min(max, Math.max(min, cur + delta));
  render();
}

function setPoolAmtDirect(poolId, rawValue, min, max) {
  const v = parseInt(rawValue);
  if (isNaN(v)) return;
  G.poolAmt[poolId] = Math.min(max, Math.max(min, v));
  render();
}

// Undo the last action/bonus/reaction: restores the action flag and any
// spent resources from the snapshot taken when the action was applied.
function undoAction(flag) {
  G[flag] = false;
  if (G.lastSnapshot) {
    G.trackers = { ...G.lastSnapshot.trackers };
    G.lastSnapshot = null;
  }
  save(); render();
  toast('Acción deshecha');
}

function useTriggerResource(id) {
  const ab = (char.abilities.trigger || []).find(a => a.id === id);
  if (!ab) return;
  const amount = ab.variablePC ? (G.triggerSel[id] ?? 1) : ab.pc;
  G.lastSnapshot = { trackers: { ...G.trackers } };
  spendResource(amount, ab.resKey);
  save(); render();
}

// ── Toggle full / short description ─────────────────
function toggleDesc(id) {
  const descEl = document.getElementById('desc-'+id);
  const linkEl = document.getElementById('more-'+id);
  if (!descEl || !linkEl) return;
  const expanded = descEl.dataset.expanded === '1';
  if (expanded) {
    descEl.textContent = SHORT_DESC[id];
    descEl.dataset.expanded = '0';
    linkEl.textContent = 'ver más ▾';
  } else {
    descEl.textContent = FULL_DESC[id];
    descEl.dataset.expanded = '1';
    linkEl.textContent = 'ver menos ▴';
  }
}

// ═══════════════════════════════════════════════════
//  ACTIONS
//  apply* mutate state only (no save/render) so multi-step
//  combos can apply several effects then render once.
// ═══════════════════════════════════════════════════
function applyAbility(id, flag, pc, once, spellLevel, resKey, slotPrefix) {
  G.lastSnapshot = { flag, trackers: { ...G.trackers } };
  G[flag] = true;
  if (pc > 0) spendResource(pc, resKey);
  if (spellLevel > 0) spendSpellSlot(spellLevel, slotPrefix);
  if (once) G.oncePerTurn[id] = true;
}
function applySmite(level) { spendSpellSlot(level); }

function useAb(id, flag, pc, once, spellLevel, resKey, slotPrefix) {
  applyAbility(id, flag, pc, once, spellLevel, resKey, slotPrefix);
  save(); render();
}

function applySuggestionCombo(idx) {
  const steps = SUGGESTION_COMBOS[idx];
  if (!steps) return;
  G.lastSnapshot = { trackers: { ...G.trackers } };
  G.comboUsed = {};
  steps.forEach(step => {
    if (step.type === 'ability') {
      G[step.secFlag] = true;
      if (step.pc > 0) spendResource(step.pc, step.resKey);
      if (step.spellLevel > 0) spendSpellSlot(step.spellLevel, step.slotPrefix);
      if (step.once) G.oncePerTurn[step.id] = true;
      G.comboUsed[step.id] = true;
    } else if (step.type === 'smite') applySmite(step.level);
  });
  save(); render();
  toast('Combo aplicado');
}

// resKey identifies WHICH resource pool to spend from (see RESOURCE_TYPES
// above). Passing it through explicitly — instead of re-deriving it from
// a single shared global lookup — is the actual fix for the cross-pool
// collision confirmed on Bo (Psionic Power wrongly spending Superiority
// Die) and the reason Channel Divinity auto-tracking is now safe on
// multiclass characters like Dorym.
function spendResource(n, resKey) {
  const t = findResTracker(resKey);
  if (!t) return;
  G.trackers[t.id] = Math.max(0, (G.trackers[t.id] ?? t.max) - n);
}

// slotPrefix defaults to the normal 'sl' (regular spell slots). Pact
// Magic (Warlock) spells pass 'pactsl' instead, so they decrement their
// own independently-recharging pool rather than a nonexistent/wrong
// shared one — see the Pact Magic comment block in parseFC5eXML.
function spendSpellSlot(level, slotPrefix) {
  const t = char.trackers.find(t => t.id === `${slotPrefix || 'sl'}${level}`);
  if (!t) return;
  G.trackers[t.id] = Math.max(0, (G.trackers[t.id] ?? t.max) - 1);
}

function chTracker(id, delta) {
  const t = char.trackers.find(t => t.id === id);
  if (!t) return;
  G.trackers[id] = Math.max(0, Math.min(t.max, (G.trackers[id] ?? t.max) + delta));
  save(); render();
}

function setPoolAmt(id, val) {
  const t = char.trackers.find(t => t.id === id);
  if (!t) return;
  let amt = parseInt(val);
  if (isNaN(amt) || amt < 1) amt = 1;
  if (amt > t.max) amt = t.max;
  G.poolAmt[id] = amt;
  save();
}

function poolSpend(id) {
  const t = char.trackers.find(t => t.id === id);
  if (!t) return;
  const amt = G.poolAmt[id] ?? Math.min(5, t.max);
  const cur = G.trackers[id] ?? t.max;
  const spent = Math.min(amt, cur);
  if (spent <= 0) return;
  G.trackers[id] = cur - spent;
  save(); render();
  toast(`${t.label}: −${spent} (quedan ${cur - spent})`);
}

function clickTDot(id, i) {
  const t = char.trackers.find(t => t.id === id);
  if (!t) return;
  const cur = G.trackers[id] ?? t.max;
  G.trackers[id] = (i === cur - 1) ? cur - 1 : Math.min(t.max, i + 1);
  save(); render();
}

// ── Hide / restore (recycle bin) ─────────────────────
function hideAbility(id) { G.hidden.abilities[id] = true; save(); render(); }
function hideTracker(id) { G.hidden.trackers[id] = true; save(); render(); }

const SEC_LABELS = { action:'Acción', bonus:'Acción adicional', reaction:'Reacción', utility:'Fuera de combate', trigger:'Mejoras y disparadores' };

function openTrash() {
  const groups = [];

  // Hidden abilities, grouped by action type
  ['action','bonus','reaction','utility','trigger'].forEach(key => {
    const items = (char.abilities[key] || []).filter(a => G.hidden.abilities[a.id]);
    if (items.length) {
      groups.push({
        label: SEC_LABELS[key],
        rows: items.map(a => ({
          name: a.name,
          fn: `restoreAbility('${a.id}')`
        }))
      });
    }
  });

  // Hidden trackers
  const hiddenTr = char.trackers.filter(t => G.hidden.trackers[t.id]);
  if (hiddenTr.length) {
    groups.push({
      label: 'Recursos',
      rows: hiddenTr.map(t => ({
        name: t.label,
        fn: `restoreTracker('${t.id}')`
      }))
    });
  }

  let body = '';
  if (!groups.length) {
    body = `<div class="modal-empty">No hay elementos ocultos</div>`;
  } else {
    groups.forEach(g => {
      body += `<div class="trash-group">${esc(g.label)}</div>`;
      g.rows.forEach(r => {
        body += `<div class="trash-item">
          <span class="trash-name">${esc(r.name)}</span>
          <button class="trash-restore" onclick="${r.fn}">Restaurar</button>
        </div>`;
      });
    });
  }

  document.getElementById('trash-modal').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeTrash()">
      <div class="modal-sheet">
        <div class="modal-head">
          <span class="modal-title">🗑 Elementos ocultos</span>
          <button class="modal-close" onclick="closeTrash()">✕</button>
        </div>
        <div class="modal-body">${body}</div>
        ${groups.length ? `<div class="modal-foot">
          <button class="footer-btn" onclick="restoreAllFromTrash()">↺ Restaurar todo</button>
        </div>` : ''}
      </div>
    </div>`;
}

function closeTrash() {
  document.getElementById('trash-modal').innerHTML = '';
}

function restoreAbility(id) {
  delete G.hidden.abilities[id];
  save(); render(); openTrash();
}
function restoreTracker(id) {
  delete G.hidden.trackers[id];
  save(); render(); openTrash();
}
function restoreAllFromTrash() {
  G.hidden = { abilities:{}, trackers:{} };
  save(); render(); closeTrash();
}

function chHP(d) {
  G.hp = Math.min(char.hpMax, Math.max(0, (G.hp ?? char.hpCur) + d));
  save(); render();
}

// ── HP Calculator ────────────────────────────────────
function toggleCalc() {
  calcOpen = !calcOpen;
  if (!calcOpen) calcExpr = '';
  render();
}
function calcKey(k) {
  calcExpr += k;
  updateCalcDisplay();
}
function calcBackspace() {
  calcExpr = calcExpr.slice(0, -1);
  updateCalcDisplay();
}
function calcClear() {
  calcExpr = '';
  updateCalcDisplay();
}
function calcRoll(die) {
  const r = 1 + Math.floor(Math.random() * die);
  if (calcExpr && !/[+\-*/(]\s*$/.test(calcExpr)) calcExpr += '+';
  calcExpr += r;
  updateCalcDisplay();
  toast(`d${die} → ${r}`);
}
function updateCalcDisplay() {
  const el = document.querySelector('.calc-display');
  if (!el) return;
  el.textContent = calcExpr || '0';
  el.classList.toggle('empty', calcExpr.length === 0);
}
function calcEvalValue() {
  if (!calcExpr) return null;
  if (!/^[0-9+\-*/(). ]+$/.test(calcExpr)) return null;
  try {
    const v = Function('"use strict";return (' + calcExpr + ')')();
    return Number.isFinite(v) ? Math.round(v) : null;
  } catch(e) { return null; }
}
function calcApply(mode) {
  const v = calcEvalValue();
  if (v === null || v === 0) { toast('Ingresa un valor'); return; }
  const hp = G.hp ?? char.hpCur;
  const tempHp = G.tempHp || 0;
  const amount = Math.abs(v);

  if (mode === 'heal') {
    G.hp = Math.min(char.hpMax, hp + amount);
    toast(`+${amount} PG curados`);
  } else if (mode === 'temp') {
    G.tempHp = Math.max(tempHp, amount);
    toast(`PG temporales: ${G.tempHp}`);
  } else if (mode === 'damage') {
    let remaining = amount;
    if (tempHp > 0) {
      const absorbed = Math.min(tempHp, remaining);
      G.tempHp = tempHp - absorbed;
      remaining -= absorbed;
    }
    G.hp = Math.max(0, hp - remaining);
    toast(`−${amount} daño`);
  }
  calcExpr = '';
  save(); render();
}

function addRound(d) {
  G.round = Math.max(1, G.round + d);
  document.getElementById('hdr-round').textContent = G.round;
  save();
}

function finTurn() {
  G.actionUsed = G.bonusUsed = G.reactionUsed = false;
  G.oncePerTurn = {};
  G.comboUsed = {};
  G.lastSnapshot = null;
  tickEffects();   // decrementa roundsLeft en efectos con duración de N rondas
  G.round = (G.round || 1) + 1;
  save(); render();
}

function shortRest() {
  char.trackers.forEach(t => { if (t.resetType === 1) G.trackers[t.id] = t.max; });
  finTurn(); toast('Descanso corto — recursos recuperados');
}

function longRest() {
  char.trackers.forEach(t => { G.trackers[t.id] = t.max; });
  G.hp = char.hpMax; G.tempHp = 0; G.round = 1;
  finTurn(); toast('Descanso largo — todo recuperado');
}

// ═══════════════════════════════════════════════════
//  PERSISTENCE
// ═══════════════════════════════════════════════════
function save() {
  try { localStorage.setItem('g', JSON.stringify(G));
    if (char) localStorage.setItem('ch', JSON.stringify(char)); } catch(e) {}
}

function loadSaved() {
  try {
    const ch = localStorage.getItem('ch'), g = localStorage.getItem('g');
    if (ch) {
      char = JSON.parse(ch);
      if (g) {
        const saved = JSON.parse(g);
        Object.assign(G, saved);
        if (!G.hidden) G.hidden = { abilities:{}, trackers:{} };
        if (!G.hidden.abilities) G.hidden.abilities = {};
        if (!G.hidden.trackers) G.hidden.trackers = {};
        if (!G.collapsed) G.collapsed = {};
        if (!G.triggerSel) G.triggerSel = {};
        if (!G.castLevel) G.castLevel = {};
        if (!G.poolAmt) G.poolAmt = {};
        if (!G.comboUsed) G.comboUsed = {};
        if (G.lastSnapshot === undefined) G.lastSnapshot = null;
        if (!G.activeEffects) G.activeEffects = {};
        if (!G.encounterState) G.encounterState = { numTargets:1, targetParalyzed:false, targetAsleep:false, targetProne:false, targetBlinded:false, targetConc:false, alliesInRange:0 };
        if (!G.castTarget) G.castTarget = {};
      }
      return true;
    }
  } catch(e) {}
  return false;
}

// ═══════════════════════════════════════════════════
//  IMPORT
// ═══════════════════════════════════════════════════
function importXML(xmlText) {
  try {
    char = parseFC5eXML(xmlText);
    const allSectionKeys = ['action','bonus','reaction','trigger','suggestions','utility','passive','trackers','activeEffects','encounterState'];
    const collapsed = Object.fromEntries(allSectionKeys.map(k => [k, true]));
    G = { round:1, hp:char.hpCur, tempHp:0, actionUsed:false, bonusUsed:false,
          reactionUsed:false, oncePerTurn:{}, trackers:{}, showUtility:false,
          collapsed, triggerSel:{}, castLevel:{}, poolAmt:{},
          hidden:{ abilities:{}, trackers:{} },
          activeEffects:{},
          encounterState:{ numTargets:1, targetParalyzed:false, targetAsleep:false,
            targetProne:false, targetBlinded:false, targetConc:false, alliesInRange:0 },
          castTarget:{}, comboUsed:{}, lastSnapshot:null };
    char.trackers.forEach(t => { G.trackers[t.id] = t.max; });
    save();
    document.getElementById('screen-import').style.display  = 'none';
    document.getElementById('screen-tracker').style.display = 'flex';
    render();
    toast(`${char.name} cargado`);
  } catch(e) { alert('Error al leer el XML: ' + e.message); }
}

document.getElementById('file-input').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => importXML(ev.target.result);
  r.onerror = () => alert('No se pudo leer el archivo');
  r.readAsText(f, 'UTF-8');
  e.target.value = '';
});

// ═══════════════════════════════════════════════════
//  SHARE TARGET
// ═══════════════════════════════════════════════════
async function checkShareTarget() {
  if (!location.search.includes('from-share')) return false;
  history.replaceState({}, '', location.pathname);
  try {
    const cache = await caches.open('share-v1');
    const res   = await cache.match('pending');
    if (res) { const tx = await res.text(); await cache.delete('pending'); importXML(tx); return true; }
  } catch(e) {}
  return false;
}

// ═══════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════
let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400);
}

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

(async function init() {
  if (loadSaved()) {
    document.getElementById('screen-tracker').style.display = 'flex';
    render(); return;
  }
  if (await checkShareTarget()) return;
  document.getElementById('screen-import').style.display = 'flex';
})();
</script>
</body>
</html>
