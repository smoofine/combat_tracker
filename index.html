<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Combat Tracker — D&D 5e</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#12121e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Combat Tracker">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#12121e;--s1:#1c1c2e;--s2:#26263a;--s3:#303048;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e2e2f0;--muted:#7878a0;--hint:#4a4a68;
  --blue:#6b8eff;--blue-bg:rgba(107,142,255,0.12);--blue-border:rgba(107,142,255,0.3);
  --green:#5dd98a;--green-bg:rgba(93,217,138,0.12);--green-border:rgba(93,217,138,0.3);
  --amber:#f0b84a;--amber-bg:rgba(240,184,74,0.12);--amber-border:rgba(240,184,74,0.3);
  --red:#f06060;--red-bg:rgba(240,96,96,0.12);--red-border:rgba(240,96,96,0.3);
  --r:10px;--r-sm:7px
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.45;overscroll-behavior:none}

/* ── Import Screen ─────────────────────────────────── */
#screen-import{display:none;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;padding:2rem;text-align:center}
.imp-rune{font-size:2.8rem;margin-bottom:1.2rem}
.imp-title{font-size:1.35rem;font-weight:700;margin-bottom:.5rem}
.imp-sub{color:var(--muted);font-size:.88rem;line-height:1.7;margin-bottom:2rem;max-width:300px}
.imp-sub code{background:var(--s2);color:var(--blue);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:.83rem}
.btn-primary{background:var(--blue);color:#fff;border:none;padding:14px 0;
  border-radius:var(--r);font-size:.97rem;font-weight:600;cursor:pointer;width:100%;max-width:300px}
.btn-primary:active{opacity:.8}
#file-input{display:none}
.imp-hint{margin-top:1.2rem;font-size:.75rem;color:var(--hint);line-height:1.6}

/* ── Tracker Screen ────────────────────────────────── */
#screen-tracker{display:none;min-height:100dvh;flex-direction:column}

/* Header */
.header{background:var(--s1);border-bottom:1px solid var(--border);
  padding:10px 14px;display:flex;align-items:center;gap:8px;
  position:sticky;top:0;z-index:20}
.hdr-change{background:var(--s2);border:1px solid var(--border2);color:var(--muted);
  width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.hdr-change:active{opacity:.6}
.hdr-info{flex:1;min-width:0}
.hdr-name{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-meta{font-size:.73rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round-ctrl{display:flex;align-items:center;gap:4px;flex-shrink:0}
.round-btn{background:var(--s2);border:1px solid var(--border2);color:var(--muted);
  width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;line-height:1}
.round-btn:active{opacity:.6}
.round-display{background:var(--s2);border:1px solid var(--border);
  padding:3px 10px;border-radius:14px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.round-display span{color:var(--text);font-weight:600}

/* Content */
.content{padding:12px 14px 32px;flex:1}

/* HP row */
.hp-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px}
.hp-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;flex:1}
.hp-controls{display:flex;align-items:center;gap:8px}
.adj-btn{background:var(--s2);border:1px solid var(--border2);color:var(--text);
  width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:1.1rem;
  display:flex;align-items:center;justify-content:center}
.adj-btn:active{opacity:.6}
.hp-val{font-size:1.15rem;font-weight:700;min-width:72px;text-align:center;cursor:pointer}
.hp-max{font-size:.78rem;color:var(--muted);font-weight:400}
.hp-temp{font-size:.78rem;color:var(--amber);font-weight:600;margin-left:2px}
.calc-btn{background:var(--s2);border:1px solid var(--border2);color:var(--blue);
  width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.calc-btn:active{opacity:.6}
.calc-btn.open{background:var(--blue-bg);border-color:var(--blue-border)}

/* HP calculator panel */
.calc-panel{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
  padding:10px;margin-bottom:6px}
.calc-display{background:#0c0c14;border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 12px;text-align:right;font-size:1.4rem;font-weight:700;
  min-height:1.6em;margin-bottom:8px;letter-spacing:.02em;word-break:break-all;
  color:var(--text)}
.calc-display.empty{color:var(--hint)}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.calc-key{background:var(--s2);border:1px solid var(--border2);color:var(--text);
  border-radius:var(--r-sm);padding:11px 0;font-size:.95rem;font-weight:600;
  cursor:pointer;text-align:center}
.calc-key:active{opacity:.6}
.calc-key.op{color:var(--amber)}
.calc-key.die{color:var(--blue);font-size:.82rem}
.calc-key.clear{color:var(--red)}
.calc-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.calc-act{border-radius:var(--r-sm);padding:11px 0;font-size:.85rem;font-weight:700;
  cursor:pointer;text-align:center;border:none;color:#fff}
.calc-act:active{opacity:.7}
.calc-heal{background:#2d7d4f}
.calc-temp{background:#3a6b9e}
.calc-dmg{background:#8b2c2c}

/* Spell DC row */
.dc-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dc-badge{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:6px 12px;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dc-badge b{color:var(--amber);font-size:.95rem}
.trackers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-bottom:10px}
.tcard{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 10px;position:relative}
.tcard-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;
  padding-right:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard-dots{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.tdot{width:16px;height:16px;border-radius:50%;cursor:pointer;flex-shrink:0;
  border:1.5px solid var(--hint);background:transparent;transition:background .1s,border-color .1s}
.tdot.on{background:var(--blue);border-color:var(--blue)}
.tdot:active{opacity:.6}
.tcard-num{display:flex;align-items:center;gap:6px}
.tnum-val{font-size:1.1rem;font-weight:700}
.tnum-max{font-size:.78rem;color:var(--muted)}
.tnum-btn{background:var(--s2);border:1px solid var(--border2);color:var(--text);
  width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tnum-btn:active{opacity:.6}
.tcard-dice{font-size:.95rem;font-weight:600;color:var(--amber);letter-spacing:.02em;margin-bottom:3px}
.tcard-reset{font-size:.68rem;color:var(--hint)}
.x-btn{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;
  background:var(--s3);border:none;color:var(--hint);font-size:.62rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.x-btn:active{opacity:.5}

/* Controls */
.ctrl-row{display:flex;gap:5px;margin-bottom:12px}
.btn-ctrl{flex:1;background:var(--s2);border:1px solid var(--border);color:var(--text);
  padding:8px 4px;border-radius:var(--r-sm);font-size:.78rem;cursor:pointer;text-align:center}
.btn-ctrl:active{opacity:.6}
.btn-ctrl.accent{color:var(--blue);border-color:var(--blue-border)}
.btn-ctrl.danger{color:var(--red);border-color:var(--red-border)}

/* Section */
.section{margin-bottom:12px}
.sec-head{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.sec-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d-action{background:var(--blue)} .d-bonus{background:var(--green)}
.d-reaction{background:var(--amber)} .d-combo{background:var(--muted)}
.sec-name{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sec-used{margin-left:auto;font-size:.7rem;color:var(--red)}

/* Ability button */
.ab{width:100%;text-align:left;background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:9px 11px 9px 11px;margin-bottom:4px;cursor:pointer;
  color:var(--text);font-family:inherit;font-size:.88rem;position:relative;
  display:flex;align-items:flex-start;gap:9px;transition:opacity .12s}
.ab:active{opacity:.65}
.ab.used{opacity:.35;cursor:default;text-decoration:line-through;text-decoration-color:var(--hint)}
.ab.locked{opacity:.3;cursor:not-allowed}
.ab-main{flex:1;min-width:0;padding-right:14px}
.ab-name{font-weight:600;margin-bottom:1px}
.ab-desc{font-size:.76rem;color:var(--muted);line-height:1.45}
.ab-more{font-size:.7rem;color:var(--blue);margin-top:3px;display:inline-block;cursor:pointer}
.ab-src{font-size:.66rem;color:var(--hint);margin-top:2px}
.ab-costs{display:flex;gap:4px;flex-direction:column;align-items:flex-end;flex-shrink:0;padding-top:1px}
.cost{font-size:.7rem;padding:2px 7px;border-radius:10px;white-space:nowrap;font-weight:500}
.c-blue{background:var(--blue-bg);color:var(--blue)}
.c-free{background:var(--s3);color:var(--muted)}
.c-locked{background:var(--red-bg);color:var(--red)}
.c-amber{background:var(--amber-bg);color:var(--amber)}

/* Combo */
.combo{border-left:3px solid var(--blue-border);background:var(--s1);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:9px 11px;margin-bottom:5px;cursor:pointer}
.combo:active{opacity:.65}
.combo.locked{border-left-color:var(--hint);opacity:.4;cursor:default}
.combo-name{font-weight:600;font-size:.88rem;margin-bottom:3px}
.combo-steps{font-size:.75rem;color:var(--muted);line-height:1.6}

/* Suggestions (universal combo system) */
.sugg-card{border-left:3px solid var(--blue-border);background:var(--s1);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:9px 11px;margin-bottom:5px;cursor:pointer}
.sugg-card:active{opacity:.65}
.sugg-cat{font-weight:600;font-size:.8rem;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.sugg-pick{display:flex;align-items:baseline;gap:6px;font-size:.82rem;margin-bottom:2px}
.sugg-slot{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--muted);min-width:38px;flex-shrink:0}
.sugg-name{font-weight:500}
.sugg-extra{font-size:.72rem;color:var(--muted)}
.sugg-empty{font-size:.78rem;color:var(--hint);font-style:italic}

/* Utility / out-of-combat section */
.util-toggle{display:flex;align-items:center;gap:7px;cursor:pointer;
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:9px 11px;margin-bottom:8px;font-size:.82rem;color:var(--muted);font-weight:600}
.util-toggle .chev{margin-left:auto;font-size:.7rem;transition:transform .15s}
.util-toggle.open .chev{transform:rotate(90deg)}
.ab.util .ab-costs{flex-direction:column}
.usar-btn{background:var(--blue-bg);border:1px solid var(--blue-border);color:var(--blue);
  border-radius:var(--r-sm);padding:4px 9px;font-size:.7rem;font-weight:600;cursor:pointer;margin-top:4px}
.usar-btn:active{opacity:.6}
.usar-btn:disabled{opacity:.35;cursor:not-allowed}

/* Generic collapsible section header */
.sec-toggle{cursor:pointer}
.sec-toggle .chev{margin-left:auto;font-size:.65rem;color:var(--muted);transition:transform .15s}
.sec-toggle.collapsed .chev{transform:rotate(-90deg)}

/* Stepper (level/cost selectors for triggers & spell upcasting) */
.stepper{display:flex;align-items:center;gap:4px}
.stepper-btn{background:var(--s2);border:1px solid var(--border2);color:var(--text);
  width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:.85rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.stepper-btn:active{opacity:.6}
.stepper-btn:disabled{opacity:.3;cursor:not-allowed}
.stepper-val{font-size:.75rem;font-weight:700;min-width:36px;text-align:center;color:var(--blue)}

/* Trigger cards (Divine Smite, Metamagic, etc.) */
.trig{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:9px 11px;margin-bottom:5px;position:relative}
.trig-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:6px}
.trig-main{flex:1;min-width:0}
.trig-name{font-weight:600;font-size:.88rem;margin-bottom:1px}
.trig-desc{font-size:.76rem;color:var(--muted);line-height:1.45}
.trig-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trig-dmg{font-size:.78rem;color:var(--amber);font-weight:600}

.div{height:1px;background:var(--border);margin:10px 0}
.footer-btn{background:var(--s2);border:1px solid var(--border);color:var(--muted);
  padding:9px;border-radius:var(--r-sm);font-size:.78rem;cursor:pointer;width:100%;text-align:center;margin-top:8px}
.footer-btn:active{opacity:.6}

/* Trash modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);
  display:flex;align-items:flex-end;justify-content:center;z-index:200}
.modal-sheet{background:var(--s1);border-radius:var(--r) var(--r) 0 0;
  width:100%;max-width:480px;max-height:78vh;display:flex;flex-direction:column;
  border:1px solid var(--border2);border-bottom:none}
.modal-head{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;
  border-bottom:1px solid var(--border)}
.modal-title{font-weight:700;font-size:.95rem;flex:1}
.modal-close{background:var(--s2);border:1px solid var(--border2);color:var(--muted);
  width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.9rem;
  display:flex;align-items:center;justify-content:center}
.modal-close:active{opacity:.6}
.modal-body{overflow-y:auto;padding:8px 14px 14px;flex:1}
.modal-empty{color:var(--hint);font-size:.85rem;text-align:center;padding:24px 0}
.trash-group{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin:10px 0 6px}
.trash-item{display:flex;align-items:center;gap:8px;background:var(--s2);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;margin-bottom:5px}
.trash-name{flex:1;font-size:.86rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trash-restore{background:var(--blue-bg);border:1px solid var(--blue-border);color:var(--blue);
  border-radius:var(--r-sm);padding:6px 12px;font-size:.78rem;font-weight:600;cursor:pointer;flex-shrink:0}
.trash-restore:active{opacity:.6}
.modal-foot{padding:10px 14px;border-top:1px solid var(--border)}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--s3);border:1px solid var(--border2);color:var(--text);
  padding:9px 18px;border-radius:20px;font-size:.83rem;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:100;white-space:nowrap;max-width:88vw;
  overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="screen-import">
  <div class="imp-rune">⚔️</div>
  <div class="imp-title">Combat Tracker</div>
  <p class="imp-sub">
    Exporta tu personaje desde Fight Club 5e:<br>
    <code>Personaje → ··· → Exportar XML</code><br>
    luego comparte o selecciona el archivo aquí.
  </p>
  <button class="btn-primary" onclick="document.getElementById('file-input').click()">
    Seleccionar XML de FC5e
  </button>
  <input type="file" id="file-input" accept=".xml,text/xml,application/xml">
  <p class="imp-hint">En Android, si instalaste esta PWA, FC5e puede<br>compartir el XML directamente aquí.</p>
</div>

<div id="screen-tracker">
  <div class="header">
    <button class="hdr-change" onclick="document.getElementById('file-input').click()" title="Cambiar personaje">⇄</button>
    <div class="hdr-info">
      <div class="hdr-name" id="hdr-name">—</div>
      <div class="hdr-meta" id="hdr-meta">—</div>
    </div>
    <div class="round-ctrl">
      <button class="round-btn" onclick="addRound(-1)">−</button>
      <div class="round-display">Ronda <span id="hdr-round">1</span></div>
      <button class="round-btn" onclick="addRound(1)">+</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<div id="toast"></div>
<div id="trash-modal"></div>

<script>
// ═══════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════
const $  = (el, sel) => el?.querySelector(sel)?.textContent?.trim() ?? '';
const $$ = (el, sel) => [...(el?.querySelectorAll(sel) ?? [])];
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ═══════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════
let char = null;
let G = { round:1, hp:null, tempHp:0, actionUsed:false, bonusUsed:false,
  reactionUsed:false, oncePerTurn:{}, trackers:{}, showUtility:false,
  collapsed:{}, triggerSel:{}, castLevel:{},
  hidden:{ abilities:{}, trackers:{} } };

// Maps populated on each render(), used by toggleDesc()
let SHORT_DESC = {};
let FULL_DESC  = {};

// HP calculator (not persisted — resets each session)
let calcOpen = false;
let calcExpr = '';

// ═══════════════════════════════════════════════════
//  XML PARSER
// ═══════════════════════════════════════════════════
const WEAPON_TYPES = new Set([5, 6]); // 5 = melee weapon, 6 = ranged weapon
const FINESSE_BIT  = 2;
const ABILITY_KEYS = ['str','dex','con','int','wis','cha'];
const ABILITY_ES   = ['FUE','DES','CON','INT','SAB','CAR'];
// Matches any "limited use resource pool" tracker by label, regardless of
// what the class/character calls it (Concentración, Puntos de Hechicería,
// Psionic Energy, Superiority Dice, etc.)
const RE_PC_TRACKER = /concentraci|psionic energy|puntos? de|superiority|hechicer/i;

function parseFC5eXML(xml) {
  // Strip BOM and any leading whitespace/garbage before <?xml or <character
  xml = xml.replace(/^\uFEFF/, '').trim();
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  const perr = doc.querySelector('parsererror');
  if (perr) throw new Error('XML malformado — ' + perr.textContent.slice(0,150));

  const ch = doc.querySelector('character');
  if (!ch) throw new Error('No se encontró elemento character');

  const name   = $(ch, 'name').split('||')[0].trim();
  const hpMax  = parseInt($(ch, 'hpMax'))     || 10;
  const hpCur  = parseInt($(ch, 'hpCurrent')) || hpMax;

  const scores = $(ch, 'abilities').replace(/,$/, '').split(',').map(Number);
  const [str, dex, con, int_, wis, cha] = scores;
  const m = s => Math.floor((s - 10) / 2);
  const mods = { str:m(str), dex:m(dex), con:m(con), int:m(int_), wis:m(wis), cha:m(cha) };

  // ── Classes (multiclass support) ───────────────────
  const classEls  = $$(ch, 'class');
  const classInfo = classEls.map(c => ({
    el:    c,
    name:  $(c, 'name'),
    level: parseInt($(c, 'level')) || 1
  }));
  const totalLevel = classInfo.reduce((s,c) => s + c.level, 0) || 1;
  const cName = classInfo.map(c => `${c.name} ${c.level}`).join(' / ');
  const prof  = Math.ceil(totalLevel / 4) + 1;
  const raceName = $(ch.querySelector('race'), 'name');

  // ── Trackers (per class, merged) ───────────────────
  let trackers = [];
  classInfo.forEach((ci, classIdx) => {
    const cls = ci.el;

    // Direct <tracker> children of <class> = the curated/selected resources
    [...cls.children].forEach((c, i) => {
      if (c.tagName.toLowerCase() !== 'tracker') return;
      const label = $(c, 'label');
      if (!label) return;
      const type      = parseInt($(c, 'type'))      || 1;
      const resetType = parseInt($(c, 'resetType')) || 0;
      const value     = $(c, 'value') !== '' ? parseInt($(c, 'value')) : null;
      const formula   = $(c, 'formula');
      const fNum      = parseInt(formula);
      const formulaIsNum = !isNaN(fNum) && String(fNum) === formula.trim();

      let max, isDice = false, diceFmt = null;
      if (type === 2 && /d/i.test(formula)) {
        isDice = true; diceFmt = formula;
        max = value ?? 0;
      } else {
        max = formulaIsNum ? fNum : (value ?? 0);
      }

      if (resetType > 0 && max > 0) {
        trackers.push({
          id:`t${classIdx}_${i}`, classIdx, label, type, resetType,
          max, current:max, isDice, diceFmt
        });
      }
    });
  });

  // De-duplicate trackers with same label (keep the one with the larger max)
  const trackerByLabel = {};
  trackers.forEach(t => {
    const key = t.label.toLowerCase();
    if (!trackerByLabel[key] || t.max > trackerByLabel[key].max) trackerByLabel[key] = t;
  });
  trackers = Object.values(trackerByLabel);

  // ── Spell slot trackers (from top-level <slots>, levels 1-9) ──
  // FC5e stores [idx0=?, lvl1, lvl2, ..., lvl9] — index 0 is not a slot level.
  // IMPORTANT: <class> elements also contain their own <slots>, so we must
  // only read the DIRECT child of <character>, not the first descendant match.
  const topSlotsEl = [...ch.children].find(c => c.tagName.toLowerCase() === 'slots');
  const slotsArr = (topSlotsEl?.textContent.trim() || '').replace(/,$/, '').split(',').map(n => parseInt(n) || 0);
  let maxSpellLevel = 0;
  for (let lvl = 1; lvl <= 9; lvl++) {
    const max = slotsArr[lvl] || 0;
    if (max > 0) {
      maxSpellLevel = lvl;
      trackers.push({
        id:`sl${lvl}`, label:`Espacios Nv.${lvl}`, type:1, resetType:2,
        max, current:max, isDice:false, diceFmt:null, isSpellSlot:true, spellLevel:lvl
      });
    }
  }

  // ── Feats: direct <feat> children of <class> = curated/selected list ──
  // (autolevel dumps EVERY subclass option; direct children only contain
  //  what was actually chosen for this character)
  const allFeats = [];
  classInfo.forEach((ci, classIdx) => {
    let direct = [...ci.el.children].filter(c => c.tagName.toLowerCase() === 'feat');
    if (direct.length === 0) {
      // Fallback: very old / minimal exports — scan autolevel
      direct = $$(ci.el, 'feat');
    }
    direct.forEach(f => {
      const n = $(f,'name'), tx = $(f,'text');
      if (n.length > 1) allFeats.push({ name:n, text:tx, source:'class', classIdx });
    });
  });
  ['race','background'].forEach(src => {
    $$(ch.querySelector(src), 'feat').forEach(f => {
      const n = $(f,'name'), tx = $(f,'text');
      if (n.length > 1) allFeats.push({ name:n, text:tx, source:src });
    });
  });

  // ── Items: non-weapon feats + weapon attacks + global spell mods ──
  const allItems = $$(ch, 'item');
  const itemFeats = [];
  const weapons   = [];
  let spellDcBonus = 0, spellAtkBonus = 0;
  allItems.forEach(it => {
    const itName = $(it,'name'), itText = $(it,'text');
    const type   = parseInt($(it,'type'));

    // Global spellcasting modifiers (type 7 = Spell Save DC, type 8 = Spell Attack)
    $$(it,'mod').forEach(md => {
      const mt = parseInt($(md,'type')) || 0;
      const mv = $(md,'value') !== '' ? parseInt($(md,'value')) : 0;
      if (mt === 7) spellDcBonus  += mv;
      if (mt === 8) spellAtkBonus += mv;
    });

    if (WEAPON_TYPES.has(type) && $(it,'damage1H')) {
      weapons.push({
        name: itName,
        type,
        damage1H: $(it,'damage1H'),
        damage2H: $(it,'damage2H'),
        weaponProperty: parseInt($(it,'weaponProperty')) || 0,
        mods: $$(it,'mod').map(md => ({
          type:  parseInt($(md,'type')) || 0,
          value: $(md,'value') !== '' ? parseInt($(md,'value')) : null
        }))
      });
    } else if (itName && itText) {
      itemFeats.push({ name:itName, text:itText, source:'item' });
    }
  });

  // ── Spells: direct <spell> children of each <class> ─────────────
  const spellEntries = [];
  const spellDC = {}; // abilityIdx -> { dc, atk }
  classInfo.forEach((ci, classIdx) => {
    const direct = [...ci.el.children].filter(c => c.tagName.toLowerCase() === 'spell');
    if (!direct.length) return;

    const saIdx = parseInt($(ci.el, 'spellAbility'));
    let abilityIdx = (saIdx >= 0 && saIdx <= 5) ? saIdx : null;

    if (abilityIdx !== null && !spellDC[abilityIdx]) {
      const abMod = mods[ABILITY_KEYS[abilityIdx]];
      spellDC[abilityIdx] = {
        dc:  8 + prof + abMod + spellDcBonus,
        atk: prof + abMod + spellAtkBonus
      };
    }

    direct.forEach((s, i) => {
      const sName = $(s,'name'), sText = $(s,'text');
      if (!sName || !sText) return;
      spellEntries.push({
        id:`sp${classIdx}_${i}`,
        name: sName.trim(),
        text: sText,
        level: parseInt($(s,'level')) || 0,
        time: $(s,'time'),
        range: $(s,'range'),
        duration: $(s,'duration'),
        ritual: $(s,'ritual') === '1',
        abilityIdx
      });
    });
  });

  const abilities = buildAbilities(
    [...allFeats, ...itemFeats], totalLevel, mods, prof, weapons, spellEntries, spellDC
  );

  return { name, hpMax, hpCur, cName, cLvl:totalLevel, classInfo, raceName, prof, mods, trackers, abilities, spellDC, maxSpellLevel };
}

// ── Classify a single ability text ──────────────────
const RE_REACTION = /as a reaction|use (?:your|a) reaction|your reaction to|como reacci[oó]n|reacci[oó]n\s*[-\u2013]|llevar a cabo una reacci/i;
const RE_BONUS    = /as a bonus action|bonus action to|bonus action on your turn|acci[oó]n adicional|acci[oó]n adici[oó]nal|parte de la acci[oó]n adicional/i;
const RE_ACTION   = /as an action[^s]|using an action|as your action|como acci[oó]n[^e]|llevar a cabo la acci[oó]n/i;

function detectAction(name, text) {
  if (RE_REACTION.test(text)) return 'reaction';
  if (RE_BONUS.test(text))    return 'bonus';
  if (RE_ACTION.test(text))   return 'action';
  return null;
}

// ── Classify a spell by its <time> field ────────────
function detectSpellTime(time) {
  const tl = (time || '').toLowerCase();
  if (/reacci|reaction/.test(tl)) return 'reaction';
  if (/bonus action|acci[oó]n adicional/.test(tl)) return 'bonus';
  if (/action|acci[oó]n/.test(tl)) return 'action';
  return 'utility'; // rituals, "X minutes/hours" — outside the turn structure
}

// ── PC / resource cost detection ────────────────────
function detectPCCost(text) {
  const m = text.toLowerCase().match(/(?:gastar|gastando|expend)\s+(?:one|1|(\d+))\s+(?:punto|p\.c\.|psionic energy|superiority)/);
  if (!m) return 0;
  return m[1] ? parseInt(m[1]) : 1;
}

// ═══════════════════════════════════════════════════
//  "FREE ACTION" / TRIGGERED FEATURE DETECTION
//  Features that DON'T consume the action economy but
//  DO spend a resource when a trigger condition is met
//  (Divine Smite, Metamagic, etc.)
// ═══════════════════════════════════════════════════
const RE_TRIGGER_WORD    = /\bcuando\b|\bwhen you\b|inmediatamente (?:despu[eé]s|cuando)|immediately after/i;
const RE_SLOTSPEND       = /gastar(?:le)?\s+(?:uno de tus |un )?espacios? de conjuro|expend(?:ing)?\s+a\s+spell\s+slot|consumir(?:[aá]s)?\s+.*espacio\s+de\s+conjuro/i;
const RE_VARIABLE_RES    = /puntos? de hechicer[ií]a|sorcery points?|punto(?:s)? de psi[oó]nica|psionic energy|dados? de superioridad|superiority dice?/i;
const RE_METAMAGIC_CTX   = /lanzas un conjuro|cast(?:ing)? a (?:sorcerer )?spell/i;

// Parses "Xd Y for/at level 1, plus Zd Y for each level above, up to N d Y"
// style scaling text (Divine Smite and similar). Returns null if the text
// doesn't match this pattern.
function detectScalingDamage(text) {
  const diceRe = /(\d+)d(\d+)/g;
  let m, base = null, perLevel = null, max = null;
  while ((m = diceRe.exec(text))) {
    const before = text.slice(Math.max(0, m.index - 35), m.index);
    const after  = text.slice(m.index + m[0].length, m.index + m[0].length + 55);
    const entry = { n:+m[1], die:+m[2] };
    if (/m[aá]ximo (?:de|of)\s*$|maximum of\s*$/i.test(before)) {
      max = entry;
    } else if (!base && /^[^.]*(?:nivel|level)\s*1\b|^[^.]*1(?:st|°|º)?.?\s*level/i.test(after)) {
      base = entry;
    } else if (!perLevel && /^[^.]*(?:por cada nivel|each (?:spell )?level|cada nivel adicional)/i.test(after)) {
      perLevel = entry;
    }
  }
  if (base && perLevel) {
    let maxN = base.n + 8 * perLevel.n, maxLevel = 9;
    if (max) { maxN = max.n; maxLevel = 1 + Math.round((max.n - base.n) / perLevel.n); }
    return { die: base.die, baseN: base.n, perLevelN: perLevel.n, maxN, maxLevel: Math.min(9, maxLevel) };
  }
  return null;
}

// Classifies a feat that detectAction() couldn't place into action/bonus/
// reaction as a "trigger" — something that fires off another event
// (a hit, casting a spell, etc.) and spends a resource instead of a slot
// in the turn structure.
function classifyTrigger(text) {
  if (!RE_TRIGGER_WORD.test(text)) return null;

  if (RE_SLOTSPEND.test(text)) {
    return { triggerKind:'smite', pc:0, scaling: detectScalingDamage(text), variablePC:false };
  }
  const fixedPC = detectPCCost(text);
  const isMeta  = RE_METAMAGIC_CTX.test(text);
  if (fixedPC > 0) {
    return { triggerKind: isMeta ? 'metamagic' : 'resource', pc:fixedPC, scaling:null, variablePC:false };
  }
  if (RE_VARIABLE_RES.test(text)) {
    return { triggerKind: isMeta ? 'metamagic' : 'resource', pc:0, scaling:null, variablePC:true };
  }
  return null;
}

// ── Short description from full text ───────────────
function shortDesc(text) {
  const clean = text.replace(/\n/g,' ').replace(/\s+/g,' ').trim();
  const m = clean.match(/^.{20,140}?[.!?]/);
  if (m) return m[0];
  return clean.slice(0, 130) + (clean.length > 130 ? '…' : '');
}
function fullDescClean(text) {
  return text.replace(/\n{2,}/g,'\n').trim();
}

// ═══════════════════════════════════════════════════
//  UNIVERSAL ABILITY TAGGING
//  Classifies any ability/spell by what it DOES, based on
//  its description text (bilingual EN/ES). Powers the
//  generic "Sugerencias" combo system below.
// ═══════════════════════════════════════════════════
const TAG_RULES = [
  { tag:'heal',    re:/recuper(?:as?|aci[oó]n)\b|san(?:a|ar|as|aci[oó]n)\b|cura(?:s|ci[oó]n)?\b|regain.*hit points|hit points.*regain|heal(?:ing)?\b/i },
  { tag:'defense', re:/resistencia a|resistance to|puntos de golpe temporal|temporary hit points|\bca\s*\+|armor class|esquivar|dodge|cobertura total|immunity|inmunidad/i },
  { tag:'mobility',re:/velocidad de (?:vuelo|excavaci[oó]n|trepar|nataci[oó]n)|flying speed|teletransport|teleport|salto.*(?:pies|feet)|jump|no provoca? ataques? de oportunidad|without provoking opportunity/i },
  { tag:'damage',  re:/\d+d\d+|puntos? de da[ñn]o|hit points of damage|damage\b/i },
  { tag:'buff',    re:/ventaja en|advantage on|bonificador (?:a|de)|bonus to|gana[ns]? .* puntos de golpe m[aá]ximos|increases by/i },
];

// Condition keywords (used both for "control" — inflicting — and for
// detecting "cure" abilities, which remove these same conditions).
const RE_CONDITION = /aturdid|paraliz|asustad[oa]|incapacitad|derribad[oa]|apresad[oa]|ralentiz|hechizad[oa]|cegad[oa]|ensordecid[oa]|envenenad[oa]|stunned|paralyz|frightened|incapacitated|prone|restrained|grappled|slowed|charmed|blinded|deafened|poisoned|petrif/i;
// "ends/cures/removes a condition" — these are SUPPORT, not control.
const RE_CURE = /termina(?:s|r)?\s+(?:un[oa]?|uno de|with|one of)|ends? (?:one of |a )?(?:the following )?condition|cures?\b|elimina(?:s|r)?\s+(?:un[oa]?|uno de)|remove(?:s)?\s+(?:one|a|the)|restablec/i;

function tagAbility(ab) {
  const text = (ab.full || ab.desc || '') + ' ' + (ab.name || '');
  const tags = [];
  for (const r of TAG_RULES) if (r.re.test(text)) tags.push(r.tag);

  if (RE_CONDITION.test(text)) {
    if (RE_CURE.test(text)) {
      if (!tags.includes('heal')) tags.push('heal'); // curing a condition = support
    } else {
      tags.push('control'); // inflicting a condition on a target
    }
  }

  if (!tags.length) tags.push('utility');
  return tags;
}

// ── Rough average-damage estimate for ranking "best damage" ──
function estimateDamage(ab) {
  if (ab.dmgEstimate != null) return ab.dmgEstimate; // precomputed for weapon/unarmed attacks
  const text = ab.full || ab.desc || '';
  const m = text.match(/(\d+)d(\d+)(?:\s*\+\s*(\d+))?/);
  if (!m) return 0;
  const n = +m[1], die = +m[2], bonus = m[3] ? +m[3] : 0;
  return Math.round((n * (die+1) / 2 + bonus) * 10) / 10;
}

const SKIP_NAMES = /^(description|descripci[oó]n|characteristics|caracter[ií]sticas|starting\s|multiclass|proficiency|equipment|languages|idiomas|age|size|speed|ability score improvement|style$|instructor$|well-rounded|trained for|creating a|heraldic|xanathar)/i;

function buildAbilities(entries, level, mods, prof, weapons, spellEntries, spellDC) {
  const out = { action:[], bonus:[], reaction:[], utility:[], trigger:[] };


  const attacks = level >= 11 ? 3 : level >= 5 ? 2 : 1;

  // ── Base unarmed attack ──────────────────────────
  const abMod   = Math.max(mods.str, mods.dex);
  const unarmedB = abMod + prof;
  const unarmedSign = abMod >= 0 ? '+' : '';
  const unarmedDie = level >= 5 ? 8 : 4;
  const unarmedD = `1d${unarmedDie}${unarmedSign}${abMod}`;
  const unarmedObj = {
    id:'__attack', name:'Atacar (sin armas)',
    desc:`${attacks} ${attacks>1?'ataques':'ataque'} · +${unarmedB} al impacto · ${unarmedD}`,
    full:null, pc:0, once:false, source:'class', spellLevel:0, dc:null,
    dmgEstimate: Math.round(attacks * ((unarmedDie+1)/2 + abMod) * 10) / 10
  };
  unarmedObj.tags = tagAbility(unarmedObj);
  out.action.push(unarmedObj);

  // ── Weapon attacks ────────────────────────────────
  weapons.filter(w => !/unarmed|sin armas/i.test(w.name)).forEach((w, wi) => {
    const finesse  = (w.weaponProperty & FINESSE_BIT) !== 0;
    const isRanged = w.type === 6;
    const abMod    = isRanged ? mods.dex : (finesse ? Math.max(mods.str, mods.dex) : mods.str);

    let modAtk = 0, modDmg = 0, hasMods = false;
    (w.mods || []).forEach(md => {
      if (md.type === 1) {           // Weapon Attacks (+) modifier
        hasMods = true;
        const v = md.value != null ? md.value : prof; // "no value" = + Proficiency Bonus
        modAtk += v;
        if (md.value == null) modDmg += v; // extra prof-style mods also boost damage
      } else if (md.type === 2) {    // Weapon Damage (+) modifier
        hasMods = true;
        modDmg += (md.value != null ? md.value : prof);
      }
    });

    // Fallback for weapons without explicit <mod> data: read "+N" from the name
    if (!hasMods) {
      const magicM = w.name.match(/\+(\d)\b/);
      const magicB = magicM ? parseInt(magicM[1]) : 0;
      modAtk = magicB; modDmg = magicB;
    }

    const atkB    = abMod + prof + modAtk;
    const dmgB    = abMod + modDmg;
    const dmgSign = dmgB >= 0 ? '+' : '';
    let dmgStr = `${w.damage1H}${dmgSign}${dmgB}`;
    if (w.damage2H) dmgStr += ` (2 manos: ${w.damage2H}${dmgSign}${dmgB})`;

    const diceM = w.damage1H.match(/(\d+)d(\d+)/);
    const dmgEst = diceM ? (+diceM[1] * (+diceM[2]+1)/2 + dmgB) : dmgB;

    const wObj = {
      id:`w${wi}`, name:`Atacar con ${w.name}`,
      desc:`${attacks} ${attacks>1?'ataques':'ataque'} · +${atkB} al impacto · ${dmgStr}`,
      full:null, pc:0, once:false, source:'weapon', spellLevel:0, dc:null,
      dmgEstimate: Math.round(attacks * dmgEst * 10) / 10
    };
    wObj.tags = tagAbility(wObj);
    out.action.push(wObj);
  });

  // ── Feats / item abilities ────────────────────────
  const seen = new Set();
  entries.forEach((e, idx) => {
    if (SKIP_NAMES.test(e.name)) return;
    if (e.text.length < 30) return;

    const key = e.name.toLowerCase();
    if (seen.has(key)) return;

    const pushTrigger = (trig) => {
      seen.add(key);
      const desc = shortDesc(e.text);
      const full = fullDescClean(e.text);
      const obj = {
        id:`e${idx}`, name:e.name, desc,
        full: (full !== desc ? full : null),
        pc:trig.pc, once:false, source:e.source, spellLevel:0, dc:null,
        triggerKind: trig.triggerKind, scaling: trig.scaling, variablePC: trig.variablePC
      };
      obj.tags = tagAbility(obj);
      out.trigger.push(obj);
    };

    // Metamagic options modify a spell being cast — their text often
    // describes the EFFECT in action-economy terms (e.g. "...the casting
    // time becomes 1 bonus action"), which would otherwise be mistaken
    // for the feature's OWN cost. Metamagic always wins.
    const trig = classifyTrigger(e.text);
    if (trig && trig.triggerKind === 'metamagic') { pushTrigger(trig); return; }

    const type = detectAction(e.name, e.text);

    if (!type) {
      // Not tied to the action economy — maybe it's a triggered/"free"
      // feature (Divine Smite, Stunning Strike, etc.) that spends a resource.
      if (!trig) return;
      pushTrigger(trig);
      return;
    }

    seen.add(key);

    const pc    = detectPCCost(e.text);
    const once  = /once (?:on each|per) turn|una vez por turno/i.test(e.text);
    const desc  = shortDesc(e.text);
    const full  = fullDescClean(e.text);

    const obj = {
      id:`e${idx}`, name:e.name, desc,
      full: (full !== desc ? full : null),
      pc, once, source:e.source, spellLevel:0, dc:null
    };
    obj.tags = tagAbility(obj);
    out[type].push(obj);
  });

  // ── Spells ─────────────────────────────────────────
  const RE_SAVE = /salvaci[oó]n de|tirada de salvaci[oó]n|saving throw/i;
  (spellEntries || []).forEach(sp => {
    const stype = detectSpellTime(sp.time);

    const key = sp.name.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);

    const dcInfo = (sp.abilityIdx !== null) ? spellDC[sp.abilityIdx] : null;
    const hasSave = RE_SAVE.test(sp.text);
    const dc = (hasSave && dcInfo) ? dcInfo.dc : null;

    const levelLabel = sp.level === 0 ? 'Truco' : `Nivel ${sp.level}`;
    const metaParts = [levelLabel];
    if (sp.ritual) metaParts.push('Ritual');
    if (sp.time && stype === 'utility') metaParts.push(sp.time);
    if (sp.range)    metaParts.push(sp.range);
    if (sp.duration && !/^instantaneous|^instant[aá]neo/i.test(sp.duration)) metaParts.push(sp.duration);

    let full = fullDescClean(sp.text);
    if (sp.range || sp.duration) {
      full = `${sp.range ? 'Alcance: '+sp.range : ''}${sp.range && sp.duration ? ' · ' : ''}${sp.duration ? 'Duración: '+sp.duration : ''}\n\n${full}`;
    }
    const desc = shortDesc(sp.text);

    const obj = {
      id: sp.id, name: sp.name, desc,
      full: (full !== desc ? full : null),
      pc:0, once:false, source:'spell',
      spellLevel: sp.level, dc,
      meta: metaParts.join(' · ')
    };
    obj.tags = tagAbility(obj);
    out[stype].push(obj);
  });

  return out;
}

// ═══════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════
function render() {
  if (!char) return;
  SHORT_DESC = {}; FULL_DESC = {};

  document.getElementById('hdr-name').textContent = char.name;
  document.getElementById('hdr-meta').textContent =
    `${char.cName} · ${char.raceName}`;
  document.getElementById('hdr-round').textContent = G.round;

  const hp = G.hp ?? char.hpCur;
  let h = '';

  // ── HP ──────────────────────────────────────────
  const tempHp = G.tempHp || 0;
  h += `<div class="hp-row">
    <span class="hp-label">Puntos de golpe</span>
    <div class="hp-controls">
      ${tempHp > 0 ? `<span class="hp-temp">+${tempHp}</span>` : ''}
      <button class="adj-btn" onclick="chHP(-1)">−</button>
      <div class="hp-val" onclick="toggleCalc()">${hp}<span class="hp-max"> / ${char.hpMax}</span></div>
      <button class="adj-btn" onclick="chHP(1)">+</button>
      <button class="calc-btn ${calcOpen?'open':''}" onclick="toggleCalc()" title="Calculadora">🧮</button>
    </div>
  </div>`;

  if (calcOpen) {
    const exprEmpty = calcExpr.length === 0;
    h += `<div class="calc-panel">
      <div class="calc-display ${exprEmpty?'empty':''}">${esc(calcExpr || '0')}</div>
      <div class="calc-grid">
        <button class="calc-key die" onclick="calcRoll(4)">d4</button>
        <button class="calc-key die" onclick="calcRoll(6)">d6</button>
        <button class="calc-key die" onclick="calcRoll(8)">d8</button>
        <button class="calc-key clear" onclick="calcBackspace()">⌫</button>

        <button class="calc-key die" onclick="calcRoll(10)">d10</button>
        <button class="calc-key die" onclick="calcRoll(12)">d12</button>
        <button class="calc-key die" onclick="calcRoll(20)">d20</button>
        <button class="calc-key op" onclick="calcKey('/')">÷</button>

        <button class="calc-key" onclick="calcKey('7')">7</button>
        <button class="calc-key" onclick="calcKey('8')">8</button>
        <button class="calc-key" onclick="calcKey('9')">9</button>
        <button class="calc-key op" onclick="calcKey('*')">×</button>

        <button class="calc-key" onclick="calcKey('4')">4</button>
        <button class="calc-key" onclick="calcKey('5')">5</button>
        <button class="calc-key" onclick="calcKey('6')">6</button>
        <button class="calc-key op" onclick="calcKey('-')">−</button>

        <button class="calc-key" onclick="calcKey('1')">1</button>
        <button class="calc-key" onclick="calcKey('2')">2</button>
        <button class="calc-key" onclick="calcKey('3')">3</button>
        <button class="calc-key op" onclick="calcKey('+')">+</button>

        <button class="calc-key" onclick="calcKey('0')">0</button>
        <button class="calc-key" onclick="calcKey('(')">(</button>
        <button class="calc-key" onclick="calcKey(')')">)</button>
        <button class="calc-key clear" onclick="calcClear()">C</button>
      </div>
      <div class="calc-actions">
        <button class="calc-act calc-heal" onclick="calcApply('heal')">CURAR</button>
        <button class="calc-act calc-temp" onclick="calcApply('temp')">PG TEMP</button>
        <button class="calc-act calc-dmg" onclick="calcApply('damage')">DAÑO</button>
      </div>
    </div>`;
  }

  // ── Spell DC / attack bonus ───────────────────────
  const dcKeys = Object.keys(char.spellDC || {});
  if (dcKeys.length > 0) {
    h += `<div class="dc-row">`;
    dcKeys.forEach(k => {
      const info = char.spellDC[k];
      const ab = ABILITY_ES[parseInt(k)] || '';
      h += `<div class="dc-badge">CD conjuros (${ab}): <b>${info.dc}</b></div>`;
      h += `<div class="dc-badge">Ataque conjuros: <b>+${info.atk}</b></div>`;
    });
    h += `</div>`;
  }

  // ── Trackers ─────────────────────────────────────
  const visTrackers = char.trackers.filter(t => !G.hidden.trackers[t.id]);
  const hiddenTCount = char.trackers.length - visTrackers.length;

  if (visTrackers.length > 0) {
    const trCollapsed = !!G.collapsed.trackers;
    h += `<div class="util-toggle sec-toggle ${trCollapsed?'collapsed':''}" onclick="toggleSection('trackers')">
      <span>📊 Recursos (${visTrackers.length})</span>
      <span class="chev">▾</span>
    </div>`;
    if (!trCollapsed) {
    h += `<div class="trackers-grid">`;
    visTrackers.forEach(t => {
      const cur = G.trackers[t.id] ?? t.max;
      const reset = t.resetType === 1 ? 'DsC' : t.resetType === 2 ? 'DsL' : '';
      h += `<div class="tcard">`;
      h += `<button class="x-btn" onclick="hideTracker('${t.id}')" title="Ocultar">✕</button>`;
      h += `<div class="tcard-label">${esc(t.label)}</div>`;

      if (t.isDice && t.diceFmt) {
        h += `<div class="tcard-dice">${esc(t.diceFmt)}</div>`;
        if (t.max > 0) {
          h += `<div class="tcard-num">
            <button class="tnum-btn" onclick="chTracker('${t.id}',-1)">−</button>
            <span class="tnum-val">${cur}</span>
            <span class="tnum-max">/ ${t.max}</span>
            <button class="tnum-btn" onclick="chTracker('${t.id}',1)">+</button>
          </div>`;
        }
      } else if (t.max <= 8) {
        h += `<div class="tcard-dots">`;
        for (let i = 0; i < t.max; i++) {
          h += `<div class="tdot ${i<cur?'on':''}" onclick="clickTDot('${t.id}',${i})"></div>`;
        }
        h += `</div>`;
        h += `<div style="font-size:.78rem;color:var(--muted)">${cur} / ${t.max}</div>`;
      } else {
        h += `<div class="tcard-num">
          <button class="tnum-btn" onclick="chTracker('${t.id}',-1)">−</button>
          <span class="tnum-val">${cur}</span>
          <span class="tnum-max">/ ${t.max}</span>
          <button class="tnum-btn" onclick="chTracker('${t.id}',1)">+</button>
        </div>`;
      }

      if (reset) h += `<div class="tcard-reset">${reset}</div>`;
      h += `</div>`;
    });
    h += `</div>`;
    }
  }

  // ── Controls ─────────────────────────────────────
  h += `<div class="ctrl-row">
    <button class="btn-ctrl accent" onclick="finTurn()">Fin de turno</button>
    <button class="btn-ctrl" onclick="shortRest()">Desc. corto</button>
    <button class="btn-ctrl danger" onclick="longRest()">Desc. largo</button>
  </div>`;

  // ── Action sections ───────────────────────────────
  const secs = [
    { key:'action',   label:'Acción',           dot:'d-action',   flag:'actionUsed' },
    { key:'bonus',    label:'Acción adicional',  dot:'d-bonus',    flag:'bonusUsed' },
    { key:'reaction', label:'Reacción',          dot:'d-reaction', flag:'reactionUsed' },
  ];

  let hiddenACount = 0;

  secs.forEach(sec => {
    const all = char.abilities[sec.key] || [];
    const abs = all.filter(a => !G.hidden.abilities[a.id]);
    hiddenACount += all.length - abs.length;
    if (!abs.length) return;
    const slotUsed = G[sec.flag];
    const collapsed = !!G.collapsed[sec.key];

    h += `<div class="section"><div class="sec-head sec-toggle ${collapsed?'collapsed':''}" onclick="toggleSection('${sec.key}')">
      <div class="sec-dot ${sec.dot}"></div>
      <span class="sec-name">${sec.label} (${abs.length})</span>
      <span style="margin-left:auto;display:flex;align-items:center;gap:6px">
        ${slotUsed ? '<span class="sec-used" style="margin-left:0">usada</span>' : ''}
        <span class="chev">▾</span>
      </span>
    </div>`;

    if (!collapsed) {
    abs.forEach(ab => {
      const onceUsed = ab.once && G.oncePerTurn[ab.id];
      const pcTracker = char.trackers.find(t => RE_PC_TRACKER.test(t.label));
      const pcCur = pcTracker ? (G.trackers[pcTracker.id] ?? pcTracker.max) : 99;
      const pcOk  = pcCur >= ab.pc;

      // Spell slot availability / upcasting
      let slotOk = true, slotTracker = null, castLevel = ab.spellLevel;
      let canUpcast = false, maxCastLevel = ab.spellLevel;
      if (ab.spellLevel > 0) {
        maxCastLevel = Math.max(ab.spellLevel, char.maxSpellLevel || ab.spellLevel);
        canUpcast = maxCastLevel > ab.spellLevel;
        castLevel = Math.min(Math.max(G.castLevel[ab.id] ?? ab.spellLevel, ab.spellLevel), maxCastLevel);
        slotTracker = char.trackers.find(t => t.id === `sl${castLevel}`);
        const slotCur = slotTracker ? (G.trackers[slotTracker.id] ?? slotTracker.max) : 0;
        slotOk = slotTracker ? slotCur > 0 : false;
      }

      const dis   = slotUsed || onceUsed || !pcOk || !slotOk;
      const cls2  = slotUsed ? 'used' : (!pcOk || onceUsed || !slotOk ? 'locked' : '');
      const fn    = dis ? '' : `useAb('${ab.id}','${sec.flag}',${ab.pc},${ab.once},${ab.spellLevel>0?castLevel:0})`;
      const srcLabel = ab.source === 'item'   ? '📦 ítem' :
                       ab.source === 'weapon' ? '🗡 arma' :
                       ab.source === 'race'   ? '🧬 raza' :
                       ab.source === 'background' ? '🗺 trasfondo' :
                       ab.source === 'spell'  ? '🔮 conjuro' : '';

      SHORT_DESC[ab.id] = ab.desc;
      if (ab.full) FULL_DESC[ab.id] = ab.full;

      // Cost badge: spell slot (with upcast stepper) > PC/resource > free
      let costBadge;
      if (ab.spellLevel > 0) {
        if (canUpcast) {
          costBadge = `<div class="stepper" onclick="event.stopPropagation()">
            <button class="stepper-btn" onclick="setCastLevel('${ab.id}',-1,${ab.spellLevel},${maxCastLevel})" ${castLevel<=ab.spellLevel?'disabled':''}>−</button>
            <span class="stepper-val" style="${slotOk?'':'color:var(--red)'}">Nv.${castLevel}</span>
            <button class="stepper-btn" onclick="setCastLevel('${ab.id}',1,${ab.spellLevel},${maxCastLevel})" ${castLevel>=maxCastLevel?'disabled':''}>+</button>
          </div>`;
        } else {
          costBadge = `<span class="cost ${slotOk?'c-blue':'c-locked'}">Nv.${ab.spellLevel}</span>`;
        }
      } else if (ab.pc > 0) {
        costBadge = `<span class="cost ${pcOk?'c-blue':'c-locked'}">${ab.pc} PC</span>`;
      } else {
        costBadge = `<span class="cost c-free">gratis</span>`;
      }

      h += `<div class="ab ${cls2}" onclick="${fn}">
        <button class="x-btn" onclick="event.stopPropagation();hideAbility('${ab.id}')" title="Ocultar">✕</button>
        <div class="ab-main">
          <div class="ab-name">${esc(ab.name)}</div>
          <div class="ab-desc" id="desc-${ab.id}">${esc(ab.desc)}</div>
          ${ab.full ? `<span class="ab-more" id="more-${ab.id}" onclick="event.stopPropagation();toggleDesc('${ab.id}')">ver más ▾</span>` : ''}
          ${ab.meta || srcLabel ? `<div class="ab-src">${ab.meta ? esc(ab.meta) : ''}${ab.meta && srcLabel ? ' · ' : ''}${srcLabel}</div>` : ''}
        </div>
        <div class="ab-costs">
          ${costBadge}
          ${ab.dc != null ? `<span class="cost c-amber">CD ${ab.dc}</span>` : ''}
          ${ab.once ? `<span class="cost ${onceUsed?'c-locked':'c-amber'}">${onceUsed?'✓ usada':'1/turno'}</span>` : ''}
        </div>
      </div>`;
    });
    }
    h += `</div>`;
  });

  // ── "Mejoras y disparadores" (free/triggered features) ─
  const trigAll = char.abilities.trigger || [];
  hiddenACount += trigAll.filter(a => G.hidden.abilities[a.id]).length;
  h += renderTriggerSection();

  // ── Universal combo suggestions ───────────────────
  h += renderSuggestions();

  // ── Out-of-combat / utility section ───────────────
  const utilAll = char.abilities.utility || [];
  hiddenACount += utilAll.filter(a => G.hidden.abilities[a.id]).length;
  h += renderUtilitySection();

  // ── Footer: open recycle bin ──────────────────────
  const totalHidden = hiddenACount + hiddenTCount;
  if (totalHidden > 0) {
    h += `<button class="footer-btn" onclick="openTrash()">🗑 Elementos ocultos (${totalHidden})</button>`;
  }

  document.getElementById('content').innerHTML = h;
}

// ═══════════════════════════════════════════════════
//  UNIVERSAL SUGGESTION ENGINE
//  Looks at every currently-available ability/spell and
//  groups the best picks by what they accomplish, so the
//  same code works for any character built in FC5e.
// ═══════════════════════════════════════════════════
const SUGGESTION_CATS = [
  { key:'damage',   label:'💥 Mayor daño' },
  { key:'heal',     label:'❤️ Curación / Soporte' },
  { key:'control',  label:'🌀 Control de combate' },
  { key:'defense',  label:'🛡️ Defensa / Supervivencia' },
  { key:'mobility', label:'💨 Movilidad' },
];
const SLOT_LABELS = { action:'Acción', bonus:'Adicional', reaction:'Reacción' };

function matchesCategory(tags, cat) {
  switch (cat) {
    case 'damage':   return tags.includes('damage') && !tags.includes('heal');
    case 'heal':     return tags.includes('heal') || (tags.includes('buff') && !tags.includes('damage') && !tags.includes('control'));
    case 'control':  return tags.includes('control');
    case 'defense':  return tags.includes('defense');
    case 'mobility': return tags.includes('mobility');
    default: return false;
  }
}

function abilityAvailable(ab, secFlag) {
  if (G[secFlag]) return false;
  if (ab.once && G.oncePerTurn[ab.id]) return false;
  const pcTracker = char.trackers.find(t => RE_PC_TRACKER.test(t.label));
  const pcCur = pcTracker ? (G.trackers[pcTracker.id] ?? pcTracker.max) : 99;
  if (pcCur < ab.pc) return false;
  if (ab.spellLevel > 0) {
    const st = char.trackers.find(t => t.id === `sl${ab.spellLevel}`);
    const cur = st ? (G.trackers[st.id] ?? st.max) : 0;
    if (cur <= 0) return false;
  }
  return true;
}

function buildSuggestions() {
  const results = [];
  SUGGESTION_CATS.forEach(cat => {
    const picks = {};
    ['action','bonus','reaction'].forEach(sec => {
      const secFlag = sec === 'action' ? 'actionUsed' : sec === 'bonus' ? 'bonusUsed' : 'reactionUsed';
      const candidates = (char.abilities[sec] || [])
        .filter(ab => !G.hidden.abilities[ab.id])
        .filter(ab => matchesCategory(ab.tags || [], cat.key))
        .filter(ab => abilityAvailable(ab, secFlag));
      if (!candidates.length) return;

      let best;
      if (cat.key === 'damage') {
        best = candidates.reduce((a,b) => estimateDamage(b) > estimateDamage(a) ? b : a);
      } else {
        best = candidates.reduce((a,b) => (b.spellLevel||0) > (a.spellLevel||0) ? b : a);
      }
      picks[sec] = { ab: best, secFlag };
    });
    if (Object.keys(picks).length) results.push({ ...cat, picks });
  });
  return results;
}

function renderSuggestions() {
  const suggestions = buildSuggestions();

  let h = `<div class="section"><div class="sec-head">
    <div class="sec-dot d-combo"></div>
    <span class="sec-name">Sugerencias para este turno</span>
  </div>`;

  if (!suggestions.length) {
    h += `<div class="sugg-card"><div class="sugg-empty">Sin opciones disponibles ahora — termina el turno o descansa para recuperar recursos.</div></div>`;
    return h + `</div>`;
  }

  suggestions.forEach(s => {
    h += `<div class="sugg-card"><div class="sugg-cat">${s.label}</div>`;
    ['action','bonus','reaction'].forEach(sec => {
      const pick = s.picks[sec];
      if (!pick) return;
      const ab = pick.ab;
      const fn = `useAb('${ab.id}','${pick.secFlag}',${ab.pc},${ab.once},${ab.spellLevel||0})`;
      let extra = '';
      if (s.key === 'damage') {
        const d = estimateDamage(ab);
        if (d) extra = `~${d} dmg`;
      } else if (ab.dc != null) {
        extra = `CD ${ab.dc}`;
      } else if (ab.spellLevel > 0) {
        extra = `Nv.${ab.spellLevel}`;
      }
      h += `<div class="sugg-pick" onclick="${fn}">
        <span class="sugg-slot">${SLOT_LABELS[sec]}</span>
        <span class="sugg-name">${esc(ab.name)}</span>
        ${extra ? `<span class="sugg-extra">${esc(extra)}</span>` : ''}
      </div>`;
    });
    h += `</div>`;
  });

  return h + `</div>`;
}

// ═══════════════════════════════════════════════════
//  OUT-OF-COMBAT / UTILITY SECTION
//  Rituals, long-casting spells, exploration & social
//  tools. Not tied to the turn structure — using one
//  spends its resource (if any) right away, so it
//  carries over correctly into a later combat.
// ═══════════════════════════════════════════════════
function renderUtilitySection() {
  const all = (char.abilities.utility || []).filter(a => !G.hidden.abilities[a.id]);
  if (!all.length) return '';

  const open = !!G.showUtility;
  let h = `<div class="util-toggle ${open?'open':''}" onclick="toggleUtility()">
    <span>🧭 Fuera de combate (${all.length})</span>
    <span class="chev">▶</span>
  </div>`;
  if (!open) return h;

  h += `<div class="section">`;
  all.forEach(ab => {
    SHORT_DESC[ab.id] = ab.desc;
    if (ab.full) FULL_DESC[ab.id] = ab.full;

    let slotOk = true, slotTracker = null;
    if (ab.spellLevel > 0) {
      slotTracker = char.trackers.find(t => t.id === `sl${ab.spellLevel}`);
      const slotCur = slotTracker ? (G.trackers[slotTracker.id] ?? slotTracker.max) : 0;
      slotOk = slotTracker ? slotCur > 0 : false;
    }
    const srcLabel = ab.source === 'item'   ? '📦 ítem' :
                     ab.source === 'race'   ? '🧬 raza' :
                     ab.source === 'background' ? '🗺 trasfondo' :
                     ab.source === 'spell'  ? '🔮 conjuro' : '';

    h += `<div class="ab util">
      <button class="x-btn" onclick="hideAbility('${ab.id}')" title="Ocultar">✕</button>
      <div class="ab-main">
        <div class="ab-name">${esc(ab.name)}</div>
        <div class="ab-desc" id="desc-${ab.id}">${esc(ab.desc)}</div>
        ${ab.full ? `<span class="ab-more" id="more-${ab.id}" onclick="toggleDesc('${ab.id}')">ver más ▾</span>` : ''}
        ${ab.meta || srcLabel ? `<div class="ab-src">${ab.meta?esc(ab.meta):''}${ab.meta&&srcLabel?' · ':''}${srcLabel}</div>` : ''}
      </div>
      <div class="ab-costs">
        ${ab.spellLevel>0
          ? `<span class="cost ${slotOk?'c-blue':'c-locked'}">Nv.${ab.spellLevel}</span>`
          : `<span class="cost c-free">gratis</span>`}
        ${ab.dc!=null ? `<span class="cost c-amber">CD ${ab.dc}</span>` : ''}
        ${ab.spellLevel>0 ? `<button class="usar-btn" onclick="useUtility('${ab.id}',${ab.spellLevel})" ${slotOk?'':'disabled'}>Usar</button>` : ''}
      </div>
    </div>`;
  });
  h += `</div>`;
  return h;
}

function toggleSection(key) { G.collapsed[key] = !G.collapsed[key]; save(); render(); }
function setCastLevel(id, delta, min, max) {
  const cur = G.castLevel[id] ?? min;
  G.castLevel[id] = Math.max(min, Math.min(max, cur + delta));
  save(); render();
}
function toggleUtility() { G.showUtility = !G.showUtility; save(); render(); }
function useUtility(id, spellLevel) {
  spendSpellSlot(spellLevel);
  save(); render();
  toast('Espacio de conjuro gastado');
}

// ═══════════════════════════════════════════════════
//  "MEJORAS Y DISPARADORES" SECTION
//  Free/triggered features: Divine Smite (scales with the
//  spell slot spent), Metamagic, and other "spend a resource
//  when X happens" abilities that don't use the action economy.
// ═══════════════════════════════════════════════════
function pcAbbrev(label) {
  if (!label) return 'recurso';
  if (/concentraci/i.test(label)) return 'PC';
  if (/hechicer/i.test(label)) return 'PH';
  if (/psionic/i.test(label)) return 'dado psi.';
  if (/superiority|superioridad/i.test(label)) return 'dado sup.';
  return label;
}

function renderTriggerSection() {
  const all = (char.abilities.trigger || []).filter(a => !G.hidden.abilities[a.id]);
  if (!all.length) return '';

  const collapsed = !!G.collapsed.trigger;
  let h = `<div class="section"><div class="sec-head sec-toggle ${collapsed?'collapsed':''}" onclick="toggleSection('trigger')">
    <div class="sec-dot d-combo"></div>
    <span class="sec-name">⚡ Mejoras y disparadores (${all.length})</span>
    <span class="chev" style="margin-left:auto">▾</span>
  </div>`;
  if (collapsed) return h + `</div>`;

  const pcTracker = char.trackers.find(t => RE_PC_TRACKER.test(t.label));
  const resLabel = pcAbbrev(pcTracker?.label);
  const maxSlotLevel = char.maxSpellLevel || 0;

  all.forEach(ab => {
    SHORT_DESC[ab.id] = ab.desc;
    if (ab.full) FULL_DESC[ab.id] = ab.full;
    const srcLabel = ab.source === 'item' ? '📦 ítem' :
                     ab.source === 'race' ? '🧬 raza' :
                     ab.source === 'background' ? '🗺 trasfondo' : '';
    const displayName = ab.triggerKind === 'metamagic' && !/metamagi/i.test(ab.name)
      ? `🔀 Metamagia: ${ab.name}` : ab.name;

    h += `<div class="trig">
      <button class="x-btn" onclick="hideAbility('${ab.id}')" title="Ocultar">✕</button>
      <div class="trig-head">
        <div class="trig-main">
          <div class="trig-name">${esc(displayName)}</div>
          <div class="trig-desc" id="desc-${ab.id}">${esc(ab.desc)}</div>
          ${ab.full ? `<span class="ab-more" id="more-${ab.id}" onclick="toggleDesc('${ab.id}')">ver más ▾</span>` : ''}
          ${srcLabel ? `<div class="ab-src">${srcLabel}</div>` : ''}
        </div>
      </div>`;

    if (ab.triggerKind === 'smite') {
      const min = 1;
      const max = ab.scaling ? Math.min(ab.scaling.maxLevel, maxSlotLevel || ab.scaling.maxLevel) : (maxSlotLevel || 1);
      const sel = Math.min(Math.max(G.triggerSel[ab.id] ?? min, min), Math.max(max,min));
      const slotT = char.trackers.find(t => t.id === `sl${sel}`);
      const slotCur = slotT ? (G.trackers[slotT.id] ?? slotT.max) : 0;
      const slotOk = slotCur > 0;
      let dmgLabel = '';
      if (ab.scaling) {
        const dice = Math.min(ab.scaling.maxN, ab.scaling.baseN + (sel-1)*ab.scaling.perLevelN);
        dmgLabel = `+${dice}d${ab.scaling.die}`;
      }

      h += `<div class="trig-foot">
        <span class="sugg-slot" style="min-width:auto">Espacio</span>
        <div class="stepper">
          <button class="stepper-btn" onclick="setTriggerLevel('${ab.id}',-1,${min},${max})" ${sel<=min?'disabled':''}>−</button>
          <span class="stepper-val">Nv.${sel}</span>
          <button class="stepper-btn" onclick="setTriggerLevel('${ab.id}',1,${min},${max})" ${sel>=max?'disabled':''}>+</button>
        </div>
        ${dmgLabel ? `<span class="trig-dmg">${dmgLabel}</span>` : ''}
        <button class="usar-btn" onclick="useSmite('${ab.id}',${sel})" ${slotOk?'':'disabled'} style="margin-top:0;margin-left:auto">Usar</button>
      </div>`;
    } else {
      // metamagic / generic resource trigger
      if (ab.variablePC) {
        const cost = Math.min(Math.max(G.triggerSel[ab.id] ?? 1, 1), 9);
        const cur = pcTracker ? (G.trackers[pcTracker.id] ?? pcTracker.max) : 0;
        const ok = cur >= cost;
        h += `<div class="trig-foot">
          <span class="sugg-slot" style="min-width:auto">Costo</span>
          <div class="stepper">
            <button class="stepper-btn" onclick="setTriggerLevel('${ab.id}',-1,1,9)" ${cost<=1?'disabled':''}>−</button>
            <span class="stepper-val">${cost} ${esc(resLabel)}</span>
            <button class="stepper-btn" onclick="setTriggerLevel('${ab.id}',1,1,9)" ${cost>=9?'disabled':''}>+</button>
          </div>
          <button class="usar-btn" onclick="useTriggerResource('${ab.id}')" ${ok?'':'disabled'} style="margin-top:0;margin-left:auto">Usar</button>
        </div>`;
      } else if (ab.pc > 0) {
        const cur = pcTracker ? (G.trackers[pcTracker.id] ?? pcTracker.max) : 0;
        const ok = cur >= ab.pc;
        h += `<div class="trig-foot">
          <span class="cost ${ok?'c-blue':'c-locked'}">${ab.pc} ${esc(resLabel)}</span>
          <button class="usar-btn" onclick="useTriggerResource('${ab.id}')" ${ok?'':'disabled'} style="margin-top:0;margin-left:auto">Usar</button>
        </div>`;
      }
    }

    h += `</div>`;
  });

  return h + `</div>`;
}

function setTriggerLevel(id, delta, min, max) {
  const cur = G.triggerSel[id] ?? min;
  G.triggerSel[id] = Math.max(min, Math.min(max, cur + delta));
  save(); render();
}
function useSmite(id, level) {
  spendSpellSlot(level);
  save(); render();
  toast(`Espacio Nv.${level} gastado`);
}
function useTriggerResource(id) {
  const ab = (char.abilities.trigger || []).find(a => a.id === id);
  if (!ab) return;
  const amount = ab.variablePC ? (G.triggerSel[id] ?? 1) : ab.pc;
  spendResource(amount);
  save(); render();
}

// ── Toggle full / short description ─────────────────
function toggleDesc(id) {
  const descEl = document.getElementById('desc-'+id);
  const linkEl = document.getElementById('more-'+id);
  if (!descEl || !linkEl) return;
  const expanded = descEl.dataset.expanded === '1';
  if (expanded) {
    descEl.textContent = SHORT_DESC[id];
    descEl.dataset.expanded = '0';
    linkEl.textContent = 'ver más ▾';
  } else {
    descEl.textContent = FULL_DESC[id];
    descEl.dataset.expanded = '1';
    linkEl.textContent = 'ver menos ▴';
  }
}

// ═══════════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════════
function useAb(id, flag, pc, once, spellLevel) {
  G[flag] = true;
  if (pc > 0) spendResource(pc);
  if (spellLevel > 0) spendSpellSlot(spellLevel);
  if (once) G.oncePerTurn[id] = true;
  save(); render();
}

function spendResource(n) {
  const t = char.trackers.find(t => RE_PC_TRACKER.test(t.label));
  if (!t) return;
  G.trackers[t.id] = Math.max(0, (G.trackers[t.id] ?? t.max) - n);
}

function spendSpellSlot(level) {
  const t = char.trackers.find(t => t.id === `sl${level}`);
  if (!t) return;
  G.trackers[t.id] = Math.max(0, (G.trackers[t.id] ?? t.max) - 1);
}

function chTracker(id, delta) {
  const t = char.trackers.find(t => t.id === id);
  if (!t) return;
  G.trackers[id] = Math.max(0, Math.min(t.max, (G.trackers[id] ?? t.max) + delta));
  save(); render();
}

function clickTDot(id, i) {
  const t = char.trackers.find(t => t.id === id);
  if (!t) return;
  const cur = G.trackers[id] ?? t.max;
  G.trackers[id] = (i === cur - 1) ? cur - 1 : Math.min(t.max, i + 1);
  save(); render();
}

// ── Hide / restore (recycle bin) ─────────────────────
function hideAbility(id) { G.hidden.abilities[id] = true; save(); render(); }
function hideTracker(id) { G.hidden.trackers[id] = true; save(); render(); }

const SEC_LABELS = { action:'Acción', bonus:'Acción adicional', reaction:'Reacción', utility:'Fuera de combate', trigger:'Mejoras y disparadores' };

function openTrash() {
  const groups = [];

  // Hidden abilities, grouped by action type
  ['action','bonus','reaction','utility','trigger'].forEach(key => {
    const items = (char.abilities[key] || []).filter(a => G.hidden.abilities[a.id]);
    if (items.length) {
      groups.push({
        label: SEC_LABELS[key],
        rows: items.map(a => ({
          name: a.name,
          fn: `restoreAbility('${a.id}')`
        }))
      });
    }
  });

  // Hidden trackers
  const hiddenTr = char.trackers.filter(t => G.hidden.trackers[t.id]);
  if (hiddenTr.length) {
    groups.push({
      label: 'Recursos',
      rows: hiddenTr.map(t => ({
        name: t.label,
        fn: `restoreTracker('${t.id}')`
      }))
    });
  }

  let body = '';
  if (!groups.length) {
    body = `<div class="modal-empty">No hay elementos ocultos</div>`;
  } else {
    groups.forEach(g => {
      body += `<div class="trash-group">${esc(g.label)}</div>`;
      g.rows.forEach(r => {
        body += `<div class="trash-item">
          <span class="trash-name">${esc(r.name)}</span>
          <button class="trash-restore" onclick="${r.fn}">Restaurar</button>
        </div>`;
      });
    });
  }

  document.getElementById('trash-modal').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeTrash()">
      <div class="modal-sheet">
        <div class="modal-head">
          <span class="modal-title">🗑 Elementos ocultos</span>
          <button class="modal-close" onclick="closeTrash()">✕</button>
        </div>
        <div class="modal-body">${body}</div>
        ${groups.length ? `<div class="modal-foot">
          <button class="footer-btn" onclick="restoreAllFromTrash()">↺ Restaurar todo</button>
        </div>` : ''}
      </div>
    </div>`;
}

function closeTrash() {
  document.getElementById('trash-modal').innerHTML = '';
}

function restoreAbility(id) {
  delete G.hidden.abilities[id];
  save(); render(); openTrash();
}
function restoreTracker(id) {
  delete G.hidden.trackers[id];
  save(); render(); openTrash();
}
function restoreAllFromTrash() {
  G.hidden = { abilities:{}, trackers:{} };
  save(); render(); closeTrash();
}

function chHP(d) {
  G.hp = Math.min(char.hpMax, Math.max(0, (G.hp ?? char.hpCur) + d));
  save(); render();
}

// ── HP Calculator ────────────────────────────────────
function toggleCalc() {
  calcOpen = !calcOpen;
  if (!calcOpen) calcExpr = '';
  render();
}
function calcKey(k) {
  calcExpr += k;
  updateCalcDisplay();
}
function calcBackspace() {
  calcExpr = calcExpr.slice(0, -1);
  updateCalcDisplay();
}
function calcClear() {
  calcExpr = '';
  updateCalcDisplay();
}
function calcRoll(die) {
  const r = 1 + Math.floor(Math.random() * die);
  if (calcExpr && !/[+\-*/(]\s*$/.test(calcExpr)) calcExpr += '+';
  calcExpr += r;
  updateCalcDisplay();
  toast(`d${die} → ${r}`);
}
function updateCalcDisplay() {
  const el = document.querySelector('.calc-display');
  if (!el) return;
  el.textContent = calcExpr || '0';
  el.classList.toggle('empty', calcExpr.length === 0);
}
function calcEvalValue() {
  if (!calcExpr) return null;
  if (!/^[0-9+\-*/(). ]+$/.test(calcExpr)) return null;
  try {
    const v = Function('"use strict";return (' + calcExpr + ')')();
    return Number.isFinite(v) ? Math.round(v) : null;
  } catch(e) { return null; }
}
function calcApply(mode) {
  const v = calcEvalValue();
  if (v === null || v === 0) { toast('Ingresa un valor'); return; }
  const hp = G.hp ?? char.hpCur;
  const tempHp = G.tempHp || 0;
  const amount = Math.abs(v);

  if (mode === 'heal') {
    G.hp = Math.min(char.hpMax, hp + amount);
    toast(`+${amount} PG curados`);
  } else if (mode === 'temp') {
    G.tempHp = Math.max(tempHp, amount);
    toast(`PG temporales: ${G.tempHp}`);
  } else if (mode === 'damage') {
    let remaining = amount;
    if (tempHp > 0) {
      const absorbed = Math.min(tempHp, remaining);
      G.tempHp = tempHp - absorbed;
      remaining -= absorbed;
    }
    G.hp = Math.max(0, hp - remaining);
    toast(`−${amount} daño`);
  }
  calcExpr = '';
  save(); render();
}

function addRound(d) {
  G.round = Math.max(1, G.round + d);
  document.getElementById('hdr-round').textContent = G.round;
  save();
}

function finTurn() {
  G.actionUsed = G.bonusUsed = G.reactionUsed = false;
  G.oncePerTurn = {};
  save(); render();
}

function shortRest() {
  char.trackers.forEach(t => { if (t.resetType === 1) G.trackers[t.id] = t.max; });
  finTurn(); toast('Descanso corto — recursos recuperados');
}

function longRest() {
  char.trackers.forEach(t => { G.trackers[t.id] = t.max; });
  G.hp = char.hpMax; G.tempHp = 0; G.round = 1;
  finTurn(); toast('Descanso largo — todo recuperado');
}

// ═══════════════════════════════════════════════════
//  PERSISTENCE
// ═══════════════════════════════════════════════════
function save() {
  try { localStorage.setItem('g', JSON.stringify(G));
    if (char) localStorage.setItem('ch', JSON.stringify(char)); } catch(e) {}
}

function loadSaved() {
  try {
    const ch = localStorage.getItem('ch'), g = localStorage.getItem('g');
    if (ch) {
      char = JSON.parse(ch);
      if (g) {
        const saved = JSON.parse(g);
        Object.assign(G, saved);
        if (!G.hidden) G.hidden = { abilities:{}, trackers:{} };
        if (!G.hidden.abilities) G.hidden.abilities = {};
        if (!G.hidden.trackers) G.hidden.trackers = {};
        if (!G.collapsed) G.collapsed = {};
        if (!G.triggerSel) G.triggerSel = {};
        if (!G.castLevel) G.castLevel = {};
      }
      return true;
    }
  } catch(e) {}
  return false;
}

// ═══════════════════════════════════════════════════
//  IMPORT
// ═══════════════════════════════════════════════════
function importXML(xmlText) {
  try {
    char = parseFC5eXML(xmlText);
    G = { round:1, hp:char.hpCur, tempHp:0, actionUsed:false, bonusUsed:false,
          reactionUsed:false, oncePerTurn:{}, trackers:{}, showUtility:false,
          collapsed:{}, triggerSel:{}, castLevel:{},
          hidden:{ abilities:{}, trackers:{} } };
    char.trackers.forEach(t => { G.trackers[t.id] = t.max; });
    save();
    document.getElementById('screen-import').style.display  = 'none';
    document.getElementById('screen-tracker').style.display = 'flex';
    render();
    toast(`${char.name} cargado`);
  } catch(e) { alert('Error al leer el XML: ' + e.message); }
}

document.getElementById('file-input').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => importXML(ev.target.result);
  r.onerror = () => alert('No se pudo leer el archivo');
  r.readAsText(f, 'UTF-8');
  e.target.value = '';
});

// ═══════════════════════════════════════════════════
//  SHARE TARGET
// ═══════════════════════════════════════════════════
async function checkShareTarget() {
  if (!location.search.includes('from-share')) return false;
  history.replaceState({}, '', location.pathname);
  try {
    const cache = await caches.open('share-v1');
    const res   = await cache.match('pending');
    if (res) { const tx = await res.text(); await cache.delete('pending'); importXML(tx); return true; }
  } catch(e) {}
  return false;
}

// ═══════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════
let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400);
}

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

(async function init() {
  if (loadSaved()) {
    document.getElementById('screen-tracker').style.display = 'flex';
    render(); return;
  }
  if (await checkShareTarget()) return;
  document.getElementById('screen-import').style.display = 'flex';
})();
</script>
</body>
