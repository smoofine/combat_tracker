<button id="update-pill" class="update-pill" onclick="showUpdateBanner()" title="Hay una actualización pendiente">🔄</button>

<script>
// ═══════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════
const $  = (el, sel) => el?.querySelector(sel)?.textContent?.trim() ?? '';
const $$ = (el, sel) => [...(el?.querySelectorAll(sel) ?? [])];
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ═══════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════
let char = null;
let G = freshG(); // ver definición de freshG() en la sección PERSISTENCE
let activeCharId = null; // id (IndexedDB) del personaje actualmente cargado

// XML crudo del personaje activo — se cachea en memoria para poder
// reparsear con parseFC5eXML(xmlText, G.equipped) cada vez que se
// equipa/desequipa un ítem (ver toggleItemEquipped/reparseChar). Se
// persiste junto con G en el registro IndexedDB del personaje (ver
// sección PERSISTENCE) para poder guardar varios personajes en paralelo.
let lastXmlText = null;

// Maps populated on each render(), used by toggleDesc()
let SHORT_DESC = {};
let FULL_DESC  = {};
// id de habilidad -> objeto habilidad completo (name/source/itemId/spellLevel…),
// repoblado en cada render() — permite que el long-press abra el editor
// correcto sin tener que meter texto arbitrario (nombres con comillas,
// etc.) dentro de un atributo HTML inline. Ver §3.10.
let ABILITY_INDEX = {};
// Populated fresh by renderSuggestions(); maps combo-button index -> steps
let SUGGESTION_COMBOS = [];

// HP calculator (not persisted — resets each session)
let calcOpen = false;
let calcExpr = '';

// ═══════════════════════════════════════════════════
//  XML PARSER
// ═══════════════════════════════════════════════════
const WEAPON_TYPES = new Set([5, 6]); // 5 = melee weapon, 6 = ranged weapon
const FINESSE_BIT  = 2;
const ABILITY_KEYS = ['str','dex','con','int','wis','cha'];
const ABILITY_ES   = ['FUE','DES','CON','INT','SAB','CAR'];
// ═══════════════════════════════════════════════════
//  RESOURCE-POOL REGISTRY
//  Cada reserva de recurso tiene su propia entrada para evitar que
//  findResTracker() tome la primera que parezca un recurso en el array
//  de trackers. Cada habilidad guarda ab.resKey en parse time y
//  findResTracker(resKey) busca solo el tracker de ese recurso específico.
// Display abbreviations match what was already shown before this fix
// (pcAbbrev used to special-case "Concentración" → "PC" literally — kept
// as-is here to avoid a gratuitous UI text change). "Canalizar Div." is
// spelled out instead of abbreviated to "CD" because that exact badge
// text is already used elsewhere for spell save DC (ab.dc) — reusing it
// here would visually collide with that badge on the same ability card.
// variableEligible: true si el pool tiene mecánica de coste variable real
// (Hechicería, Psiónicos, Dados de Superioridad). Focus y Canalizar
// Divinidad siempre cuestan 1 fijo.
const RESOURCE_TYPES = [
  { key:'sorcery',         abbrev:'PH',            textRe: /puntos? de hechicer[ií]a|sorcery points?/i,                          trackerRe: /hechicer|sorcery/i,                 variableEligible:true },
  { key:'psionic',         abbrev:'dado psi.',      textRe: /psionic energy|punto(?:s)? de psi[oó]nica/i,                          trackerRe: /psionic energy|psi[oó]nica/i,       variableEligible:true },
  { key:'superiority',     abbrev:'dado sup.',      textRe: /superiority dice?|dados? de superioridad/i,                           trackerRe: /superiority|superioridad/i,         variableEligible:true },
  { key:'focus',           abbrev:'PC',             textRe: /puntos? de (?:concentraci[oó]n|enfoque)|focus points?/i,              trackerRe: /concentraci|enfoque|focus/i,        variableEligible:false },
  { key:'channeldivinity', abbrev:'Canalizar Div.', textRe: /(?:usar|utilizar)\s+(?:tu\s+)?canalizar divinidad|use your channel divinity/i, trackerRe: /canalizar divinidad|channel divinity/i, variableEligible:false },
];

// Retorna resKey si el texto nombra un pool conocido, o null si no.
// onlyVariableEligible=true restringe a pools con coste variable real.
function detectResKey(text, onlyVariableEligible) {
  for (const r of RESOURCE_TYPES) {
    if (onlyVariableEligible && !r.variableEligible) continue;
    if (r.textRe.test(text)) return r.key;
  }
  return null;
}

// Fallback cuando detectResKey() retorna null.
const RE_PC_TRACKER_FALLBACK = /concentraci|psionic energy|puntos? de|superiority|hechicer/i;

// Retorna el tracker del pool indicado por resKey, con fallback genérico.
function findResTracker(resKey) {
  if (resKey) {
    const def = RESOURCE_TYPES.find(r => r.key === resKey);
    if (def) {
      const t = char.trackers.find(t => def.trackerRe.test(t.label));
      if (t) return t;
    }
  }
  return char.trackers.find(t => RE_PC_TRACKER_FALLBACK.test(t.label));
}

// Abreviado de recurso para el badge de coste en la tarjeta de habilidad.
function resAbbrev(resKey, fallbackLabel) {
  const def = RESOURCE_TYPES.find(r => r.key === resKey);
  if (def) return def.abbrev;
  return fallbackLabel || 'recurso';
}

// ═══════════════════════════════════════════════════
//  AC HELPERS
//  Dos mecánicas de CA que no vienen en un <mod> numérico y hay que leer
//  del texto del rasgo:
//   1) Fórmulas alternativas de CA sin armadura ("Defensa Sin Armadura",
//      "Armadura Natural", pactos/patrones homebrew, etc.) — reemplazan
//      10+DEX. Cuando un personaje tiene varias, se usa la que dé más CA.
//   2) Bonos fijos y permanentes descritos en prosa ("a +2 bonus to AC"),
//      sin <mod> asociado (p.ej. rasgos de capstone tipo "Incarnation of
//      Corruption"). Se excluyen los que son claramente condicionales o
//      temporales (transformaciones, pociones, duración limitada, acción
//      adicional, etc.): esos quedan para el sistema de efectos activables,
//      no para la CA base.
// ═══════════════════════════════════════════════════
const AC_ABILITY_WORDS = {
  str: /fuerza|strength/i,
  dex: /destreza|dexterity/i,
  con: /constituci[oó]n|constitution/i,
  int: /inteligencia|intelligence/i,
  wis: /sabidur[ií]a|wisdom/i,
  cha: /carisma|charisma/i,
};
// Ancla obligatoria: la fórmula solo se considera si el propio texto la
// condiciona a no llevar armadura (así evitamos leer fórmulas de efectos
// activables no relacionados, p.ej. "mientras estés concentrado...").
const UNARMORED_CONDITION_RE = /no\s+llev[a-z]{0,3}\s+armadura|not\s+wearing\s+(?:any\s+)?armor|wearing\s+no\s+armor|aren'?t\s+wearing\s+armor/i;
// Segunda ancla: la CA descrita debe ser la del propio personaje ("tu CA"/
// "your AC"), no la de un familiar o criatura fusionada ("the creature's AC",
// "their Armor Class") — esas fórmulas describen a otra criatura, no al PJ.
const OWN_AC_RE = /\byour\s+(?:base\s+)?(?:AC|Armor Class)\b|\btu\s+(?:clase de armadura(?:\s+base)?|CA)\b/i;

function parseUnarmoredACFormulas(feats, mods) {
  const candidates = [];
  feats.forEach(f => {
    (f.text || '').split(/(?<=[.\n])/).forEach(sentence => {
      if (!UNARMORED_CONDITION_RE.test(sentence) || !OWN_AC_RE.test(sentence)) return;
      const baseMatch = sentence.match(/\b(\d{1,2})\s*(?:\+|m[aá]s)/);
      if (!baseMatch) return;
      const base = parseInt(baseMatch[1]);
      if (base < 8 || base > 16) return;
      let total = base, found = false;
      Object.entries(AC_ABILITY_WORDS).forEach(([key, re]) => {
        if (re.test(sentence)) { total += mods[key]; found = true; }
      });
      if (found) candidates.push(total);
    });
  });
  return candidates;
}

const AC_FLAT_BONUS_RE = /\+\s*(\d{1,2})\s*(?:bonus\s+)?(?:to\s+(?:your\s+)?(?:AC|Armor Class)\b|a\s+(?:tu\s+)?(?:la\s+)?CA\b)/gi;
const AC_BONUS_CONDITIONAL_RE = /\b(while|when(?:ever)?|if you|as long as|until|for\s+\d+\s*(?:minute|hour|round|turn)s?|bonus action|reaction|transforms?|turns?\s+into|drinker|elixir|potion|activat\w*|duration|mientras|cuando|siempre que|hasta que|acci[oó]n adicional|reacci[oó]n|te transformas|poci[oó]n|elixir)\b/i;
// Rasgos que son un "menú" de beneficios seleccionables (p.ej. "elige uno de
// los siguientes al terminar un descanso") son intrínsecamente temporales
// aunque la frase puntual del bono no lo diga explícitamente — se excluye
// el rasgo completo, no solo la oración del bono.
const AC_BONUS_MENU_RE = /choose one of the following|select one of the following|pick one of the following|elige (?:uno|una) de los siguientes|elige (?:uno|una) de las siguientes/i;

// La CA que sube debe ser la del propio personaje, no la de un acompañante
// (esbirro de acero, familiar, criatura invocada, etc.).
const AC_BONUS_OTHER_CREATURE_RE = /steel defender|familiar|companion|homunculus|spectral|summoned creature|the creature|their (?:AC|Armor Class)|its (?:AC|Armor Class)/i;

function flatFeatACBonus(feats, skipFeats) {
  let total = 0;
  feats.forEach(f => {
    if (skipFeats && skipFeats.has(f)) return; // ya contabilizado vía <mod type=10> numérico — ver scanGenericMods
    const text = f.text || '';
    if (AC_BONUS_MENU_RE.test(text)) return;
    const sentences = text.split(/(?<=[.\n])/).filter(s => s.trim().length > 0);
    sentences.forEach((sentence, i) => {
      if (AC_BONUS_OTHER_CREATURE_RE.test(sentence)) return;
      // La condición ("while transformed...", "as a bonus action...") suele
      // quedar en la oración/bullet inmediatamente anterior al bono en sí.
      const ctx = (sentences[i - 1] || '') + sentence;
      if (AC_BONUS_CONDITIONAL_RE.test(ctx)) return;
      AC_FLAT_BONUS_RE.lastIndex = 0;
      let m;
      while ((m = AC_FLAT_BONUS_RE.exec(sentence))) total += parseInt(m[1]);
    });
  });
  return total;
}

function parseFC5eXML(xml, equipOverrides) {
  // Strip BOM and any leading whitespace/garbage before <?xml or <character
  xml = xml.replace(/^\uFEFF/, '').trim();
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  const perr = doc.querySelector('parsererror');
  if (perr) throw new Error('XML malformado — ' + perr.textContent.slice(0,150));

  const ch = doc.querySelector('character');
  if (!ch) throw new Error('No se encontró elemento character');

  const name   = $(ch, 'name').split('||')[0].trim();
  let hpMax    = parseInt($(ch, 'hpMax')) || 10; // ajustado más abajo con bonos type=15 (ver scanGenericMods)
  let hpCur    = parseInt($(ch, 'hpCurrent')); // si <hpCurrent> está ausente, cae a hpMax ya final (ver más abajo)

  // ── Classes (multiclass support) ───────────────────
  const classEls  = $$(ch, 'class');
  const classInfo = classEls.map(c => ({
    el:    c,
    name:  $(c, 'name'),
    level: parseInt($(c, 'level')) || 1
  }));
  const totalLevel = classInfo.reduce((s,c) => s + c.level, 0) || 1;
  const cName = classInfo.map(c => `${c.name} ${c.level}`).join(' / ');
  let prof = Math.ceil(totalLevel / 4) + 1; // ajustado más abajo con bonos type=0 (ver scanGenericMods)
  const raceName = $(ch.querySelector('race'), 'name');

  // ── Velocidad base ──────────────────────────────────────────────
  // FC5e rara vez exporta <speed> como hijo directo de <race> (solo 1 de
  // los 6 personajes de prueba lo trae) — cuando falta, se usa 30 pies
  // por defecto, con la excepción conocida de enanos/gnomos/medianos (25
  // pies por regla base de 5e), detectada por el nombre de la raza. Esto
  // es una heurística de reglas de D&D (no un dato leído del XML) — si no
  // coincide con la raza real, el bono de tipo=13 ("Velocidad", ver
  // scanGenericMods) sí se lee del XML de forma fiable y se suma encima.
  const raceSpeedEl = [...(ch.querySelector('race')?.children || [])]
    .find(c => c.tagName.toLowerCase() === 'speed');
  const explicitSpeed = raceSpeedEl ? parseInt(raceSpeedEl.textContent) || null : null;
  const SMALL_RACE_RE = /dwarf|enano|gnome|gnomo|halfling|mediano/i;
  const baseSpeed = explicitSpeed ?? (SMALL_RACE_RE.test(raceName) ? 25 : 30);

  // ── Trackers (per class, merged) ───────────────────
  let trackers = [];
  classInfo.forEach((ci, classIdx) => {
    const cls = ci.el;

    // Direct <tracker> children of <class> = the curated/selected resources
    [...cls.children].forEach((c, i) => {
      if (c.tagName.toLowerCase() !== 'tracker') return;
      const label = $(c, 'label');
      if (!label) return;
      const type      = parseInt($(c, 'type'))      || 1;
      const resetType = parseInt($(c, 'resetType')) || 0;
      const value     = $(c, 'value') !== '' ? parseInt($(c, 'value')) : null;
      const formula   = $(c, 'formula');
      const fNum      = parseInt(formula);
      const formulaIsNum = !isNaN(fNum) && String(fNum) === formula.trim();

      let max, isDice = false, diceFmt = null;
      if (type === 2 && /d/i.test(formula)) {
        isDice = true; diceFmt = formula;
        max = value ?? 0;
      } else {
        max = formulaIsNum ? fNum : (value ?? 0);
      }

      if (resetType > 0 && max > 0) {
        trackers.push({
          id:`t${classIdx}_${i}`, classIdx, label, type, resetType,
          max, current:max, isDice, diceFmt
        });
      }
    });
  });

  // De-duplicate trackers with same label (keep the one with the larger max)
  const trackerByLabel = {};
  trackers.forEach(t => {
    const key = t.label.toLowerCase();
    if (!trackerByLabel[key] || t.max > trackerByLabel[key].max) trackerByLabel[key] = t;
  });
  trackers = Object.values(trackerByLabel);

  // ── Spell slot trackers (from top-level <slots>, levels 1-9) ──
  // FC5e stores [idx0=?, lvl1, lvl2, ..., lvl9] — index 0 is not a slot level.
  // IMPORTANT: <class> elements also contain their own <slots>, so we must
  // only read the DIRECT child of <character>, not the first descendant match.
  const topSlotsEl = [...ch.children].find(c => c.tagName.toLowerCase() === 'slots');
  const slotsArr = (topSlotsEl?.textContent.trim() || '').replace(/,$/, '').split(',').map(n => parseInt(n) || 0);
  let maxSpellLevel = 0;
  for (let lvl = 1; lvl <= 9; lvl++) {
    const max = slotsArr[lvl] || 0;
    if (max > 0) {
      maxSpellLevel = lvl;
      trackers.push({
        id:`sl${lvl}`, label:`Espacios Nv.${lvl}`, type:1, resetType:2,
        max, current:max, isDice:false, diceFmt:null, isSpellSlot:true, spellLevel:lvl
      });
    }
  }

  // ── Pact Magic slots (Warlock) ──────────────────────
  // Los espacios de Pacto viven en <class><slots>/<slotsreset> (no en el
  // <slots> raíz, que es 0 para Brujos puros). Se guardan en namespace
  // propio (pactsl#) para coexistir con slots normales en multiclase.
  // pactInfoByClassIdx indica qué spells gastan del pool de Pacto.
  const pactInfoByClassIdx = {};
  classInfo.forEach((ci, classIdx) => {
    const resetEl = [...ci.el.children].find(c => c.tagName.toLowerCase() === 'slotsreset');
    const resetType = resetEl ? (parseInt(resetEl.textContent) || 2) : 0;
    if (resetType <= 0) return; // no independent recharge cycle declared — not a Pact-style pool

    const ownSlotsEl = [...ci.el.children].find(c => c.tagName.toLowerCase() === 'slots');
    const ownArr = (ownSlotsEl?.textContent.trim() || '').replace(/,$/, '').split(',').map(n => parseInt(n) || 0);
    // RAW Pact Magic only ever has ONE active slot level at a time (it's
    // replaced wholesale as the Warlock levels up), but scan for the
    // highest non-zero entry rather than assuming a fixed index, in case
    // some homebrew "spread" variant ever populates more than one.
    let level = 0, max = 0;
    for (let lvl = 1; lvl <= 9; lvl++) {
      if ((ownArr[lvl] || 0) > 0) { level = lvl; max = ownArr[lvl]; }
    }
    if (level === 0) return;

    pactInfoByClassIdx[classIdx] = { level, max, resetType };
    // Combinado en el mismo techo que slots normales. En Brujo puro es
    // correcto; en multiclase Brujo+lanzador el peor caso es un nivel
    // de upcast extra que aparece bloqueado (no hay tracker → no gasta).
    maxSpellLevel = Math.max(maxSpellLevel, level);
    trackers.push({
      id:`pactsl${level}`, label:`Espacios de Pacto Nv.${level}`, type:1, resetType,
      max, current:max, isDice:false, diceFmt:null, isSpellSlot:true, spellLevel:level, isPactMagic:true
    });
  });

  // ── Feats: direct <feat> children of <class> = curated/selected list ──
  // (autolevel dumps EVERY subclass option; direct children only contain
  //  what was actually chosen for this character)
  const allFeats = [];
  classInfo.forEach((ci, classIdx) => {
    let direct = [...ci.el.children].filter(c => c.tagName.toLowerCase() === 'feat');
    if (direct.length === 0) {
      // Fallback: very old / minimal exports — scan autolevel
      direct = $$(ci.el, 'feat');
    }
    direct.forEach(f => {
      const n = $(f,'name'), tx = $(f,'text');
      if (n.length > 1) allFeats.push({ name:n, text:tx, source:'class', classIdx, el:f, deleted: $(f,'pwaDeleted')==='1' });
    });
  });
  ['race','background'].forEach(src => {
    $$(ch.querySelector(src), 'feat').forEach(f => {
      const n = $(f,'name'), tx = $(f,'text');
      if (n.length > 1) allFeats.push({ name:n, text:tx, source:src, el:f, deleted: $(f,'pwaDeleted')==='1' });
    });
  });

  // ── Dotes a nivel de personaje (ASI): hijos DIRECTOS de <character> ──
  // Deliberadamente separadas de allFeats: allFeats alimenta el parseo de
  // CA en prosa (flatFeatACBonus/parseUnarmoredACFormulas más abajo) y
  // mezclar dotes ahí arriesgaba sumar bonos condicionales de su texto a
  // la CA base. Sí participan igual que cualquier feat en bonos de
  // característica/mods genéricos/competencias (como ya hacían antes) y
  // ahora también se muestran como habilidades propias (acción/adicional/
  // pasiva/etc.), etiquetadas source:'feat' para distinguirlas en la UI.
  const charFeats = [...ch.children]
    .filter(c => c.tagName.toLowerCase() === 'feat')
    .map(f => ({ name:$(f,'name'), text:$(f,'text'), source:'feat', el:f, deleted: $(f,'pwaDeleted')==='1' }))
    .filter(f => f.name.length > 1);

  // ── Items: metadatos + estado de equipado ──────────────────────────
  // FC5e NO tiene un booleano <equipped> — el propio <slot> es la señal:
  // solo aparece en ítems que el jugador marcó como equipados/empuñados
  // en el editor (verificado empíricamente en los 6 personajes: armas de
  // repuesto sin usar y accesorios nunca equipados no tienen <slot>, ver
  // CONTEXTO_PROYECTO.md §2.9). `equipOverrides` (si viene) es el estado
  // vivo de la sesión (G.equipped) y pisa ese default XML ítem por ítem.
  const equipOv = equipOverrides || {};
  const allItems = $$(ch, 'item').map((el, idx) => {
    const id = `item${idx}`;
    const typeStr = $(el, 'type');
    const type = typeStr === '' ? null : (parseInt(typeStr) || 0);
    const slot = parseInt($(el, 'slot')) || 0;
    const ac = parseInt($(el, 'ac')) || 0;
    const damage1H = $(el, 'damage1H');
    // Solo se quedan los <mod> de categoría "Bonus" (ausente/"0") — el
    // resto (category 1/2/3/4: puntaje/modificador de característica,
    // salvación, habilidad) ya lo lee `scanGenericMods` por separado más
    // abajo, con su propio manejo por categoría. Sin este filtro, un
    // <mod category="4"><type>10</type> (bono de habilidad #10) se leía
    // como si fuera <type>10</type> de "Bonus" (CA) porque el código de
    // más abajo (armadura/CA, CD/ataque de conjuro, ataque/daño de arma)
    // solo mira `type`, nunca `category` — confirmado con el ítem de
    // prueba de Rhyo, que infla la CA en +1 de más si no se filtra acá.
    const mods = $$(el, 'mod').filter(md => {
      const catRaw = $(md, 'category');
      return catRaw === '' || catRaw === '0';
    }).map(md => ({
      type:  parseInt($(md, 'type')) || 0,
      value: $(md, 'value') !== '' ? parseInt($(md, 'value')) : null
    }));

    const isWeapon    = type !== null && WEAPON_TYPES.has(type) && !!damage1H;
    const isBodyArmor = slot === 5 && ac > 0;
    const isShield    = type === 4;
    const isPotion    = type === 12;
    const isCurrency  = type === 15;
    const isAmmo      = type === 7;
    const isRing      = type === 11;
    const isWondrous  = type === 14;

    // Equipable: cualquier arma (se puede empuñar), cualquier ítem que
    // YA tuvo un slot asignado por FC5e, cualquier ítem con al menos un
    // <mod> (bono numérico real), o un anillo/objeto maravilloso (type
    // 11/14) — estos últimos son inherentemente "para llevar puesto"
    // aunque el jugador no le haya asignado slot todavía en FC5e.
    const equippable = isWeapon || isShield || slot > 0 || mods.length > 0 || isRing || isWondrous;
    // Ítem borrado (§3.x, ver "Borrar dote/ítem/conjuro"): se fuerza
    // equipped=false pase lo que diga equipOv/<slot>, así todas las rutas
    // de contribución mecánica que ya filtran por `equipped` (bonos de
    // característica, CA, CD/ataque de conjuro, ataques de arma) lo
    // excluyen automáticamente sin tocarlas una por una.
    const deleted = $(el, 'pwaDeleted') === '1';
    const equipped = deleted ? false : (equipOv[id] !== undefined ? !!equipOv[id] : slot > 0);

    // Mundano sin <type> (mochila, antorcha, soga...), moneda y munición
    // no generan tarjeta de habilidad — son ruido, no rasgos accionables.
    const showAsAbility = type !== null && !isCurrency && !isAmmo && (equippable || isPotion);

    let category = 'gear';
    if (isWeapon) category = 'weapon';
    else if (isBodyArmor) category = 'armor';
    else if (isShield) category = 'shield';
    else if (isPotion) category = 'potion';
    else if (isAmmo) category = 'ammo';
    else if (isCurrency) category = 'currency';
    else if (isRing) category = 'ring';
    else if (isWondrous) category = 'wondrous';

    return {
      id, el, name: $(el,'name'), text: $(el,'text'), type, slot, ac, mods,
      damage1H, damage2H: $(el,'damage2H'), weaponProperty: parseInt($(el,'weaponProperty'))||0,
      magic: $(el,'magic') === '1', quantity: $(el,'quantity'), value: $(el,'value'), weight: $(el,'weight'),
      isWeapon, isBodyArmor, isShield, isPotion, isCurrency, isAmmo, isRing, isWondrous,
      equippable, equipped, showAsAbility, category, deleted
    };
  });
  const itemFeats = [];
  const weapons   = [];
  let spellDcBonus = 0, spellAtkBonus = 0;

  // ── Ability scores: base + bonos raciales/ASI/dotes/ítems ─────────
  // <abilities> en el XML son los valores BASE, antes de bonos raciales,
  // mejoras de característica (ASI) y objetos mágicos. Esos bonos llegan
  // como <mod category="1" type="N" value="V"> (N: 0=FUE,1=DES,2=CON,3=INT,
  // 4=SAB,5=CAR — <type> ausente equivale a 0/FUE) como hijos DIRECTOS de
  // <race>, <class> (p.ej. Ability Score Improvement), de cada <feat>
  // seleccionado (clase/raza/trasfondo/nivel de personaje) y de ítems
  // equipados (p.ej. un Cinturón de Fuerza de Gigante). <autolevel> es una
  // plantilla con TODA la tabla de progresión de la clase — incluye rasgos
  // de niveles no alcanzados (p.ej. un capstone de nivel 20 en un personaje
  // de nivel 10) — por eso sus mods NO se suman aquí; solo se leen mods
  // directos de los elementos ya curados arriba (allFeats, classEls, etc.).
  const directMods = el => el ? [...el.children].filter(c => c.tagName.toLowerCase() === 'mod') : [];
  const abilityBonus = [0, 0, 0, 0, 0, 0];
  // Traza de origen por característica — alimenta el desglose que muestra
  // el editor de puntuaciones (§3.9): qué aporta cada bono al total.
  const abilityBonusBreakdown = [[], [], [], [], [], []];
  const addAbilityBonus = (el, sourceLabel) => directMods(el).forEach(md => {
    if ($(md, 'category') !== '1') return;
    const idx = parseInt($(md, 'type')) || 0;
    const val = parseInt($(md, 'value')) || 0;
    if (idx >= 0 && idx <= 5 && val !== 0) {
      abilityBonus[idx] += val;
      abilityBonusBreakdown[idx].push({ source: sourceLabel, value: val });
    }
  });
  addAbilityBonus(ch.querySelector('race'), raceName || 'raza');
  addAbilityBonus(ch.querySelector('background'), 'trasfondo');
  classEls.forEach(c => addAbilityBonus(c, $(c, 'name') || 'clase'));
  allFeats.filter(f => !f.deleted).forEach(f => addAbilityBonus(f.el, f.name));
  charFeats.filter(f => !f.deleted).forEach(f => addAbilityBonus(f.el, f.name)); // dotes a nivel de personaje
  allItems.forEach(it => { if (it.equipped) addAbilityBonus(it.el, it.name); });

  // ── Modifiers genéricos de FC5e (bonos más allá de puntuación de
  // característica) — ver CONTEXTO_PROYECTO.md §2.8 para el mapeo
  // empírico completo verificado contra los 6 personajes de prueba.
  // <category> ausente/"0" = "Bonus" (subtipo numérico en <type>);
  // 3 = Tirada de Salvación (<type>=0-5, ábaco FUE..CAR); 4 = Habilidad
  // (<type>=0-17, +100 = id absoluto de SKILL_LIST). <category>=1 ya se
  // trató arriba (puntuación de característica).
  // <category>=2 ("Modificador de Característica") SÍ se auto-aplica —
  // confirmado con el ítem de prueba "Prueba De Modificadores" de Rhyo,
  // con valores esperados para las 6 características provistos por el
  // usuario: es un bono directo al MODIFICADOR ya calculado (no al
  // puntaje — eso es category=1), acumulable con category=1. Se aplica
  // sumándolo a `mods[ability]` justo después de calcular los
  // modificadores base (ver `abilityModBonus`/`abilityModProfFlag` más
  // abajo), así llega en cascada a habilidades, salvaciones, iniciativa,
  // CD/ataque de conjuro y ataques. Sin `<value>` (visto en Inteligencia
  // del ítem de prueba) significa "sumar el bonificador de competencia
  // actual" en vez de un número fijo. El caso que originalmente hizo
  // pensar que esta categoría NO debía auto-aplicarse (Brazos del Yo
  // Astral de Rhyo, con `category=2` a mano como workaround del usuario
  // en FC5e) era un malentendido — ver CONTEXTO_PROYECTO.md §2.8.
  //
  // Subtipos de "Bonus" (categoría 0): son exactamente 16, <type>=0-15,
  // todos confirmados — 12 con datos reales/ítems de prueba dedicados
  // (el usuario creó un ítem o rasgo por separado para cada uno de los 4
  // que faltaban: Hit Points, Saving Throws, Initiative, Passive Wisdom,
  // Unarmored Armor Class — ver CONTEXTO_PROYECTO.md §2.8 para el mapeo
  // completo). type=16/17 NO son de esta categoría — son `category=4`
  // (Habilidad), donde 0-17 identifica CUÁL habilidad, no un subtipo de
  // bono.
  //   9  Hit Points              → se suma a hpMax (`hpBonusFlat`)
  //   11 Saving Throws           → bono plano a las 6 salvaciones
  //                                (`savesBonusFlat`, distinto del bono
  //                                por salvación individual de category=3)
  //   12 Initiative              → `initiativeBonusFlat`
  //   14 Passive Wisdom          → `passiveWisdomBonusFlat`
  //   15 Unarmored Armor Class   → `unarmoredACBonusFlat`, solo se suma
  //                                si el personaje termina usando una
  //                                fórmula de CA sin armadura (ver
  //                                cálculo de CA) — NO es Hit Points,
  //                                pese a que una lectura anterior de
  //                                este documento asumió eso a partir de
  //                                Draconic Resilience (el `<mod>` de esa
  //                                dote resultó ser la parte de CA de
  //                                "13 + tu modificador de Destreza", no
  //                                la parte de PG del mismo rasgo).
  // `hpMax` NUNCA se suma a ciegas más allá de lo confirmado arriba —
  // sigue siendo cierto que `<hpMax>` exportado por FC5e no se
  // recalcula solo por agregar un ítem (se comprobó con Rhyo), así que
  // es la app la que tiene que sumar `type=9` dinámicamente encima de
  // esa base al equipar/desequipar, igual que ya se hacía con velocidad
  // y CA.
  //
  // Los tipos 7/8/10 en ÍTEMS siempre se leen por una ruta global aparte
  // (CD/ataque de conjuro, CA — ver más abajo), sea o no el ítem un arma.
  // Los tipos 1-6 (Weapon/Melee/Ranged Attacks/Damage) en cambio SOLO se
  // excluyen acá cuando el ítem ES un arma — ahí los toma el bono propio
  // de CADA arma dentro de buildAbilities (p.ej. "Moon Sickle +3" solo da
  // su bono a ataques hechos CON ESA arma). Si el ítem NO es un arma (un
  // anillo, objeto maravilloso, etc. con, por ejemplo, "Ranged Attacks
  // (+)"), no hay ninguna otra ruta que lo lea — tiene que sumarse acá
  // como bono global de personaje, igual que un Fighting Style de dote.
  // Bug real encontrado con el personaje de prueba "Prueba Type 15 Y
  // Otros" (tipos 4/5/6 en accesorios no-arma): antes de esto se perdían
  // en silencio porque el código asumía que TODO ítem con estos tipos
  // era un arma.
  const ITEM_GLOBAL_TYPES = new Set([7, 8, 10]);
  const ITEM_WEAPON_ONLY_TYPES = new Set([1, 2, 3, 4, 5, 6]);
  const BONUS_TYPE_KEYS = {
    1:'weaponAtk', 2:'weaponDmg', 3:'meleeAtk', 4:'meleeDmg',
    5:'rangedAtk', 6:'rangedDmg', 7:'spellAtkBonus', 8:'spellDcBonus',
    10:'acBonus', 13:'speedBonus'
  };
  const bonuses = { weaponAtk:0, weaponDmg:0, meleeAtk:0, meleeDmg:0, rangedAtk:0, rangedDmg:0,
                     spellDcBonus:0, spellAtkBonus:0, acBonus:0, speedBonus:0 };
  const acModFeats = new Set();  // feats con CA vía <mod> numérico — flatFeatACBonus() los excluye para no duplicar
  const hpModsFound = [];        // type=15 detectados — se suman a hpMax (ver nota arriba) y quedan aquí solo para el log
  let profBonusFlat = 0;         // type=0 ("Bonificador por Competencia") — sube `prof` directo, ver nota arriba
  let hpBonusFlat = 0;           // type=9 ("Hit Points") — se suma a hpMax, ver nota arriba
  let savesBonusFlat = 0;        // type=11 ("Saving Throws") — bono plano a las 6 salvaciones, distinto del <category>3</category> por salvación individual
  let initiativeBonusFlat = 0;   // type=12 ("Initiative")
  let passiveWisdomBonusFlat = 0; // type=14 ("Passive Wisdom") — bono a Percepción Pasiva
  let unarmoredACBonusFlat = 0;  // type=15 ("Unarmored Armor Class") — solo aplica dentro de la rama sin armadura, ver cálculo de CA
  const abilityModBonus = [0,0,0,0,0,0];       // category=2 con <value>: bono directo al MODIFICADOR (no al puntaje) de esa característica, idx 0-5 = FUE-CAR
  const abilityModBreakdown = [[],[],[],[],[],[]]; // traza de origen de abilityModBonus, para el editor de puntuaciones (§3.9)
  const abilityModProfFlag = [false,false,false,false,false,false]; // category=2 SIN <value>: sumar el bonificador de competencia en vez de un número fijo (ver nota abajo)
  const saveMods = {};           // idx 0-5 -> { flat, profGrant }
  const skillMods = {};          // id 100-117 -> { flat, profGrant }
  const unknownMods = [];        // category/type sin mapeo confirmado — solo diagnóstico en consola
  // category=0 ("Bono") SIN <value>: en el picker propio de FC5e esto
  // ocupa el lugar del "+0" en un rango -30..+30 y significa "sumar el
  // bonificador de competencia", igual que ya interpretaba esta app para
  // las categorías 2/3/4 (confirmado empíricamente por el usuario contra
  // el ítem real "Espina" — dos <mod type=1>, uno con valor +4 y otro SIN
  // valor, y buildAbilities ya sabía sumarle prof al de arma — ver línea
  // ~2190 — pero esta ruta genérica, usada para dotes/raza/clase/
  // trasfondo, lo estaba descartando por completo). No se puede resolver
  // en el momento porque `prof` todavía no es el valor final acá — se
  // difiere y se resuelve un poco más abajo, apenas se conoce.
  const bonoCompetenciaDeferred = []; // [{ type, source }]

  // "= Modificador de [característica]" (pedido del usuario, más allá de
  // "=competencia"): FC5e no tiene ningún <mod> nativo para esto, así que
  // se codifica como una marca de texto al final de la <text> de la dote/
  // ítem — inerte si se vuelve a ver en FC5e (el usuario confirmó que le
  // sirve así), la app la interpreta como un bono más. Se arma/lee desde
  // el editor (nunca a mano) — ver marcadorParaBono()/parsearMarcadores()
  // en la sección de edición. Categoría 1 (puntuación de característica)
  // queda deliberadamente sin soporte: `scores` alimenta el cálculo de
  // `mods`, así que escalar una puntuación por OTRO modificador crearía
  // una dependencia circular (se necesitaría `mods` para resolver el
  // marcador, pero `mods` todavía no existiría). Categorías 0/2/3/4 sí,
  // porque se resuelven después de que `mods` ya es definitivo, sin
  // necesidad de retocar `scores`.
  const MARKER_RE = /\[PWA-BONUS cat=(\d+) type=(\d+) ability=(str|dex|con|int|wis|cha)\]/g;
  const markerDeferred = []; // [{ category, type, ability, source }]
  function scanTextMarkers(el, sourceLabel) {
    const text = $(el, 'text');
    if (!text) return;
    MARKER_RE.lastIndex = 0;
    let m;
    while ((m = MARKER_RE.exec(text))) {
      markerDeferred.push({ category: m[1], type: parseInt(m[2]), ability: m[3], source: sourceLabel });
    }
  }

  // Aplica un valor YA resuelto (número concreto) de categoría Bono al
  // acumulador que le corresponde según su type — compartida entre la
  // aplicación inmediata (mods con <value> real) y la diferida (mods sin
  // valor, una vez se conoce `prof`, y los marcadores de texto "=
  // Modificador de X", una vez se conocen `mods` — ver más abajo).
  function applyBonoValue(type, val, sourceLabel, featRef) {
    if (type === 9)  { hpBonusFlat += val; hpModsFound.push({ value: val, source: sourceLabel }); return; }
    if (type === 0)  { profBonusFlat += val; return; } // bono directo al bonificador de competencia
    if (type === 11) { savesBonusFlat += val; return; } // bono plano a TODAS las salvaciones (a diferencia de category=3, que es por salvación)
    if (type === 12) { initiativeBonusFlat += val; return; }
    if (type === 14) { passiveWisdomBonusFlat += val; return; }
    if (type === 15) { unarmoredACBonusFlat += val; return; } // solo se aplica si el personaje termina usando una fórmula de CA sin armadura, ver cálculo de CA
    const key = BONUS_TYPE_KEYS[type];
    if (key) {
      bonuses[key] += val;
      if (type === 10 && featRef) acModFeats.add(featRef);
    } else {
      unknownMods.push({ category:'bonus', type, value:val, source:sourceLabel });
    }
  }

  function scanGenericMods(el, sourceLabel, isItem, featRef, isWeaponItem) {
    directMods(el).forEach(md => {
      const catRaw = $(md, 'category');
      const type = parseInt($(md, 'type')) || 0;
      const hasValue = $(md, 'value') !== '';
      const val = hasValue ? (parseInt($(md, 'value')) || 0) : null;

      if (catRaw === '' || catRaw === '0') {
        if (isItem && ITEM_GLOBAL_TYPES.has(type)) return; // ya cubierto por otra ruta global (CD/ataque de conjuro, CA)
        if (isItem && isWeaponItem && ITEM_WEAPON_ONLY_TYPES.has(type)) return; // ya cubierto por el bono propio del arma (ver buildAbilities)
        if (val === null) {
          if (type === 0) return; // la competencia no puede sumarse a sí misma
          bonoCompetenciaDeferred.push({ type, source: sourceLabel });
          return;
        }
        applyBonoValue(type, val, sourceLabel, featRef);
      } else if (catRaw === '3') {
        if (type >= 0 && type <= 5) {
          saveMods[type] = saveMods[type] || { flat:0, profGrant:false };
          if (val === null) saveMods[type].profGrant = true; else saveMods[type].flat += val;
        }
      } else if (catRaw === '4') {
        if (type >= 0 && type <= 17) {
          const skillId = 100 + type;
          skillMods[skillId] = skillMods[skillId] || { flat:0, profGrant:false };
          if (val === null) skillMods[skillId].profGrant = true; else skillMods[skillId].flat += val;
        }
      } else if (catRaw === '2') {
        // Bono directo al MODIFICADOR de característica (no al puntaje —
        // eso es category=1). Confirmado con el ítem de prueba de Rhyo
        // "Prueba De Modificadores": category=2 sin <value> (visto en
        // Inteligencia) suma el bonificador de competencia en vez de un
        // número fijo — mismo patrón "sin valor = comportamiento especial"
        // que profGrant en categorías 3/4, pero acá el "especial" es
        // "sumar prof" en vez de "otorgar competencia".
        if (type >= 0 && type <= 5) {
          if (val === null) {
            abilityModProfFlag[type] = true;
            abilityModBreakdown[type].push({ source: sourceLabel, value: null, prof: true }); // se resuelve tras calcular `prof` final
          } else {
            abilityModBonus[type] += val;
            abilityModBreakdown[type].push({ source: sourceLabel, value: val });
          }
        }
      } else if (catRaw !== '1') {
        unknownMods.push({ category:catRaw, type, value:val, source:sourceLabel });
      }
    });
  }

  scanGenericMods(ch.querySelector('race'), 'raza');
  scanGenericMods(ch.querySelector('background'), 'trasfondo');
  classEls.forEach(c => scanGenericMods(c, `clase (${$(c,'name')})`));
  allFeats.filter(f => !f.deleted).forEach(f => { scanGenericMods(f.el, f.name, false, f); scanTextMarkers(f.el, f.name); });
  charFeats.filter(f => !f.deleted).forEach(f => { scanGenericMods(f.el, f.name || 'dote de personaje'); scanTextMarkers(f.el, f.name || 'dote de personaje'); });
  allItems.forEach(it => { if (it.equipped) { scanGenericMods(it.el, it.name || 'ítem', true, null, it.isWeapon); scanTextMarkers(it.el, it.name || 'ítem'); } });

  // Aplicar el bono directo al bonificador de competencia (type=0, p.ej.
  // "Toque De Dorsaria" de Bo) ANTES de calcular habilidades/salvaciones/
  // CD de conjuro/ataques más abajo, para que se refleje en cascada en
  // todo lo que usa `prof` — no solo en un subconjunto.
  prof += profBonusFlat;
  // Mods de categoría Bono sin valor (ver bonoCompetenciaDeferred más
  // arriba) — se resuelven ACÁ, antes de que hpMax consuma hpBonusFlat
  // (dos líneas más abajo): un mod type=9 ("Hit Points") sin valor tiene
  // que sumarse a hpBonusFlat ANTES de esa suma, o llega tarde y se pierde
  // en silencio (justo el bug que se estaba arreglando).
  bonoCompetenciaDeferred.forEach(({ type, source }) => applyBonoValue(type, prof, source));
  const hpMaxBase = hpMax; // antes del bono type=9 — lo que se edita en el editor de HP (§3.9)
  hpMax += hpBonusFlat;
  if (Number.isNaN(hpCur)) hpCur = hpMax; // <hpCurrent> ausente en el XML

  // category=2 sin <value> ("sumar competencia" en vez de un número fijo)
  // se resuelve recién acá porque necesita el `prof` YA final (con su
  // propio bono type=0 incluido, si lo hubiera). Se completa también el
  // desglose (abilityModBreakdown) con el número ya resuelto.
  abilityModProfFlag.forEach((flag, i) => { if (flag) abilityModBonus[i] += prof; });
  abilityModBreakdown.forEach(entries => entries.forEach(e => { if (e.prof) e.value = prof; }));

  if (unknownMods.length) {
    console.warn(`[FC5e] Modifiers sin mapeo confirmado en "${name}" — revisar empíricamente:`, unknownMods);
  }
  if (hpModsFound.length) {
    console.info(`[FC5e] Bonos de PG (type=9, "Hit Points") detectados en "${name}" y sumados a hpMax:`, hpModsFound);
  }

  // ── Movimiento disponible en el turno ────────────────────────────
  // Se expone como un tracker más (misma UI que "Imponer las Manos"),
  // para poder ir descontando pies gastados durante el turno. Se
  // reabastece a `speed` en cada turno nuevo — ver resetTurnState().
  const speed = baseSpeed + bonuses.speedBonus;
  trackers.push({
    id:'movement', label:'Movimiento', type:1, resetType:0,
    max: speed, current: speed, isDice:false, diceFmt:null, isPool:true
  });

  const baseScores = $(ch, 'abilities').replace(/,$/, '').split(',').map(Number);
  const scores = baseScores.map((s, i) => s + abilityBonus[i]);
  const [str, dex, con, int_, wis, cha] = scores;
  const m = s => Math.floor((s - 10) / 2);
  const mods = { str:m(str), dex:m(dex), con:m(con), int:m(int_), wis:m(wis), cha:m(cha) };
  ABILITY_KEYS.forEach((k, i) => { mods[k] += abilityModBonus[i]; });

  // Resolver los marcadores "= Modificador de X" (ver scanTextMarkers más
  // arriba) — recién acá porque necesitan `mods` ya definitivo. type=9
  // (Puntos de golpe) es un caso especial: hpMax ya consumió hpBonusFlat
  // mucho más arriba, así que se suma directo a hpMax en vez de a
  // hpBonusFlat (si no, llegaría tarde y se perdería en silencio).
  // type=13 (Velocidad) NO está soportado por el mismo motivo pero sin
  // una variable simple a la que sumarle tarde (`speed` ya se usó para
  // armar el tracker de movimiento) — el editor no ofrece esa combinación.
  markerDeferred.forEach(({ category, type, ability, source }) => {
    const val = mods[ability];
    const label = `${source} (=Mod.${ABILITY_ABBR_ES[ability]})`;
    if (category === '0') {
      if (type === 9) { hpMax += val; hpModsFound.push({ value: val, source: label }); return; }
      applyBonoValue(type, val, label);
    } else if (category === '2' && type >= 0 && type <= 5) {
      mods[ABILITY_KEYS[type]] += val;
      abilityModBreakdown[type].push({ source: label, value: val });
    } else if (category === '3' && type >= 0 && type <= 5) {
      saveMods[type] = saveMods[type] || { flat:0, profGrant:false };
      saveMods[type].flat += val;
    } else if (category === '4' && type >= 0 && type <= 17) {
      const skillId = 100 + type;
      skillMods[skillId] = skillMods[skillId] || { flat:0, profGrant:false };
      skillMods[skillId].flat += val;
    }
  });
  // Desglose por característica para el editor de puntuaciones (§3.9): de
  // dónde sale cada número, no solo el total ya sumado.
  const scoreBreakdown = ABILITY_KEYS.map((k, i) => ({
    base: baseScores[i], bonuses: abilityBonusBreakdown[i], score: scores[i],
    modBonuses: abilityModBreakdown[i], mod: mods[k]
  }));

  // ── Skill proficiencies ────────────────────────────────────────────
  // FC5e codifica las competencias de habilidad como <proficiency>N</proficiency>
  // (hijo directo de <race>/<background>/<class>/dote seleccionada), con
  // N=100..117 en orden alfabético estándar del PHB. Mapeo verificado
  // cruzando 3 personajes de prueba contra sus competencias reales en FC5e.
  // <autolevel> queda excluido (mismo criterio que ability scores) para no
  // contar dotes/rasgos de niveles no alcanzados.
  const SKILL_LIST = [
    { id:100, key:'acrobatics',     label:'Acrobacias',         ability:'dex' },
    { id:101, key:'animalHandling', label:'Trato con Animales', ability:'wis' },
    { id:102, key:'arcana',         label:'Arcanos',            ability:'int' },
    { id:103, key:'athletics',      label:'Atletismo',          ability:'str' },
    { id:104, key:'deception',      label:'Engaño',             ability:'cha' },
    { id:105, key:'history',        label:'Historia',           ability:'int' },
    { id:106, key:'insight',        label:'Perspicacia',        ability:'wis' },
    { id:107, key:'intimidation',   label:'Intimidación',       ability:'cha' },
    { id:108, key:'investigation',  label:'Investigación',      ability:'int' },
    { id:109, key:'medicine',       label:'Medicina',           ability:'wis' },
    { id:110, key:'nature',         label:'Naturaleza',         ability:'int' },
    { id:111, key:'perception',     label:'Percepción',         ability:'wis' },
    { id:112, key:'performance',    label:'Interpretación',     ability:'cha' },
    { id:113, key:'persuasion',     label:'Persuasión',         ability:'cha' },
    { id:114, key:'religion',       label:'Religión',           ability:'int' },
    { id:115, key:'sleightOfHand',  label:'Juego de Manos',     ability:'dex' },
    { id:116, key:'stealth',        label:'Sigilo',             ability:'dex' },
    { id:117, key:'survival',       label:'Supervivencia',      ability:'wis' },
  ];
  const directProfs = el => el
    ? [...el.children].filter(c => c.tagName.toLowerCase() === 'proficiency').map(c => parseInt(c.textContent))
    : [];
  const profSources = [
    ch.querySelector('race'), ch.querySelector('background'), ...classEls,
    ...charFeats.filter(f => !f.deleted).map(f => f.el),
    ...allFeats.filter(f => !f.deleted).map(f => f.el)
  ];
  const profIds = new Set();
  profSources.forEach(el => directProfs(el).forEach(id => profIds.add(id)));

  const skills = SKILL_LIST.map(s => {
    const sm = skillMods[s.id];
    const proficient = profIds.has(s.id) || !!(sm && sm.profGrant);
    const flatBonus = sm ? sm.flat : 0;
    return {
      ...s,
      proficient,
      mod: mods[s.ability] + (proficient ? prof : 0) + flatBonus
    };
  });

  // ── Saving throw proficiencies ───────────────────────────────────
  // FC5e codifica las competencias de salvación como <proficiency>N</proficiency>
  // con N=0..5 en orden estándar D&D 5e: 0=FUE, 1=DES, 2=CON, 3=INT, 4=SAB, 5=CAR
  const SAVE_LIST = [
    { id:0, key:'str', label:'Fuerza', ability:'str' },
    { id:1, key:'dex', label:'Destreza', ability:'dex' },
    { id:2, key:'con', label:'Constitución', ability:'con' },
    { id:3, key:'int', label:'Inteligencia', ability:'int' },
    { id:4, key:'wis', label:'Sabiduría', ability:'wis' },
    { id:5, key:'cha', label:'Carisma', ability:'cha' },
  ];
  const saveProfIds = new Set();
  profSources.forEach(el => directProfs(el).forEach(id => {
    if (id >= 0 && id <= 5) saveProfIds.add(id);
  }));
  Object.entries(saveMods).forEach(([idx, sm]) => { if (sm.profGrant) saveProfIds.add(parseInt(idx)); });

  const saves = SAVE_LIST.map(s => {
    const sm = saveMods[s.id];
    const proficient = saveProfIds.has(s.id);
    const flatBonus = (sm ? sm.flat : 0) + savesBonusFlat;
    return {
      ...s,
      proficient,
      mod: mods[s.ability] + (proficient ? prof : 0) + flatBonus
    };
  });

  // ── Armor Class calculation ──────────────────────────────────────
  // isBodyArmor(slot=5+ac>0) / isShield(type=4) — ver clasificación de
  // allItems más arriba (type=4 confirmado empíricamente por el usuario
  // contra el menú real de FC5e — antes de esto se confundía con
  // Objeto Maravilloso, que también usa type=14, y un escudo real no
  // sumaba su CA). mod type=10 = bonus mágico de CA y puede venir
  // de CUALQUIER ítem equipado (armadura, accesorio, o incluso un arma con
  // una propiedad tipo "Protector" — p.ej. un arma consciente que otorga
  // CA a quien la empuña). Solo cuentan los ítems actualmente equipados.
  // Tipos de armadura: 1=ligera(+DEX), 2=media(+DEX máx 2), 3=pesada(sin DEX).
  let armorBaseAC = 0, armorType = 0, armorMagicBonus = 0;
  let shieldAC = 0, flatItemACBonus = 0;
  let hasBodyArmor = false;
  allItems.forEach(it => {
    if (!it.equipped) return;

    if (it.isBodyArmor) {
      armorBaseAC = it.ac; armorType = it.type; hasBodyArmor = true;
      it.mods.forEach(md => { if (md.type === 10 && md.value > 0) armorMagicBonus += md.value; });
    } else if (it.isShield) {
      // Se usa <ac> directamente — su mod10 sería redundante (mismo valor)
      shieldAC = Math.max(shieldAC, it.ac);
    } else {
      // Cualquier otro ítem equipado (accesorio, arma, etc.): solo su(s)
      // mod type=10 aportan a la CA.
      it.mods.forEach(md => { if (md.type === 10 && md.value > 0) flatItemACBonus += md.value; });
    }
  });

  const dexMod = mods.dex;
  let computedAC = 0;
  if (hasBodyArmor) {
    computedAC = armorBaseAC + armorMagicBonus;
    if (armorType === 1) computedAC += dexMod;                  // Ligera: DEX completo
    else if (armorType === 2) computedAC += Math.min(dexMod, 2); // Media: DEX máx +2
    // Pesada (tipo 3): sin bono de DEX
  } else {
    // Fórmulas alternativas de CA sin armadura (Defensa Sin Armadura del
    // monje, Armadura Natural racial, pactos/patrones homebrew, etc.). Si
    // hay varias disponibles, se usa la que dé más CA. `unarmoredACBonusFlat`
    // (type=15, "Unarmored Armor Class" en el menú de FC5e) se suma encima
    // de la que gane — solo en esta rama, nunca si el personaje termina
    // usando una armadura física (confirmado con el rasgo de prueba
    // "Habilita unarmored defense (dexterity)" del personaje de nivel 1).
    computedAC = Math.max(10 + dexMod, ...parseUnarmoredACFormulas(allFeats.filter(f => !f.deleted), mods)) + unarmoredACBonusFlat;
  }
  computedAC += shieldAC + flatItemACBonus + flatFeatACBonus(allFeats.filter(f => !f.deleted), acModFeats) + bonuses.acBonus;

  allItems.forEach(it => {
    // Bonos globales de conjuro (CD/ataque de conjuro) — solo si el ítem
    // está equipado (type 7 = Spell Save DC, type 8 = Spell Attack).
    if (it.equipped) {
      it.mods.forEach(md => {
        if (md.type === 7) spellAtkBonus += md.value || 0;
        if (md.type === 8) spellDcBonus  += md.value || 0;
      });
    }

    if (it.isWeapon) {
      // Se agregan TODAS las armas (equipadas o no): su índice en este
      // array determina el id `w{idx}` que les asigna buildAbilities, y
      // ese id debe ser ESTABLE ante toggles de equipar/desequipar (ver
      // §2.9 — de lo contrario G.hidden.abilities/oncePerTurn quedarían
      // desincronizados). buildAbilities omite las no equipadas por su
      // cuenta usando el flag `equipped` de abajo.
      weapons.push({
        name: it.name, type: it.type, damage1H: it.damage1H, damage2H: it.damage2H,
        weaponProperty: it.weaponProperty, mods: it.mods, equipped: it.equipped, itemId: it.id, deleted: it.deleted
      });
    } else if (it.showAsAbility && it.name && it.text) {
      // Mismo motivo: siempre se agrega, buildAbilities decide visibilidad
      // según `equipped` (alwaysActive:true para pociones — no se "equipan").
      itemFeats.push({ name: it.name, text: it.text, source:'item', equipped: it.equipped, alwaysActive: it.isPotion, itemId: it.id, deleted: it.deleted });
    }
  });

  // Bonos de CD/ataque de conjuro de raza/clase/trasfondo/dotes (los de
  // ítems ya se sumaron arriba) — ver scanGenericMods.
  spellDcBonus  += bonuses.spellDcBonus;
  spellAtkBonus += bonuses.spellAtkBonus;

  // ── Spells: direct <spell> children of each <class> ─────────────
  const spellEntries = [];
  const spellDC = {}; // abilityIdx -> { dc, atk }
  classInfo.forEach((ci, classIdx) => {
    const direct = [...ci.el.children].filter(c => c.tagName.toLowerCase() === 'spell');
    if (!direct.length) return;

    const saIdx = parseInt($(ci.el, 'spellAbility'));
    let abilityIdx = (saIdx >= 0 && saIdx <= 5) ? saIdx : null;

    if (abilityIdx !== null && !spellDC[abilityIdx]) {
      const abMod = mods[ABILITY_KEYS[abilityIdx]];
      spellDC[abilityIdx] = {
        dc:  8 + prof + abMod + spellDcBonus,
        atk: prof + abMod + spellAtkBonus
      };
    }

    const pactLevel = pactInfoByClassIdx[classIdx]?.level || null;

    direct.forEach((s, i) => {
      const sName = $(s,'name'), sText = $(s,'text');
      if (!sName || !sText) return;
      spellEntries.push({
        id:`sp${classIdx}_${i}`,
        name: sName.trim(),
        text: sText,
        level: parseInt($(s,'level')) || 0,
        time: $(s,'time'),
        range: $(s,'range'),
        duration: $(s,'duration'),
        ritual: $(s,'ritual') === '1',
        rolls: $$(s,'roll').map(r => r.textContent.trim()).filter(Boolean),
        abilityIdx,
        pactSlotLevel: pactLevel,
        deleted: $(s,'pwaDeleted') === '1'
      });
    });
  });

  // ── Custom resource pools (Lay on Hands, item charges, etc.) ──
  // MUST run BEFORE buildAbilities so that when buildAbilities searches
  // trackers for ownPool matches (to fix the Imponer las Manos → PH
  // collision), the pool trackers already exist in the array.
  const poolSeen = new Set();
  [...allFeats, ...itemFeats, ...charFeats].forEach((e, i) => {
    if (e.equipped === false && !e.alwaysActive) return;
    if (e.deleted) return;
    const key = e.name.toLowerCase();
    if (poolSeen.has(key)) return;
    const pool = detectResourcePool(e.name, e.text, classInfo, totalLevel, mods, prof);
    if (!pool) return;
    poolSeen.add(key);
    trackers.push({
      id:`pool${i}`, label: pool.label, type:1, resetType: pool.resetType,
      max: pool.max, current: pool.max, isDice:false, diceFmt:null, isPool:true,
      dawnDice: pool.dawnDice || null
    });
  });

  // Trackers are now complete (native + pool-synthesized); pass them to
  // buildAbilities so ownPool detection works correctly.
  const abilities = buildAbilities(
    [...allFeats, ...itemFeats, ...charFeats], totalLevel, mods, prof, weapons, spellEntries, spellDC, trackers, bonuses
  );

  // Inventario: metadatos serializables (sin `.el`, es un nodo DOM) para
  // la sección de Inventario y el toggle de equipar/desequipar. Los ítems
  // borrados (§3.x) se excluyen acá recién — antes de este punto se
  // necesitaban presentes en `allItems` para que `item{idx}`/`w{idx}`/
  // `e{idx}` de TODOS los demás ítems no se corrieran de lugar.
  const items = allItems.filter(it => !it.deleted).map(({ el, ...pub }) => pub);

  // ── Iniciativa ──────────────────────────────────────────────────
  // Base = modificador de Destreza + bono universal type=12 ("Initiative"
  // en el menú de FC5e — confirmado con el ítem de prueba dedicado).
  const initiative = mods.dex + initiativeBonusFlat;

  // ── Percepción Pasiva ────────────────────────────────────────────
  // 10 + modificador de Percepción (ya incluye competencia y cualquier
  // bono de habilidad de category=4) + bono universal type=14 ("Passive
  // Wisdom" en el menú de FC5e — confirmado con el ítem de prueba
  // dedicado).
  const perceptionSkill = skills.find(s => s.key === 'perception');
  const passiveWisdom = 10 + (perceptionSkill ? perceptionSkill.mod : mods.wis) + passiveWisdomBonusFlat;

  return { name, hpMax, hpMaxBase, hpBreakdown:hpModsFound, hpCur, cName, cLvl:totalLevel, classInfo, raceName, prof, mods, scores, scoreBreakdown, skills, saves, trackers, abilities, spellDC, maxSpellLevel, ac:computedAC, speed, initiative, passiveWisdom, bonuses, items };
}

// ── Classify a single ability text ──────────────────
const RE_REACTION = /as a reaction|use (?:your|a) reaction|your reaction to|como reacci[oó]n|reacci[oó]n\s*[-\u2013]|llevar a cabo una reacci/i;
const RE_BONUS    = /as a bonus action|bonus action to|bonus action on your turn|acci[oó]n adicional|acci[oó]n adici[oó]nal|parte de la acci[oó]n adicional|tu ataque sin armas adicional|su ataque sin armas adicional|your (?:bonus|additional) unarmed strike/i;
const RE_ACTION   = /as an action[^s]|using an action|as your action|como acci[oó]n[^e]|llevar a cabo la acci[oó]n/i;

function detectAction(name, text) {
  if (RE_REACTION.test(text)) return 'reaction';
  if (RE_BONUS.test(text))    return 'bonus';
  if (RE_ACTION.test(text))   return 'action';
  return null;
}

// Detecta rasgos que se activan "como parte de" la acción adicional (u otra
// acción) de OTRA habilidad ya nombrada (p.ej. Rostro del Yo Astral puede
// invocarse junto con Brazos del Yo Astral sin gastar un segundo slot).
// Devuelve el nombre de texto de esa otra habilidad, o null.
const PIGGYBACK_RE = /(?:como |or )?parte de la acci[oó]n adicional que (?:realizas|usas|haces|realices) para activar\s+(?:los?\s+|las?\s+)?([^,.\n]+)|as part of the bonus action (?:you (?:use|take|used)|used) to activate\s+([^,.\n]+)/i;
function extractPiggybackTarget(text) {
  const m = (text || '').match(PIGGYBACK_RE);
  if (!m) return null;
  return (m[1] || m[2] || '').trim();
}

// Detecta rasgos que describen su beneficio como "N ataques sin armas"
// (Ráfaga de Golpes, Ataque sin armas adicional, etc.) para poder estimar
// su daño con el mismo daño-por-golpe que el ataque sin armas base.
const NUM_WORDS_ES = { un:1, una:1, uno:1, dos:2, tres:3, cuatro:4, cinco:5, seis:6 };
const NUM_WORDS_EN = { one:1, two:2, three:3, four:4, five:5, six:6 };
function wordToNum(w) {
  if (!w) return null;
  const lw = w.toLowerCase();
  if (/^\d+$/.test(lw)) return parseInt(lw);
  return NUM_WORDS_ES[lw] || NUM_WORDS_EN[lw] || null;
}
function parseAttackCount(text) {
  const m = (text||'').match(/\b(\d+|un|una|uno|dos|tres|cuatro|cinco|seis)\s+ataques?\s+sin\s+armas\b/i)
         || (text||'').match(/\b(\d+|one|two|three|four|five|six)\s+unarmed\s+strikes?\b/i);
  return m ? wordToNum(m[1]) : null;
}
// Detecta rasgos que MEJORAN el número de ataques de otro rasgo ya existente
// (p.ej. "Concentración Agudizada" sube Ráfaga de Golpes de 2 a 3 ataques):
// "...usar Ráfaga de golpes y hacer tres ataques sin armas en lugar de dos".
function parseAttackCountUpgrade(text) {
  const m = (text||'').match(/para usar ([^,.\n]+?) y hacer\s+(\d+|dos|tres|cuatro|cinco|seis)\s+ataques\s+sin\s+armas/i)
         || (text||'').match(/to use ([^,.\n]+?) and make\s+(\d+|two|three|four|five|six)\s+unarmed\s+strikes/i);
  if (!m) return null;
  return { targetName: m[1].trim(), count: wordToNum(m[2]) };
}

// ── Classify a spell by its <time> field ────────────
function detectSpellTime(time) {
  const tl = (time || '').toLowerCase();
  if (/reacci|reaction/.test(tl)) return 'reaction';
  if (/bonus action|acci[oó]n adicional/.test(tl)) return 'bonus';
  if (/action|acci[oó]n/.test(tl)) return 'action';
  return 'utility'; // rituals, "X minutes/hours" — outside the turn structure
}

// ── PC / resource cost detection ────────────────────
// "Channel Divinity" usage was previously excluded here because the old
// single shared RE_PC_TRACKER lookup couldn't tell two resource pools
// apart on the same character (see RESOURCE_TYPES above for the full
// story — confirmed colliding with Puntos de Hechicería on Dorym, a
// Paladín/Hechicero). Now that every ability carries its own resKey and
// findResTracker() looks up ONLY that pool, it's safe to detect again.
function detectPCCost(text) {
  const m = text.toLowerCase().match(/(?:gastar|gastando|expend)\s+(?:one|1|(\d+))\s+(?:punto|p\.c\.|psionic energy|superiority)/);
  if (m) return m[1] ? parseInt(m[1]) : 1;
  if (/(?:usar|utilizar)\s+(?:tu\s+)?canalizar divinidad|use your channel divinity/i.test(text)) return 1;
  return 0;
}

// ═══════════════════════════════════════════════════
//  "FREE ACTION" / TRIGGERED FEATURE DETECTION
//  Features that DON'T consume the action economy but
//  DO spend a resource when a trigger condition is met
//  (Divine Smite, Metamagic, etc.)
// ═══════════════════════════════════════════════════
const RE_TRIGGER_WORD    = /\bcuando\b|\bwhen you\b|inmediatamente (?:despu[eé]s|cuando)|immediately after/i;
const RE_SLOTSPEND_SRC   = 'gastar(?:le)?\\s+(?:uno de tus |un )?espacios? de conjuro|expend(?:ing)?\\s+a\\s+spell\\s+slot|consumir(?:[aá]s)?\\s+.*espacio\\s+de\\s+conjuro';
const RE_METAMAGIC_CTX   = /lanzas un conjuro|cast(?:ing)? a (?:sorcerer )?spell/i;

// hasRealSlotSpend: rechaza si "sin"/"without" precede al match (evita
// clasificar conjuros innatos gratuitos como smite-triggers).
function hasRealSlotSpend(text) {
  const re = new RegExp(RE_SLOTSPEND_SRC, 'gi');
  let m;
  while ((m = re.exec(text))) {
    const before = text.slice(Math.max(0, m.index - 20), m.index);
    if (/\b(sin|without)\b/i.test(before)) continue;
    return true;
  }
  return false;
}

// Detecta "cast X once with this trait, regain on rest" (conjuro innato racial).
// Requiere verbo de lanzamiento cerca de "once"/"una vez" para evitar
// falsos positivos con pools escalables ("minimum of once").
const RE_INNATE_SPELL_ANCHOR = /\bcast\b[\s\S]{0,60}?\bonce\b|\blanzar\b[\s\S]{0,60}?\buna vez\b/gi;

function detectInnateSpellUse(text) {
  const re = new RegExp(RE_INNATE_SPELL_ANCHOR.source, 'gi');
  let m;
  while ((m = re.exec(text))) {
    const isSpanish = /una vez/i.test(m[0]);
    const onceIdx = text.toLowerCase().indexOf(isSpanish ? 'una vez' : 'once', m.index);
    const before = text.slice(Math.max(0, onceIdx - 20), onceIdx);
    if (/minimum of\s*$|m[ií]nimo de\s*$/i.test(before)) continue; // variable-size pool, not innate cast
    const after = text.slice(m.index, m.index + 300);
    const restMatch = after.match(/\bregain\b[\s\S]{0,80}?\b(short|long)\s+rest|\brecuperas\b[\s\S]{0,80}?\bdescanso\s+(corto|largo)/i);
    if (restMatch) {
      const word = (restMatch[1] || restMatch[2] || '').toLowerCase();
      return { resetType: (word === 'short' || word === 'corto') ? 1 : 2 };
    }
  }
  return null;
}

// Parses "Xd Y for/at level 1, plus Zd Y for each level above, up to N d Y"
// style scaling text (Divine Smite and similar). Returns null if the text
// doesn't match this pattern.
function detectScalingDamage(text) {
  const diceRe = /(\d+)d(\d+)/g;
  let m, base = null, perLevel = null, max = null;
  while ((m = diceRe.exec(text))) {
    const before = text.slice(Math.max(0, m.index - 35), m.index);
    const after  = text.slice(m.index + m[0].length, m.index + m[0].length + 55);
    const entry = { n:+m[1], die:+m[2] };
    if (/m[aá]ximo (?:de|of)\s*$|maximum of\s*$/i.test(before)) {
      max = entry;
    } else if (!base && /^[^.]*(?:nivel|level)\s*1\b|^[^.]*1(?:st|°|º)?.?\s*level/i.test(after)) {
      base = entry;
    } else if (!perLevel && /^[^.]*(?:por cada nivel|each (?:spell )?level|cada nivel adicional)/i.test(after)) {
      perLevel = entry;
    }
  }
  if (base && perLevel) {
    let maxN = base.n + 8 * perLevel.n, maxLevel = 9;
    if (max) { maxN = max.n; maxLevel = 1 + Math.round((max.n - base.n) / perLevel.n); }
    return { die: base.die, baseN: base.n, perLevelN: perLevel.n, maxN, maxLevel: Math.min(9, maxLevel) };
  }
  return null;
}

// Classifies a feat that detectAction() couldn't place into action/bonus/
// reaction as a "trigger" — something that fires off another event
// (a hit, casting a spell, etc.) and spends a resource instead of a slot
// in the turn structure.
// RE_FREE_INNATE_CAST: captura "cast X without expending a spell slot"
// para mostrar estos triggers aunque no tengan un recurso rastreable.
const RE_FREE_INNATE_CAST = /(?:cast|lanza(?:r|s)?)[\s\S]{0,80}?(?:without expending|sin gastar)[\s\S]{0,30}?(?:spell slot|espacio de conjuro)/i;

function classifyTrigger(text) {
  // Checked BEFORE the RE_TRIGGER_WORD gate below: "cast X once without
  // expending a spell slot" is a strong enough standalone signal on its
  // own — it doesn't need "cuando"/"when you" framing to mean something.
  // Confirmed needed on real data: Warlock's Mystic Arcanum is curated as
  // 4 near-identical feats (6th/7th/8th/9th tier). Only the 6th-tier entry
  // happens to ALSO contain a trailing "...when you finish a long rest"
  // sentence (a scaling note that mentions the other 3 tiers); the 7th/8th
  // /9th tier entries are shorter and never say "cuando"/"when you" at
  // all. Gating on RE_TRIGGER_WORD first meant 3 of the 4 real tiers were
  // silently dropped (matched neither detectAction nor classifyTrigger),
  // even though their matching trackers were already being synthesized
  // correctly by detectResourcePool — the ability just never displayed.
  if (RE_FREE_INNATE_CAST.test(text)) {
    return { triggerKind:'free', pc:0, scaling:null, variablePC:false, resKey:null };
  }
  if (!RE_TRIGGER_WORD.test(text)) return null;

  if (hasRealSlotSpend(text)) {
    return { triggerKind:'smite', pc:0, scaling: detectScalingDamage(text), variablePC:false, resKey:null };
  }
  const fixedPC = detectPCCost(text);
  const isMeta  = RE_METAMAGIC_CTX.test(text);
  if (fixedPC > 0) {
    // detectPCCost already required an explicit spend verb ("gastar"/
    // "expend"/"usar Canalizar Divinidad"), so any resKey it implies is safe.
    return { triggerKind: isMeta ? 'metamagic' : 'resource', pc:fixedPC, scaling:null, variablePC:false, resKey: detectResKey(text) };
  }
  // Fallback: no fixed count found, but the text might still describe a
  // variable-cost spend (Conjuro Gemelo/Twinned Spell scales with target
  // level, etc). Restricted to variableEligible pools ONLY — confirmed
  // false-positive on Rhyo otherwise: "Metabolismo Asombroso" mentions
  // "puntos de concentración" but only to describe REGAINING them
  // ("puedes recuperar todos los puntos... gastados"), not spending any.
  // There's no real 5e mechanic for variable-cost Focus/Channel Divinity
  // spends, so excluding those two keys here removes the false trigger
  // without needing fragile spend-vs-regain verb detection on free text.
  const resKey = detectResKey(text, /*onlyVariableEligible=*/true);
  if (resKey) {
    return { triggerKind: isMeta ? 'metamagic' : 'resource', pc:0, scaling:null, variablePC:true, resKey };
  }
  return null;
}

// ═══════════════════════════════════════════════════
//  CUSTOM RESOURCE POOL / CHARGES DETECTION
//  Imponer las Manos, cargas de ítem, pools por modificador, etc.
// ═══════════════════════════════════════════════════
const NUM_WORDS = { uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,
  one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10 };

// Multiplier × class-level pool (e.g. "five times your paladin level").
// Guard: keyword de contexto debe estar dentro de 120 chars del match.
const RE_POOL_LEVEL = /(\d+|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|one|two|three|four|five|six|seven|eight|nine|ten)\s*(?:veces|times|[×x])\s*(?:tu nivel de\s+([a-záéíóúñ]+)|your\s+([a-z]+)\s+level)/i;
const RE_POOL_CONTEXT = /\b(?:pool|reserva|piscina|uses?|usos?|number of charges|cargas?)\b/i;

// Guard: "this item/weapon/armor/device" precede al match → tabla interna, no pool.
const RE_CHARGES = /(?:tiene|has|with)\s+(\d+)\s+(?:cargas?|charges)/i;
const RE_CHARGES_ITEM_PREFIX = /\bthis\s+(?:item|weapon|armor|device|cantrip|tool)\s*$/i;

// "N times equal to your [mod/prof]" — solo con frase de recuperación de usos.
const RE_SCALING_BY_MOD = /number of times equal to(?:\s+(?:twice|double|half))?\s+your\s+(strength|dexterity|constitution|intelligence|wisdom|charisma|str|dex|con|int|wis|cha)\s+modifier|veces igual a tu modificador de\s+(fuerza|destreza|constituci[oó]n|inteligencia|sabidur[ií]a|carisma)/i;
const RE_SCALING_BY_PROF = /number of times equal to your proficiency bonus|veces igual a tu bono de competencia/i;
const RE_SCALING_REGAIN = /\bregain(?:\s+all)?\s+(?:expended\s+)?uses|\brecuperas?\s+(?:todos\s+los\s+usos|las\s+cargas?)/i;

// Multiplier modifiers for "twice/double/half" variants
const RE_SCALING_MULT = /\b(twice|double)\b/i;
const RE_SCALING_HALF = /\bhalf\b/i;

const ABILITY_MOD_NAME = {
  strength:'str', str:'str', fuerza:'str',
  dexterity:'dex', dex:'dex', destreza:'dex',
  constitution:'con', con:'con', 'constituci\u00f3n':'con', constitucion:'con',
  intelligence:'int', int:'int', inteligencia:'int',
  wisdom:'wis', wis:'wis', 'sabidur\u00eda':'wis', sabiduria:'wis',
  charisma:'cha', cha:'cha', carisma:'cha'
};

function stripAccents(s) {
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

// Returns a tracker-shaped object, or null if no pool/charges pattern found.
// mods and prof are passed through from parseFC5eXML to resolve scaling formulas.
function detectResourcePool(name, text, classInfo, totalLevel, mods, prof) {
  const resetType = /short rest|descanso corto/i.test(text) ? 1 : 2;

  // ── Multiplier × level (e.g. "five times your paladin level") ──────
  const m1 = text.match(RE_POOL_LEVEL);
  if (m1) {
    // Require pool-context word within 120 chars of the match (not anywhere
    // in the full feat text, to avoid matching HP formulas of summoned creatures)
    const nearCtx = text.slice(Math.max(0, m1.index - 120), m1.index + 120);
    if (RE_POOL_CONTEXT.test(nearCtx)) {
      const raw = m1[1].toLowerCase();
      const mult = NUM_WORDS[raw] ?? parseInt(raw);
      const classWord = stripAccents(m1[2] || m1[3] || '');
      let lvl = totalLevel;
      const match = classInfo.find(ci => {
        const cw = stripAccents(ci.name).trim();
        return cw && (cw.includes(classWord) || classWord.includes(cw));
      });
      if (match) lvl = match.level;
      else if (classInfo.length === 1) lvl = classInfo[0].level;
      const max = mult * lvl;
      if (max > 0) return { label:name, max, resetType, isPool:true };
    }
  }

  // ── N charges on an item/feature ────────────────────────────────
  const m2 = text.match(RE_CHARGES);
  if (m2) {
    const before30 = text.slice(Math.max(0, m2.index - 30), m2.index);
    if (!RE_CHARGES_ITEM_PREFIX.test(before30)) {
      const max = parseInt(m2[1]);
      // Detect partial/random recharge at dawn: "regains 1d6 + 4 expended charges daily at dawn"
      const dawnM = text.match(/regains?\s+([\dd +\-]+?)\s+expended charges?(?:\s+daily)?\s+at dawn|recupera\s+([\dd +\-]+?)\s+cargas?(?:\s+gastadas?)?(?:\s+diariamente)?\s+al amanecer/i);
      const dawnDice = dawnM ? (dawnM[1] || dawnM[2] || '').trim() : null;
      if (max > 0) return { label:name, max, resetType, isPool:true, dawnDice };
    }
  }

  // ── N times equal to [ability modifier / proficiency bonus] ─────
  // Only synthesize a pool when the text also contains a regain-uses
  // phrase ("regain all expended uses when you finish a rest") — this
  // guards against false matches where "N times equal to your X modifier"
  // describes a damage bonus or healing amount, not a use-count formula.
  if (mods && RE_SCALING_REGAIN.test(text)) {
    const mMod = text.match(RE_SCALING_BY_MOD);
    if (mMod) {
      const rawName = stripAccents(mMod[1] || mMod[2] || '');
      const key = ABILITY_MOD_NAME[rawName];
      if (key && mods[key] !== undefined) {
        // "twice/double your X modifier" or "half your X modifier" variants
        const multStr = text.slice(Math.max(0, mMod.index - 30), mMod.index);
        let base = mods[key];
        if (RE_SCALING_MULT.test(multStr)) base = base * 2;
        else if (RE_SCALING_HALF.test(multStr)) base = Math.ceil(base / 2);
        const max = Math.max(1, base);   // "minimum of once" → at least 1
        return { label:name, max, resetType, isPool:true };
      }
    }
    const mProf = text.match(RE_SCALING_BY_PROF);
    if (mProf && prof) {
      return { label:name, max: Math.max(1, prof), resetType, isPool:true };
    }
  }

  // ── Innate spellcasting (racial "cast once, regain on rest") ─────
  const innate = detectInnateSpellUse(text);
  if (innate) return { label:name, max:1, resetType:innate.resetType, isPool:true };

  return null;
}

// ── Short description from full text ───────────────
function shortDesc(text) {
  const clean = text.replace(/\n/g,' ').replace(/\s+/g,' ').trim();
  const m = clean.match(/^.{20,140}?[.!?]/);
  if (m) return m[0];
  return clean.slice(0, 130) + (clean.length > 130 ? '…' : '');
}
function fullDescClean(text) {
  return text.replace(/\n{2,}/g,'\n').trim();
}

// ── Text patterns → effectKey detection ──────────────
// Detección en dos capas: primero por nombre del hechizo (bilingüe,
// más robusto), luego por texto libre. selfOrAlly=true muestra el
// toggle [Yo/Aliado] antes de activar el efecto.
const EFFECT_NAME_MAP = [
  // ── Haste (only self-buff variant grants extra action) ──
  { re:/^(acelerar|haste)(\s+\(?\w*\)?)?$/i,     key:'haste_self',         selfOrAlly:true },
  // ── Bless ──
  { re:/^(bendici[oó]n\s*|bless(?:ing)?)(\s*\+\d+)?$/i, key:'bless',       selfOrAlly:true },
  // ── Hex / Maldición del Brujo ──
  { re:/^(maldici[oó]n\s*\(?\w*\)?|hex)(\s*blade)?$/i, key:'hex',          selfOrAlly:false },
  // ── Hunter's Mark ──
  { re:/^(marca del cazador|hunter'?s?\s*mark)$/i,  key:'hunters_mark',     selfOrAlly:false },
  // ── Faerie Fire ──
  { re:/^(fuego de(?: la[sz]?)? hadas?|faerie fire)$/i, key:'faerie_fire',  selfOrAlly:false },
  // ── Hypnotic Pattern ──
  { re:/^(modelo hipn[oó]tico|hypnotic pattern)$/i, key:'hypnotic_pattern', selfOrAlly:false },
  // ── Spirit Guardians ──
  { re:/^(guardianes? espirituales?|spirit guardians?)$/i, key:'spirit_guardians', selfOrAlly:false },
  // ── Invisibility ──
  { re:/^(invisibilidad|invisibility)$/i,           key:'invisibility_self', selfOrAlly:true },
  // ── Aid ──
  { re:/^(auxilio|aid)(\s+\(?\w*\)?)?$/i,           key:'aid',              selfOrAlly:false },
  // ── Shield of Faith ──
  { re:/^(escudo de fe|shield of faith)$/i,          key:'shield_of_faith', selfOrAlly:false },
  // ── Rage ──
  { re:/^(rabia|rage)(\s+of\s+\w+)?$/i,             key:'rage',             selfOrAlly:false },
  // ── Bane (debuff on targets, tracks concentration only) ──
  { re:/^(perdici[oó]n|bane)(\s+\(?\w*\)?)?$/i,    key:'concentration_generic', selfOrAlly:false },
  // ── Guerrero del Yo Astral (Monje) ──
  { re:/brazos del yo astral/i,                     key:'brazos_yo_astral', selfOrAlly:false },
  { re:/rostro del yo astral/i,                     key:'rostro_yo_astral', selfOrAlly:false },
];

// Checked after name — catches renamed/homebrew variants and feats
const EFFECT_TAG_RULES = [
  // Haste (confirmed Spanish text: "velocidad del objetivo se duplica" + "acción adicional")
  { key:'haste_self',     selfOrAlly:true,
    re:/velocidad.*se duplica|speed is doubled|ganas? una acci[oó]n adicional|you gain an additional action/i },
  // Rage
  { key:'rage',           selfOrAlly:false,
    re:/entras? en est(?:ado de )?rabia|you enter a rage\b|while raging/i },
  // Bless (confirmed Spanish: "tirada de ataque o una tirada de salvación" "puede tirar 1d4")
  { key:'bless',          selfOrAlly:true,
    re:/\bbendicione?s?\b|\bbless(?:ing)?\b/i },
  // Hex
  { key:'hex',            selfOrAlly:false,
    re:/\bhex\b(?! blade)|\bmaldici[oó]n\b(?!.*enfermedad)/i },
  // Hunter's Mark
  { key:'hunters_mark',   selfOrAlly:false,
    re:/marca del cazador|hunter'?s? mark/i },
  // Faerie Fire
  { key:'faerie_fire',    selfOrAlly:false,
    re:/fuego de (?:la[sz]? )?hadas?|faerie fire/i },
  // Hypnotic Pattern
  { key:'hypnotic_pattern', selfOrAlly:false,
    re:/modelo hipn[oó]tico|hypnotic pattern/i },
  // Spirit Guardians
  { key:'spirit_guardians', selfOrAlly:false,
    re:/guardianes? espirituales?|spirit guardians?/i },
  // Invisibility — requires "become invisible" NOT just "invisible" (avoids Shield spell)
  { key:'invisibility_self', selfOrAlly:true,
    re:/\binvisibilit(?:y|ies)\b|(?:te vuelves?|become[s]?)\s+invisible/i },
  // Aid
  { key:'aid',            selfOrAlly:false,
    re:/\baid\b|\bauxilio\b/i },
  // Shield of Faith
  { key:'shield_of_faith', selfOrAlly:false,
    re:/shield of faith|escudo de fe/i },
];

// detectEffectKey: two-layer lookup (name → text → null)
// El recurso "Puntos de Concentración" del Monje 2024 (ex-Ki) usa la misma
// palabra que la mecánica de concentración de hechizos ("gastar 1 punto de
// concentración" no tiene nada que ver con mantener un hechizo). Antes de
// aplicar el fallback genérico, se descartan las menciones al recurso y
// solo se acepta el resto si describe la mecánica real (mantener/perder/
// romper un efecto en curso), no la mera palabra "concentración".
const FOCUS_RESOURCE_STRIP_RE = /concentraci[oó]n de monje|monk concentration|puntos?\s+de\s+concentraci[oó]n|focus\s+points?|ki\s+points?/gi;
const CONCENTRATION_MECHANIC_RE = /(?:pierd\w*|mantien\w*|mantener|romper|rompe\w*|requiere\w*)\s+(?:tu\s+|la\s+|su\s+)?concentraci[oó]n|concentrad[oa]s?\s+en|mientras\s+(?:est[eé]s?\s+)?concentrad\w*|(?:lose|los[et]|maintain\w*|break\w*|requires?)\s+(?:your\s+)?concentration|while\s+(?:you(?:'re| are)?\s+)?concentrat\w*|as if\s+(?:you\s+(?:were|are)\s+)?concentrat\w*/i;

function detectEffectKey(name, text) {
  const cleanName = name.trim().replace(/\s+/g,' ');
  // Layer 1: by name
  for (const rule of EFFECT_NAME_MAP) {
    if (rule.re.test(cleanName)) return { effectKey: rule.key, selfOrAlly: rule.selfOrAlly };
  }
  // Layer 2: by text content
  const combined = (cleanName + ' ' + (text||'')).replace(/\n/g,' ');
  for (const rule of EFFECT_TAG_RULES) {
    if (rule.re.test(combined)) {
      return { effectKey: rule.key, selfOrAlly: rule.selfOrAlly };
    }
  }
  // Generic concentration detection (no specific mechanic flags, just tracks conc)
  const strippedForConc = combined.replace(FOCUS_RESOURCE_STRIP_RE, '');
  if (CONCENTRATION_MECHANIC_RE.test(strippedForConc)) {
    return { effectKey: 'concentration_generic', selfOrAlly: false };
  }
  return null;
}

// ── Active effects helpers ───────────────────────────
function hasEffect(flag) {
  return Object.values(G.activeEffects || {}).some(e => e.mechanicFlags.includes(flag));
}
function isConcentrating() {
  return Object.values(G.activeEffects || {}).some(e => e.concentration);
}
// Returns the label of the currently-active concentration effect,
// or null if there is none. Used by the render to show the warning.
function activeConcentrationLabel() {
  const eff = Object.values(G.activeEffects || {}).find(e => e.concentration);
  return eff ? eff.label : null;
}
function activateEffect(sourceId, effectKey, appliesTo) {
  const catalog = EFFECT_CATALOG[effectKey];
  if (!catalog) return;
  // Break existing concentration if activating a new concentration spell
  if (catalog.concentration && isConcentrating()) {
    breakConcentration();
  }
  const id = `eff_${sourceId}_${effectKey}`;
  if (!G.activeEffects) G.activeEffects = {};
  G.activeEffects[id] = {
    id, label: catalog.label,
    sourceId, effectKey,
    concentration: catalog.concentration,
    appliesTo: appliesTo || catalog.appliesTo,
    mechanicFlags: [...catalog.mechanicFlags],
    roundsLeft: null
  };
  save(); render();
}
function deactivateEffect(id) {
  if (G.activeEffects) delete G.activeEffects[id];
  save(); render();
}
function breakConcentration() {
  if (!G.activeEffects) return;
  Object.keys(G.activeEffects).forEach(id => {
    if (G.activeEffects[id].concentration) delete G.activeEffects[id];
  });
}
function tickEffects() {
  if (!G.activeEffects) return;
  Object.entries(G.activeEffects).forEach(([id, eff]) => {
    if (eff.roundsLeft !== null) {
      eff.roundsLeft--;
      if (eff.roundsLeft <= 0) delete G.activeEffects[id];
    }
  });
}

//  Classifies any ability/spell by what it DOES, based on
//  its description text (bilingual EN/ES). Powers the
//  generic "Sugerencias" combo system below.
// ═══════════════════════════════════════════════════
const TAG_RULES = [
  { tag:'heal',    re:/recuper(?:as?|aci[oó]n)\b|san(?:a|ar|as|aci[oó]n)\b|cura(?:s|ci[oó]n)?\b|regain.*hit points|hit points.*regain|heal(?:ing)?\b/i },
  { tag:'defense', re:/resistencia a|resistance to|puntos de golpe temporal|temporary hit points|\bca\s*\+|armor class|esquivar|dodge|cobertura total|immunity|inmunidad/i },
  { tag:'mobility',re:/velocidad de (?:vuelo|excavaci[oó]n|trepar|nataci[oó]n)|flying speed|teletransport|teleport|salto.*(?:pies|feet)|jump|no provoca? ataques? de oportunidad|without provoking opportunity/i },
  { tag:'damage',  re:/\d+d\d+|puntos? de da[ñn]o|recib\w*\s+da[ñn]o|hit points of damage|damage\b/i },
  { tag:'buff',    re:/ventaja en|advantage on|bonificador (?:a|de)|bonus to|gana[ns]? .* puntos de golpe m[aá]ximos|increases by/i },
];

// Condition keywords (used both for "control" — inflicting — and for
// detecting "cure" abilities, which remove these same conditions).
// NOTE: "invisible"/"invisibility" deliberately excluded — invisibility is
// almost always a buff (defense/utility), not an offensive control effect,
// so adding it here would misclassify the Invisibility spell as "control".
const RE_CONDITION = /aturdid|paraliz|asustad[oa]|incapacitad|derribad[oa]|apresad[oa]|ralentiz|hechizad[oa]|cegad[oa]|ensordecid[oa]|envenenad[oa]|agotamiento|inconscien|stunned|paralyz|frightened|incapacitated|prone|restrained|grappled|slowed|charmed|blinded|deafened|poisoned|petrif|exhaust|unconscious/i;
// "ends/cures/removes a condition" — these are SUPPORT, not control.
