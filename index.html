  if (!steps) return;
  G.lastSnapshot = { trackers: { ...G.trackers } };
  G.comboUsed = {};
  steps.forEach(step => {
    if (step.type === 'ability') {
      G[step.secFlag] = true;
      if (step.pc > 0) spendResource(step.pc, step.resKey);
      if (step.spellLevel > 0) spendSpellSlot(step.spellLevel, step.slotPrefix);
      if (step.once) G.oncePerTurn[step.id] = true;
      G.comboUsed[step.id] = true;
    } else if (step.type === 'smite') applySmite(step.level);
  });
  save(); render();
  toast('Combo aplicado');
}

function spendResource(n, resKey) {
  const t = findResTracker(resKey);
  if (!t) return;
  G.trackers[t.id] = Math.max(0, (G.trackers[t.id] ?? t.max) - n);
}

function spendSpellSlot(level, slotPrefix) {
  const t = char.trackers.find(t => t.id === `${slotPrefix || 'sl'}${level}`);
  if (!t) return;
  G.trackers[t.id] = Math.max(0, (G.trackers[t.id] ?? t.max) - 1);
}

function chTracker(id, delta) {
  const t = char.trackers.find(t => t.id === id);
  if (!t) return;
  G.trackers[id] = Math.max(0, Math.min(t.max, (G.trackers[id] ?? t.max) + delta));
  save(); render();
}

function setPoolAmt(id, val) {
  const t = char.trackers.find(t => t.id === id);
  if (!t) return;
  let amt = parseInt(val);
  if (isNaN(amt) || amt < 1) amt = 1;
  if (amt > t.max) amt = t.max;
  G.poolAmt[id] = amt;
  save();
}

function poolSpend(id) {
  const t = char.trackers.find(t => t.id === id);
  if (!t) return;
  const amt = G.poolAmt[id] ?? Math.min(5, t.max);
  const cur = G.trackers[id] ?? t.max;
  const spent = Math.min(amt, cur);
  if (spent <= 0) return;
  G.trackers[id] = cur - spent;
  save(); render();
  toast(`${t.label}: −${spent} (quedan ${cur - spent})`);
}

function clickTDot(id, i) {
  const t = char.trackers.find(t => t.id === id);
  if (!t) return;
  const cur = G.trackers[id] ?? t.max;
  G.trackers[id] = (i === cur - 1) ? cur - 1 : Math.min(t.max, i + 1);
  save(); render();
}

// ── Inventario: equipar / desequipar ──────────────────────────────
// Reparsea el XML crudo cacheado con el nuevo estado de G.equipped —
// reutiliza TODA la lógica ya validada de CA/característica/bonos/
// habilidades en vez de duplicarla (ver §2.9 en CONTEXTO_PROYECTO.md).
// Los ids de ítem (`item{idx}`) y de habilidad (`e{idx}`/`w{idx}`) son
// estables entre reparseos porque siempre se derivan de la posición en
// el XML, nunca de un array ya filtrado por equipado — así que G.hidden/
// G.oncePerTurn/etc. no se desincronizan al tocar el inventario.
function reparseChar() {
  if (!lastXmlText) { toast('Reimportá el personaje para poder equipar ítems'); return; }
  const newChar = parseFC5eXML(lastXmlText, G.equipped);
  char = newChar;
  // Trackers nuevos (p.ej. un pool que solo existe con el ítem equipado)
  // arrancan en su máximo; los que ya existían conservan su valor actual.
  char.trackers.forEach(t => { if (G.trackers[t.id] === undefined) G.trackers[t.id] = t.max; });
  save();
  render();
}

function toggleItemEquipped(id) {
  const item = (char.items || []).find(i => i.id === id);
  if (!item || !item.equippable) return;
  const next = !item.equipped;
  // Un solo cuerpo de armadura y un solo escudo puestos a la vez — al
  // equipar uno nuevo se desequipa automáticamente el anterior del mismo
  // tipo (si no, la fórmula de CA simplemente ignoraría el redundante,
  // pero dejarlo "equipado" en la UI sería confuso).
  if (next && (item.isBodyArmor || item.isShield)) {
    char.items.forEach(other => {
      if (other.id !== id && other.equipped &&
          ((item.isBodyArmor && other.isBodyArmor) || (item.isShield && other.isShield))) {
        G.equipped[other.id] = false;
      }
    });
  }
  G.equipped[id] = next;
  reparseChar();
}

// ═══════════════════════════════════════════════════
//  EDICIÓN DE FICHA (ver §3.9 en CONTEXTO_PROYECTO.md)
// ═══════════════════════════════════════════════════
// Las ediciones se aplican como mutaciones al DOM del XML cacheado
// (lastXmlText) y se reparsean con parseFC5eXML — mismo patrón que
// reparseChar() usa para equipar/desequipar ítems (ver arriba). Así el
// recálculo en cascada (FUE→modificador→salvación→daño/ataque de arma,
// etc.) sale gratis de la lógica ya validada en vez de duplicarla, y de
// paso lastXmlText sigue siendo un XML de FC5e válido con la edición
// adentro — el camino más corto para poder reintegrarlo a FC5e.
async function applyXmlEdit(mutatorFn) {
  if (!lastXmlText) { toast('Reimportá el personaje para poder editarlo'); return; }
  const doc = new DOMParser().parseFromString(lastXmlText, 'text/xml');
  mutatorFn(doc);
  lastXmlText = new XMLSerializer().serializeToString(doc);
  char = parseFC5eXML(lastXmlText, G.equipped);
  char.trackers.forEach(t => { if (G.trackers[t.id] === undefined) G.trackers[t.id] = t.max; });
  // Si el máximo bajó por debajo del HP actual (p.ej. bajaste Constitución
  // o el máximo de PG a mano), se recorta — nunca se sube solo porque
  // subió el máximo, eso lo sigue decidiendo el jugador con los controles
  // de HP normales.
  if (G.hp != null) G.hp = Math.min(G.hp, char.hpMax);
  await save();
  render();
}
function setAbilityBaseScore(doc, idx, value) {
  const el = doc.querySelector('character > abilities');
  if (!el) return;
  const arr = el.textContent.replace(/,$/, '').split(',').map(Number);
  while (arr.length < 6) arr.push(10);
  arr[idx] = value;
  el.textContent = arr.join(',') + ',';
}
function setHpMaxBase(doc, value) {
  const el = doc.querySelector('character > hpMax');
  if (el) el.textContent = String(value);
}

// ── Mantener presionado para editar ─────────────────────────────────
// Pointer Events (no touch+mouse por separado): un solo set de handlers
// cubre dedo/mouse/lápiz sin el problema clásico de eventos duplicados
// entre touch y su mousedown sintético posterior.
const LONG_PRESS_MS = 500, LONG_PRESS_MOVE_TOLERANCE = 12;

function lpStart(e, kind, id) {
  if (e.target.closest('button, input, select, a, .stepper')) return; // no interferir con controles propios de la tarjeta
  // e.currentTarget solo es válido MIENTRAS se despacha el evento — el DOM

  // una variable normal antes del setTimeout (si no, el timeout explota en
  // silencio con un TypeError y openEditor() nunca llega a llamarse).
  const el = e.currentTarget;
  _lpFired = false;
  _lpX = e.clientX; _lpY = e.clientY;
  el.classList.add('lp-active');
  _lpTimer = setTimeout(() => {
    _lpTimer = null; _lpFired = true;
    el.classList.remove('lp-active');
    openEditor(kind, id);
  }, LONG_PRESS_MS);
}
function lpMove(e) {
  if (!_lpTimer) return;
  if (Math.abs(e.clientX - _lpX) > LONG_PRESS_MOVE_TOLERANCE ||
      Math.abs(e.clientY - _lpY) > LONG_PRESS_MOVE_TOLERANCE) lpCancel(e);
}

}

// long-press (down+up sobre el mismo elemento) — los handlers de click
// que conviven con un long-press en el mismo elemento (p.ej. hp-val
// también abre la calculadora) llaman esto primero y no hacen nada más
// si el editor ya se abrió.
function suppressClickIfLongPress(e) {
  if (_lpFired) { _lpFired = false; e.preventDefault(); e.stopPropagation(); return true; }
  return false;
}

// Atributos de long-press para una tarjeta de habilidad, elegidos según
// su fuente: las de arma/ítem editan el ÍTEM que las genera (mismo texto/
// mods que vería el jugador en Inventario); las de conjuro van al editor
// de conjuro; el resto (clase/raza/trasfondo/dote de personaje) al editor
// de dote/rasgo. El ataque desarmado sintético (__attack) no tiene fuente
// en el XML — no es editable.
function lpAttrs(ab) {
  if (!ab || ab.id === '__attack') return '';
  let kind, id;
  if (ab.source === 'weapon' || ab.source === 'item') { kind = 'item'; id = ab.itemId; }
  else if (ab.spellLevel > 0) { kind = 'spell'; id = ab.id; }
  else { kind = 'feat'; id = ab.id; }
  if (id == null) return '';
  return ` onpointerdown="lpStart(event,'${kind}','${id}')" onpointermove="lpMove(event)" onpointerup="lpEnd(event)" onpointercancel="lpCancel(event)"`;
}

function closeEditor() {

}
function openEditor(kind, id) {

  else if (kind === 'hp') openHpEditor();
  else if (kind === 'feat') { const ab = id ? ABILITY_INDEX[id] : null; ab ? openFeatEditor(ab) : openNewFeatEditor(); }
  else if (kind === 'item') { id ? openItemEditor(id) : openNewItemEditor(); }
  else if (kind === 'spell') { const ab = id ? ABILITY_INDEX[id] : null; ab ? openSpellEditor(ab) : openNewSpellEditor(); }
}

// ── Localizar elementos en un doc recién parseado ─────────────────────
// Los ids de char.abilities/items apuntan a un DOM que se descarta en
// cada reparseo (ver applyXmlEdit) — no sirven para ubicar el nodo en el
// `doc` NUEVO que recibe cada mutatorFn. Cada tipo de entidad usa la
// estrategia más robusta disponible:
//  - Ítems: posición entre TODOS los <item> — el mismo criterio que ya
//    usa el id `item{idx}` de inventario (comprobadamente estable).
//  - Conjuros: índice de clase + posición entre los <spell> directos de
//    esa clase — mismo criterio que ya usa el id `sp{classIdx}_{i}`.
//  - Dotes/rasgos (<feat>): NO tienen un id posicional propio (nacen de
//    concatenar clase+raza+trasfondo+ítems+personaje en buildAbilities)
//    — se ubican por nombre DENTRO de su categoría de origen (ab.source).
//    Podría fallar si hay dos dotes con el MISMO nombre exacto en la
//    MISMA categoría (p.ej. multiclase) — caso raro, sin cubrir.
function locateItemEl(doc, itemId) {
  const m = /^item(\d+)$/.exec(itemId || '');
  const ch = doc && doc.querySelector('character');
  return (m && ch) ? (ch.querySelectorAll('item')[+m[1]] || null) : null;
}
function locateSpellEl(doc, spellId) {
  const m = /^sp(\d+)_(\d+)$/.exec(spellId || '');
  const ch = doc && doc.querySelector('character');
  if (!m || !ch) return null;
  const c = ch.querySelectorAll('class')[+m[1]];
  if (!c) return null;
  const direct = [...c.children].filter(x => x.tagName.toLowerCase() === 'spell');
  return direct[+m[2]] || null;
}
function locateFeatEl(doc, source, name) {
  const ch = doc && doc.querySelector('character');
  if (!ch) return null;
  let candidates = [];
  if (source === 'race') candidates = [...(ch.querySelector('race')?.querySelectorAll('feat') || [])];
  else if (source === 'background') candidates = [...(ch.querySelector('background')?.querySelectorAll('feat') || [])];
  else if (source === 'feat') candidates = [...ch.children].filter(c => c.tagName.toLowerCase() === 'feat');
  else if (source === 'class') {
    [...ch.querySelectorAll('class')].forEach(c => {
      let direct = [...c.children].filter(x => x.tagName.toLowerCase() === 'feat');
      if (!direct.length) direct = [...c.querySelectorAll('feat')];
      candidates.push(...direct);
    });
  }
  return candidates.find(f => (f.querySelector('name')?.textContent || '').trim() === name) || null;
}
function currentDoc() {
  return lastXmlText ? new DOMParser().parseFromString(lastXmlText, 'text/xml') : null;
}

// ── Mutación genérica de campos/mods (dotes, ítems y conjuros comparten
// la misma forma: <name>, <text>, <mod>*) ─────────────────────────────
function getChildText(el, tag) {
  const c = el && [...el.children].find(x => x.tagName.toLowerCase() === tag.toLowerCase());
  return c ? c.textContent : '';
}
function setChildText(doc, el, tag, value) {
  let c = [...el.children].find(x => x.tagName.toLowerCase() === tag.toLowerCase());
  if (!c) { c = doc.createElement(tag); el.appendChild(c); }
  c.textContent = value;
}
function getMods(el) {
  if (!el) return [];
  return [...el.children].filter(c => c.tagName.toLowerCase() === 'mod').map(md => ({
    category: getChildText(md, 'category') || '0',
    type: getChildText(md, 'type') || '0',
    value: getChildText(md, 'value') === '' ? null : (parseInt(getChildText(md, 'value')) || 0)
  }));
}
function setMods(doc, el, mods) {
  [...el.children].filter(c => c.tagName.toLowerCase() === 'mod').forEach(c => el.removeChild(c));
  mods.forEach(m => {
    const md = doc.createElement('mod');
    setChildText(doc, md, 'category', String(m.category));
    setChildText(doc, md, 'type', String(m.type));
    if (m.value !== null && m.value !== undefined) setChildText(doc, md, 'value', String(m.value));
    el.appendChild(md);
  });
}
function createFeatEl(doc, name, text) {
  const f = doc.createElement('feat');
  setChildText(doc, f, 'name', name);
  setChildText(doc, f, 'text', text);
  return f;
}
function createItemEl(doc, name, text) {
  const it = doc.createElement('item');
  setChildText(doc, it, 'name', name);
  if (text) setChildText(doc, it, 'text', text);
  setChildText(doc, it, 'type', '14'); // objeto maravilloso — el tipo más neutro/genérico para un ítem homebrew
  setChildText(doc, it, 'weight', '0');
  setChildText(doc, it, 'value', '0');
  return it;
}
function createSpellEl(doc, classIdx, fields) {
  const ch = doc.querySelector('character');
  const c = ch && ch.querySelectorAll('class')[classIdx];
  if (!c) return null;
  const sp = doc.createElement('spell');
  setChildText(doc, sp, 'name', fields.name);
  setChildText(doc, sp, 'text', fields.text);
  setChildText(doc, sp, 'level', String(fields.level ?? 0));
  if (fields.time) setChildText(doc, sp, 'time', fields.time);
  if (fields.range) setChildText(doc, sp, 'range', fields.range);
  if (fields.duration) setChildText(doc, sp, 'duration', fields.duration);
  c.appendChild(sp);
  return sp;
}

// ── Editor de <mod> compartido por dotes/rasgos e ítems ───────────────
// Los mismos 16 tipos de "Bono" y los índices de característica/
// salvación/habilidad ya documentados y validados en CONTEXTO_PROYECTO.md
// §2.8 — reutilizados acá tal cual para no desalinear los índices que
// escribe este editor con los que ya lee scanGenericMods. Rango -30..+30
// confirmado por el usuario contra el picker real de FC5e (un valor
// fuera de rango, aunque FC5e lo lee al importar, le hace crashear su
// propio editor al intentar volver a abrirlo).
const MOD_CATEGORY_OPTS = [
  ['0','Bono (ataque, daño, CA, PG, iniciativa…)'],

  ['3','Tirada de salvación'],

  '1': ['Fuerza','Destreza','Constitución','Inteligencia','Sabiduría','Carisma'],
  '2': ['Fuerza','Destreza','Constitución','Inteligencia','Sabiduría','Carisma'],
  '3': ['Fuerza','Destreza','Constitución','Inteligencia','Sabiduría','Carisma'],
  '4': ['Acrobacias','Trato con animales','Arcanos','Atletismo','Engaño','Historia','Perspicacia','Intimidación','Investigación','Medicina','Naturaleza','Percepción','Interpretación','Persuasión','Religión','Juego de manos','Sigilo','Supervivencia'],

}

// — no soportado en cat 1 (crearía una dependencia circular con el

}

let _modEdit = [];

function getModEditEntries(el) {

    value: m.value === null ? 0 : m.value, scaleAbility: 'str'
  }));
  const text = el ? (getChildText(el, 'text') || '') : '';
  const markers = [];
  const re = /\[PWA-BONUS cat=(\d+) type=(\d+) ability=(str|dex|con|int|wis|cha)\]/g;
  let mm;
  while ((mm = re.exec(text))) {
    markers.push({ category: mm[1], type: mm[2], mode: 'scale', value: 0, scaleAbility: mm[3] });
  }
  return [...real, ...markers];
}
function modEditRowsHtml() {
  if (!_modEdit.length) return '<div class="editor-hint">Sin bonos propios. "+ Agregar bono" para sumar uno.</div>';
  return _modEdit.map((m, i) => {
    const typeOpts = (MOD_TYPE_LABELS[m.category] || []).map((lbl, ti) =>
      `<option value="${ti}" ${String(ti)===String(m.type)?'selected':''}>${esc(lbl)}</option>`).join('');
    const modeOpts = modValueModeOptions(m).map(([v,l]) =>
      `<option value="${v}" ${v===m.mode?'selected':''}>${esc(l)}</option>`).join('');
    let valueField;
    if (m.mode === 'prof') {
      valueField = `<span class="mod-mode-label">bonificador de competencia</span>`;
    } else if (m.mode === 'scale') {
      const selfKey = m.category === '2' ? ABILITY_KEYS[parseInt(m.type)] : null;
      const abilityOpts = ABILITY_KEYS.filter(k => k !== selfKey)
        .map(k => `<option value="${k}" ${k===m.scaleAbility?'selected':''}>${ABILITY_ABBR_ES[k]}</option>`).join('');
      valueField = `<select class="mod-scale-select" onchange="modRowSet(${i},'scaleAbility',this.value)">${abilityOpts}</select>`;
    } else {
      valueField = `<input type="number" class="mod-value-input" value="${m.value ?? 0}" min="${MOD_CLAMP_MIN}" max="${MOD_CLAMP_MAX}" onchange="modRowSet(${i},'value',this.value)">`;
    }
    return `<div class="mod-row-group">
      <div class="mod-row">
        <select class="mod-cat-select" onchange="modRowSet(${i},'category',this.value)">
          ${MOD_CATEGORY_OPTS.map(([v,l]) => `<option value="${v}" ${v===m.category?'selected':''}>${esc(l)}</option>`).join('')}
        </select>
        <select class="mod-type-select" onchange="modRowSet(${i},'type',this.value)">${typeOpts}</select>
        <button class="mod-tiny-btn danger" onclick="modRowRemove(${i})" title="Quitar">✕</button>
      </div>
      <div class="mod-row mod-row-value">
        <select class="mod-mode-select" onchange="modRowSet(${i},'mode',this.value)">${modeOpts}</select>
        ${valueField}
      </div>
    </div>`;
  }).join('');
}
function refreshModEditor() {
  const el = document.getElementById('mod-editor-rows');
  if (el) el.innerHTML = modEditRowsHtml();
}
function modRowSet(i, field, value) {
  const m = _modEdit[i];
  if (field === 'category') {
    m.category = value; m.type = '0'; m.mode = 'number'; m.value = 0; m.scaleAbility = 'str';
  } else if (field === 'type') {
    m.type = value;
    if (m.mode === 'prof' && !modAllowsProf(m)) m.mode = 'number';
    if (m.mode === 'scale' && !modAllowsScale(m)) m.mode = 'number';
    if (m.mode === 'scale' && m.category === '2' && m.scaleAbility === ABILITY_KEYS[parseInt(m.type)]) {
      m.scaleAbility = ABILITY_KEYS.find(k => k !== m.scaleAbility);
    }
  } else if (field === 'mode') {
    m.mode = value;
    if (value === 'scale' && m.category === '2' && m.scaleAbility === ABILITY_KEYS[parseInt(m.type)]) {
      m.scaleAbility = ABILITY_KEYS.find(k => k !== m.scaleAbility);
    }
  } else if (field === 'value') {
    m.value = clampModValue(parseInt(value) || 0);
  } else if (field === 'scaleAbility') {
    m.scaleAbility = value;
  }
  refreshModEditor();
}
function modRowRemove(i) { _modEdit.splice(i, 1); refreshModEditor(); }
function modRowAdd() { _modEdit.push({ category:'0', type:'1', mode:'number', value:0, scaleAbility:'str' }); refreshModEditor(); }
function modEditorBlock() {
  return `<div class="editor-subhead">Bonos propios</div>
    <div id="mod-editor-rows">${modEditRowsHtml()}</div>
    <button class="footer-btn" style="margin-top:6px" onclick="modRowAdd()">+ Agregar bono</button>`;
}

// Aplica texto + lista de bonos editada a un elemento: los bonos "número"
// y "competencia" se escriben como <mod> real; los "= Modificador de X"
// se codifican como marcador al final del texto (ver scanTextMarkers en
// parseFC5eXML) — nunca ambas cosas para la misma fila. Se limpian los
// marcadores viejos del texto antes de reescribirlos, para no acumular
// duplicados cada vez que se guarda.
const TEXT_MARKER_RE = /\s*\[PWA-BONUS cat=\d+ type=\d+ ability=(?:str|dex|con|int|wis|cha)\]/g;
function stripTextMarkers(text) {
  return (text || '').replace(TEXT_MARKER_RE, '').replace(/\s+$/, '');
}
function applyTextAndMods(doc, el, rawText, modEditList) {
  const cleanText = stripTextMarkers(rawText);
  const markers = modEditList.filter(m => m.mode === 'scale')
    .map(m => `[PWA-BONUS cat=${m.category} type=${m.type} ability=${m.scaleAbility}]`);
  setChildText(doc, el, 'text', cleanText + (markers.length ? '\n\n' + markers.join(' ') : ''));
  const realMods = modEditList.filter(m => m.mode !== 'scale').map(m => ({
    category: m.category, type: m.type, value: m.mode === 'prof' ? null : clampModValue(m.value)
  }));
  setMods(doc, el, realMods);
}

// (ver isShield/isWondrous más arriba). '' = sin <type> = bártulo mundano.
const ITEM_TYPE_OPTS = [

const WEAPON_PROPERTY_BITS = [
  [1,'Munición'], [2,'Sutileza'], [4,'Pesada'], [8,'Ligera'], [16,'Recarga'],
  [32,'Alcance'], [64,'Especial'], [128,'Arrojadiza'], [256,'A dos manos'],
  [512,'Versátil'], [1024,'Marcial'],

function itemTypeExtraFieldsHtml(type, v) {
  v = v || {};

function readItemExtraFields() {

// ── Hide / restore (recycle bin) ─────────────────────
function hideAbility(id) { G.hidden.abilities[id] = true; save(); render(); }
function hideTracker(id) { G.hidden.trackers[id] = true; save(); render(); }

const SEC_LABELS = { action:'Acción', bonus:'Acción adicional', reaction:'Reacción', utility:'Fuera de combate', trigger:'Mejoras y disparadores' };

function openTrash() {
  const groups = [];

  // Hidden abilities, grouped by action type
  ['action','bonus','reaction','utility','trigger'].forEach(key => {
    const items = (char.abilities[key] || []).filter(a => G.hidden.abilities[a.id]);
    if (items.length) {
      groups.push({
        label: SEC_LABELS[key],
        rows: items.map(a => ({
          name: a.name,
          fn: `restoreAbility('${a.id}')`
        }))
      });
    }
  });

  // Hidden trackers
  const hiddenTr = char.trackers.filter(t => G.hidden.trackers[t.id]);
  if (hiddenTr.length) {
    groups.push({
      label: 'Recursos',
      rows: hiddenTr.map(t => ({
        name: t.label,
        fn: `restoreTracker('${t.id}')`
      }))
    });
  }

  let body = '';
  if (!groups.length) {
    body = `<div class="modal-empty">No hay elementos ocultos</div>`;
  } else {
    groups.forEach(g => {
      body += `<div class="trash-group">${esc(g.label)}</div>`;
      g.rows.forEach(r => {
        body += `<div class="trash-item">
          <span class="trash-name">${esc(r.name)}</span>
          <button class="trash-restore" onclick="${r.fn}">Restaurar</button>
        </div>`;
      });
    });
  }

  document.getElementById('trash-modal').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeTrash()">
      <div class="modal-sheet">
        <div class="modal-head">
          <span class="modal-title">🗑 Elementos ocultos</span>
          <button class="modal-close" onclick="closeTrash()">✕</button>
        </div>
        <div class="modal-body">${body}</div>
        ${groups.length ? `<div class="modal-foot">
          <button class="footer-btn" onclick="restoreAllFromTrash()">↺ Restaurar todo</button>
        </div>` : ''}
      </div>
    </div>`;
}

function closeTrash() {
  document.getElementById('trash-modal').innerHTML = '';
}

function restoreAbility(id) {
  delete G.hidden.abilities[id];
  save(); render(); openTrash();
}
function restoreTracker(id) {
  delete G.hidden.trackers[id];
  save(); render(); openTrash();
}
function restoreAllFromTrash() {
  G.hidden = { abilities:{}, trackers:{} };
  save(); render(); closeTrash();
}

function chHP(d) {
  G.hp = Math.min(char.hpMax, Math.max(0, (G.hp ?? char.hpCur) + d));
  save(); render();
}

// ── HP Calculator ────────────────────────────────────
function toggleCalc() {
  calcOpen = !calcOpen;
  if (!calcOpen) calcExpr = '';
  render();
}
function calcKey(k) {
  calcExpr += k;
  updateCalcDisplay();
}
function calcBackspace() {
  calcExpr = calcExpr.slice(0, -1);
  updateCalcDisplay();
}
function calcClear() {
  calcExpr = '';
  updateCalcDisplay();
}
function calcRoll(die) {
  const r = 1 + Math.floor(Math.random() * die);
  if (calcExpr && !/[+\-*/(]\s*$/.test(calcExpr)) calcExpr += '+';
  calcExpr += r;
  updateCalcDisplay();
  toast(`d${die} → ${r}`);
}
function updateCalcDisplay() {
  const el = document.querySelector('.calc-display');
  if (!el) return;
  el.textContent = calcExpr || '0';
  el.classList.toggle('empty', calcExpr.length === 0);
}
function calcEvalValue() {
  if (!calcExpr) return null;
  if (!/^[0-9+\-*/(). ]+$/.test(calcExpr)) return null;
  try {
    const v = Function('"use strict";return (' + calcExpr + ')')();
    return Number.isFinite(v) ? Math.round(v) : null;
  } catch(e) { return null; }
}
function calcApply(mode) {
  const v = calcEvalValue();
  if (v === null || v === 0) { toast('Ingresa un valor'); return; }
  const hp = G.hp ?? char.hpCur;
  const tempHp = G.tempHp || 0;
  const amount = Math.abs(v);

  if (mode === 'heal') {
    G.hp = Math.min(char.hpMax, hp + amount);
    toast(`+${amount} PG curados`);
  } else if (mode === 'temp') {
    G.tempHp = Math.max(tempHp, amount);
    toast(`PG temporales: ${G.tempHp}`);
  } else if (mode === 'damage') {
    let remaining = amount;
    if (tempHp > 0) {
      const absorbed = Math.min(tempHp, remaining);
      G.tempHp = tempHp - absorbed;
      remaining -= absorbed;
    }
    G.hp = Math.max(0, hp - remaining);
    toast(`−${amount} daño`);
  }
  calcExpr = '';
  save(); render();
}

// Reinicia el estado de turno: acción/acción adicional frescas, reacción
// bloqueada de nuevo (hasta el próximo "Fin de turno"), contadores de "una
// vez por turno" limpios, movimiento disponible de vuelta al máximo. Se
// usa al empezar un turno nuevo (avanzar de ronda) y en los descansos.
function resetTurnState() {
  G.actionUsed = G.bonusUsed = G.reactionUsed = false;
  G.reactionAvailable = false;
  G.lastUsedInSlot = {};
  G.oncePerTurn = {};
  G.comboUsed = {};
  G.lastSnapshot = null;
  const moveT = char.trackers.find(t => t.id === 'movement');
  if (moveT) G.trackers.movement = moveT.max;
}

function addRound(d) {
  G.round = Math.max(1, G.round + d);
  if (d > 0) {
    // "+" = terminaron los turnos de los demás (no rastreados) y empieza
    // tu turno nuevo: acción/adicional frescas, reacción vuelve a bloquearse.
    resetTurnState();
    tickEffects();   // decrementa roundsLeft en efectos con duración de N rondas
    save(); render();
  } else {
    // "-" = corrección manual del contador, no representa un turno nuevo.
    document.getElementById('hdr-round').textContent = G.round;
    save();
  }
}

function finTurn() {
  // Termina TU turno (empiezan los turnos no rastreados de los demás):
  // la reacción se habilita, pero la ronda NO avanza todavía.
  G.reactionAvailable = true;
  save(); render();
}

function shortRest() {
  char.trackers.forEach(t => { if (t.resetType === 1) G.trackers[t.id] = t.max; });
  resetTurnState();
  save(); render();
  toast('Descanso corto — recursos recuperados');
}

function longRest() {
  char.trackers.forEach(t => {
    // Items with dawnDice don't full-reset on long rest — they need a dawn roll.
    // All other trackers (including spell slots) reset fully.
    if (!t.dawnDice) G.trackers[t.id] = t.max;
  });
  G.hp = char.hpMax; G.tempHp = 0; G.round = 1;
  resetTurnState();
  save(); render();
  toast('Descanso largo — todo recuperado (items al amanecer pendientes)');
}

// Roll random charge recovery at dawn (e.g. Staff of the Woodlands: "1d6 + 4").
// Parses the dice formula stored in dawnDice, rolls it, adds to the current
// tracker value capped at max, and shows the result as a toast.
function rollDawn(id, formula) {
  const t = char.trackers.find(t => t.id === id);
  if (!t) return;
  // Parse "NdM + K" or "NdM" or just "K"
  let total = 0;
  const formulaClean = formula.replace(/\s+/g, '');
  // Split on + (keeping sign)
  const parts = formulaClean.match(/[+\-]?[^+\-]+/g) || [formula];
  parts.forEach(part => {
    const diceM = part.match(/([+\-]?\d*)d(\d+)/i);
    if (diceM) {
      const n = Math.abs(parseInt(diceM[1]) || 1);
      const die = parseInt(diceM[2]);
      const sign = (diceM[1] || '').startsWith('-') ? -1 : 1;
      for (let i = 0; i < n; i++) total += sign * (Math.floor(Math.random() * die) + 1);
    } else {
      total += parseInt(part) || 0;
    }
  });
  const cur = G.trackers[id] ?? 0;
  const newVal = Math.min(t.max, cur + total);
  G.trackers[id] = newVal;
  save(); render();
  toast(`🌅 ${t.label}: +${total} cargas → ${newVal}/${t.max}`);
}

// ═══════════════════════════════════════════════════
//  PERSISTENCE — IndexedDB, multi-personaje
// ═══════════════════════════════════════════════════
// Cada personaje es un registro { id, name, meta, xmlText, G, updatedAt }
// en el object store `characters`. Se usa IndexedDB en vez de localStorage
// porque un solo XML de FC5e puede pesar varios MB (Dorym real: 8.8MB) —
// eso solo ya roza o supera la cuota típica de localStorage (5-10MB) para
// UN personaje, así que localStorage no alcanza para guardar varios en
// paralelo. `activeCharId` (qué personaje está abierto ahora mismo) se
// guarda aparte en localStorage: es un string chico y hace falta poder
// leerlo en el arranque antes de abrir la conexión a IndexedDB.
const DB_NAME = 'ctdb', DB_VERSION = 1, STORE = 'characters';
let _dbPromise = null;
function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(STORE)) {
        req.result.createObjectStore(STORE, { keyPath:'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}
function dbPutCharacter(record) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(record);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function dbGetCharacter(id) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const req = db.transaction(STORE, 'readonly').objectStore(STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  }));
}
function dbGetAllCharacters() {
  return openDB().then(db => new Promise((resolve, reject) => {
    const req = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  }));
}
function dbDeleteCharacter(id) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function genId() { return 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

// Estado de sesión "en blanco" para un personaje recién cargado. Todas las
// secciones arrancan colapsadas (igual que siempre hizo importXML).
function freshG() {
  const allSectionKeys = ['action','bonus','reaction','trigger','suggestions','utility','passive','trackers','activeEffects','encounterState'];
  return { round:1, hp:null, tempHp:0, actionUsed:false, bonusUsed:false,
    reactionUsed:false, reactionAvailable:false, lastUsedInSlot:{}, oncePerTurn:{}, trackers:{},
    collapsed: Object.fromEntries(allSectionKeys.map(k => [k, true])),
    triggerSel:{}, castLevel:{}, poolAmt:{},
    hidden:{ abilities:{}, trackers:{} }, equipped:{},
    activeEffects:{},
    encounterState:{ numTargets:1, targetParalyzed:false, targetAsleep:false,
      targetProne:false, targetBlinded:false, targetConc:false, alliesInRange:0 },
    castTarget:{}, comboUsed:{}, lastSnapshot:null };
}
// Rellena con default cualquier campo que falte en un G cargado de un
// registro viejo (personajes guardados antes de agregarse alguna clave).
function ensureGDefaults() {
  const fresh = freshG();
  for (const k in fresh) if (G[k] === undefined) G[k] = fresh[k];
  if (!G.hidden.abilities) G.hidden.abilities = {};
  if (!G.hidden.trackers) G.hidden.trackers = {};
}

async function save() {
  if (!char || !activeCharId) return;
  try {
    await dbPutCharacter({
      id: activeCharId, name: char.name, meta: `${char.cName} · ${char.raceName}`,
      xmlText: lastXmlText, G, updatedAt: Date.now()
    });
    localStorage.setItem('activeCharId', activeCharId);
  } catch(e) {}
}

async function loadActiveCharacter() {
  const id = localStorage.getItem('activeCharId');
  if (!id) return false;
  try {
    const rec = await dbGetCharacter(id);
    if (!rec) return false;
    activeCharId = rec.id;
    lastXmlText = rec.xmlText;
    G = rec.G || freshG();
    ensureGDefaults();
    char = parseFC5eXML(rec.xmlText, G.equipped);
    return true;
  } catch(e) { return false; }
}

// Migra el guardado de una sola ranura (localStorage: 'ch'/'g'/'xml', de
// antes de esta función) a un registro IndexedDB. Corre una sola vez: si
// no encuentra esas claves viejas, no hace nada.
async function migrateLegacyStorage() {
  try {
    const legacyXml = localStorage.getItem('xml'), legacyCh = localStorage.getItem('ch');
    if (!legacyXml || !legacyCh) return;
    const legacyChar = JSON.parse(legacyCh);
    const legacyG = JSON.parse(localStorage.getItem('g') || '{}');
    const id = genId();
    await dbPutCharacter({
      id, name: legacyChar.name, meta: `${legacyChar.cName} · ${legacyChar.raceName}`,
      xmlText: legacyXml, G: legacyG, updatedAt: Date.now()
    });
    localStorage.removeItem('ch'); localStorage.removeItem('g'); localStorage.removeItem('xml');
    localStorage.setItem('activeCharId', id);
  } catch(e) {}
}

// ═══════════════════════════════════════════════════
//  IMPORT
// ═══════════════════════════════════════════════════
// targetId ausente → crea un personaje nuevo (import normal o compartido
// desde FC5e). targetId presente → reimporta el XML en una ranura ya
// existente (p.ej. tras subir de nivel en FC5e desde el selector de
// personajes): conserva preferencias de UI y el overlay de equipo de esa
// ranura; el resto del estado de combate (turno/ronda/HP actual/efectos)
// arranca de cero porque la ficha reimportada puede traer niveles u
// objetos nuevos que ya no coinciden con ese estado.
async function importXML(xmlText, opts) {
  opts = opts || {};
  try {
    const isReimport = !!opts.targetId;
    const id = opts.targetId || genId();
    const G_new = freshG();
    if (isReimport) {
      const prev = await dbGetCharacter(id);
      if (prev && prev.G) {
        G_new.collapsed = prev.G.collapsed || G_new.collapsed;
        G_new.hidden = prev.G.hidden || G_new.hidden;
        G_new.equipped = prev.G.equipped || {};
      }
    }
    lastXmlText = xmlText;
    char = parseFC5eXML(xmlText, G_new.equipped);
    char.trackers.forEach(t => { G_new.trackers[t.id] = t.max; });
    G_new.hp = char.hpCur;
    G = G_new;
    activeCharId = id;
    await save();
    document.getElementById('screen-import').style.display  = 'none';
    document.getElementById('screen-tracker').style.display = 'flex';
    closeCharacterSwitcher();
    render();
    toast(isReimport ? `${char.name} — XML actualizado`
      : opts.fromShare ? `${char.name} — cargado desde FC5e`
      : `${char.name} cargado`);
  } catch(e) { alert('Error al leer el XML: ' + e.message); }
}

// _fileImportTargetId viaja del botón que abrió el file-picker (import
// nuevo vs. reimportar una ranura puntual) hasta su listener 'change'.
let _fileImportTargetId = null;
function pickXmlFile(targetId) {
  _fileImportTargetId = targetId || null;
  document.getElementById('file-input').click();
}
document.getElementById('file-input').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const targetId = _fileImportTargetId; _fileImportTargetId = null;
  const r = new FileReader();
  r.onload = ev => importXML(ev.target.result, targetId ? { targetId } : {});
  r.onerror = () => alert('No se pudo leer el archivo');
  r.readAsText(f, 'UTF-8');
  e.target.value = '';
});

// ═══════════════════════════════════════════════════
//  CHARACTER SWITCHER
// ═══════════════════════════════════════════════════
async function openCharacterSwitcher() {
  const list = await dbGetAllCharacters();
  list.sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
  const rows = list.map(c => `
    <div class="char-row ${c.id===activeCharId ? 'active':''}">
      <div class="char-row-info" onclick="selectCharacter('${c.id}')">
        <div class="char-row-name">${esc(c.name)}${c.id===activeCharId ? ' <span class="char-row-tag">actual</span>' : ''}</div>
        <div class="char-row-meta">${esc(c.meta || '')}</div>
      </div>
      <button class="char-row-btn" onclick="pickXmlFile('${c.id}')" title="Reimportar XML (p.ej. tras subir de nivel en FC5e)">🔄</button>
      <button class="char-row-btn" onclick="downloadCharacterXml('${c.id}')" title="Descargar XML (con las ediciones hechas acá adentro)">⬇</button>
      <button class="char-row-btn danger" onclick="deleteCharacter('${c.id}')" title="Eliminar">🗑</button>
    </div>`).join('');
  document.getElementById('characters-modal').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeCharacterSwitcher()">
      <div class="modal-sheet">
        <div class="modal-head">
          <span class="modal-title">👥 Personajes</span>
          <button class="modal-close" onclick="closeCharacterSwitcher()">✕</button>
        </div>
        <div class="modal-body">${rows || '<div class="modal-empty">No hay personajes guardados</div>'}</div>
        <div class="modal-foot">
          <button class="footer-btn" onclick="pickXmlFile(null)">+ Importar personaje nuevo</button>
        </div>
      </div>
    </div>`;
}
// Descarga el XML tal como está guardado (con cualquier edición hecha en
// la app ya adentro — ver §3.10). Sigue siendo un XML con la forma de
// FC5e, así que en principio se podría volver a importar ahí — sin
// garantía de que FC5e lo acepte de vuelta sin quejarse: solo se conoce
// el formato de EXPORTACIÓN, nunca se probó el de importación real.
async function downloadCharacterXml(id) {
  const rec = await dbGetCharacter(id);
  if (!rec || !rec.xmlText) { toast('No hay XML guardado para este personaje'); return; }
  const blob = new Blob([rec.xmlText], { type: 'application/xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(rec.name || 'personaje').replace(/[^\w\-]+/g, '_')}.xml`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('XML descargado');
}
function closeCharacterSwitcher() {
  const el = document.getElementById('characters-modal');
  if (el) el.innerHTML = '';
}
async function selectCharacter(id) {
  if (id === activeCharId) { closeCharacterSwitcher(); return; }
  const rec = await dbGetCharacter(id);
  if (!rec) { toast('No se pudo cargar ese personaje'); return; }
  activeCharId = rec.id;
  lastXmlText = rec.xmlText;
  G = rec.G || freshG();
  ensureGDefaults();
  char = parseFC5eXML(rec.xmlText, G.equipped);
  localStorage.setItem('activeCharId', activeCharId);
  closeCharacterSwitcher();
  render();
  toast(`${char.name} cargado`);
}
async function deleteCharacter(id) {
  const rec = await dbGetCharacter(id);
  if (!rec) return;
  if (!confirm(`¿Eliminar a "${rec.name}"? Esta acción no se puede deshacer.`)) return;
  await dbDeleteCharacter(id);
  if (id !== activeCharId) { openCharacterSwitcher(); return; }
  const remaining = await dbGetAllCharacters();
  if (remaining.length) {
    remaining.sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
    await selectCharacter(remaining[0].id);
  } else {
    activeCharId = null; char = null; lastXmlText = null;
    localStorage.removeItem('activeCharId');
    closeCharacterSwitcher();
    document.getElementById('screen-tracker').style.display = 'none';
    document.getElementById('screen-import').style.display  = 'flex';
  }
}

// ═══════════════════════════════════════════════════
//  SHARE TARGET
// ═══════════════════════════════════════════════════
// Lee el archivo compartido desde FC5e (caché share-v1 → pendiente).
// Corre ANTES que loadActiveCharacter() — ver comentario en init().
// ── Debug panel (solo en error) ──────────────────────────────────────
// Acumula logs en memoria; solo crea el panel visible si dbgError() es
// llamado. En éxito el panel no aparece en absoluto.
const _dbgLog = [];
function dbg(msg, color) {
  _dbgLog.push({ msg, color: color || '#e2e8f0', ts: new Date().toISOString().slice(11,23) });
  console.log('[SHARE]', msg);
}
function dbgError(msg) {
  dbg(msg, '#fca5a5');
  // Crear y mostrar el panel con todo el historial acumulado
  let el = document.getElementById('share-debug');
  if (!el) {
    el = document.createElement('div');
    el.id = 'share-debug';
    Object.assign(el.style, {
      position:'fixed', bottom:'60px', left:'8px', right:'8px', zIndex:'9999',
      background:'#0a0a14', border:'2px solid #ef4444', borderRadius:'8px',
      padding:'10px', fontFamily:'monospace', fontSize:'11px',
      color:'#e2e8f0', maxHeight:'55vh', overflowY:'auto', lineHeight:'1.5'
    });
    const hdr = document.createElement('div');
    hdr.innerHTML = '<strong style="color:#ef4444">⚠️ Error al cargar personaje compartido</strong>'
      + '<button onclick="this.parentElement.parentElement.remove()" '
      + 'style="float:right;background:none;border:none;color:#94a3b8;cursor:pointer;font-size:12px">✕</button>';
    el.appendChild(hdr);
    el.appendChild(document.createElement('hr'));
    document.body.appendChild(el);
  }
  _dbgLog.forEach(entry => {
    const line = document.createElement('div');
    line.style.color = entry.color;
    line.textContent = entry.ts + ' ' + entry.msg;
    el.appendChild(line);
  });
  el.scrollTop = el.scrollHeight;
}

async function processSharedFile() {
  const hasShare = location.search.includes('from-share');
  dbg('processSharedFile() — from-share en URL: ' + hasShare, hasShare ? '#86efac' : '#fca5a5');
  if (!hasShare) return false;

  history.replaceState({}, '', location.pathname);
  try {
    const cache = await caches.open('share-v1');
    const res   = await cache.match('pending');
    if (!res) {
      dbgError('No hay archivo pendiente en caché.');
      dbgError('  · SW puede no haber interceptado el POST (¿versión vieja instalada?)');
      dbgError('  · El archivo llegó vacío desde FC5e');
      return false;
    }

    // Mostrar diagnóstico del FormData que capturó el SW
    try {
      const debugCache = await caches.open('share-v1');
      const debugRes = await debugCache.match('pending-debug');
      if (debugRes) {
        const debugData = await debugRes.json();
        dbg('── Campos FormData recibidos por el SW ──', '#f59e0b');
        debugData.forEach(line => dbg('  ' + line, '#93c5fd'));
        await debugCache.delete('pending-debug');
      } else {
        dbgError('Sin datos de diagnóstico del FormData — SW versión anterior.');
      }
    } catch {}

    const contentType = res.headers.get('Content-Type') || '(sin Content-Type)';
    dbg('Content-Type en caché: ' + contentType);

    await cache.delete('pending');
    const buffer = await res.arrayBuffer();

    if (buffer.byteLength === 0) {
      dbgError('El buffer está vacío — el SW recibió un archivo de 0 bytes.');
      return false;
    }

    const bytes = new Uint8Array(buffer);
    const magic = Array.from(bytes.slice(0,8)).map(b => b.toString(16).padStart(2,'0')).join(' ');
    dbg('Magic bytes (primeros 8): ' + magic);
    dbg('Primeros 4 chars: ' + String.fromCharCode(...bytes.slice(0,4).filter(b=>b>31)));

    const isZip = bytes[0]===0x50 && bytes[1]===0x4B && bytes[2]===0x03 && bytes[3]===0x04;
    const isXml = bytes[0]===0x3C; // '<'
    if (!isZip && !isXml) dbgError('Formato desconocido. Magic bytes: ' + magic);
    else dbg('Formato: ' + (isZip ? 'ZIP (.dnd5e)' : 'XML plano'));

    if (isZip) {
      try {
        const fnLen    = bytes[26] | (bytes[27] << 8);
        const extraLen = bytes[28] | (bytes[29] << 8);
        const dataOffset = 30 + fnLen + extraLen;
        const method = bytes[8] | (bytes[9] << 8);
        const compSize = bytes[18] | (bytes[19]<<8) | (bytes[20]<<16) | (bytes[21]<<24);

        dbg('ZIP: method=' + method + ' fnLen=' + fnLen + ' extraLen=' + extraLen + ' dataOffset=' + dataOffset + ' compSize=' + compSize);

        let xmlText;
        if (method === 0) {
          dbg('Método: STORED (sin compresión)');
          const uncompressed = buffer.slice(dataOffset);
          xmlText = new TextDecoder('utf-8').decode(uncompressed);
        } else {
          dbg('Método: DEFLATE — usando DecompressionStream…');
          const compressed = buffer.slice(dataOffset, dataOffset + compSize);
          const ds = new DecompressionStream('deflate-raw');
          const writer = ds.writable.getWriter();
          const reader = ds.readable.getReader();
          writer.write(new Uint8Array(compressed));
          writer.close();
          const chunks = [];
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
          }
          const total = chunks.reduce((n,c) => n+c.length, 0);
          const merged = new Uint8Array(total);
          let off = 0;
          chunks.forEach(c => { merged.set(c, off); off += c.length; });
          xmlText = new TextDecoder('utf-8').decode(merged);
        }

        dbg('XML descomprimido, longitud: ' + xmlText.length + ' chars', '#86efac');
        dbg('Inicio XML: ' + xmlText.slice(0,80).replace(/\n/g,' '));
        if (!xmlText.includes('<character>')) dbgError('XML no contiene <character> — puede no ser un personaje de FC5e.');
        else dbg('Contiene <character>: sí');
        importXML(xmlText, { fromShare: true });
        return true;

      } catch (zipErr) {
        dbgError('Error descomprimiendo ZIP: ' + zipErr.message);
        return false;
      }
    } else {
      // XML plano
      const xmlText = new TextDecoder('utf-8').decode(bytes);
      dbg('XML plano, longitud: ' + xmlText.length + ' chars', '#86efac');
      dbg('Inicio XML: ' + xmlText.slice(0,80).replace(/\n/g,' '));
      importXML(xmlText, { fromShare: true });
      return true;
    }
  } catch(e) {
    dbgError('Excepción inesperada: ' + e.message);
  }
  return false;
}

// ═══════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════
let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400);
}

// ═══════════════════════════════════════════════════
//  UPDATE BANNER (Service Worker version notification)
// ═══════════════════════════════════════════════════
// El SW (sw.js, estrategia Network-First) avisa via postMessage cuando
// detecta que un archivo del shell (index.html/manifest.json/etc.) cambió
// en el servidor respecto a lo que tenía cacheado. Mostramos un banner no
// intrusivo que el usuario puede descartar sin perder su personaje/estado
// actual (el reload solo ocurre si el usuario presiona "Actualizar").
let updateAvailable = false;

function showUpdateBanner() {
  document.getElementById('update-banner').classList.add('show');
  document.getElementById('update-pill').classList.remove('show');
}
function dismissUpdateBanner() {
  document.getElementById('update-banner').classList.remove('show');
  // Si sigue habiendo una actualización pendiente, dejamos la píldora
  // flotante visible para poder volver a abrir el banner cuando se quiera.
  if (updateAvailable) document.getElementById('update-pill').classList.add('show');
}
function reloadForUpdate() {
  // El estado del personaje ya está guardado en IndexedDB (save() se llama
  // tras cada acción), así que recargar no pierde el combate en curso. La
  // escritura es asíncrona, pero para cuando el usuario llega a tocar este
  // botón la última acción ya tuvo tiempo de sobra para persistirse.
  location.reload();
}

// ═══════════════════════════════════════════════════
//  SERVICE WORKER
// ═══════════════════════════════════════════════════
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});

  // Mensajes desde el SW: UPDATE_AVAILABLE y SHARED_FILE_PENDING.
  navigator.serviceWorker.addEventListener('message', event => {
    if (event.data?.type === 'UPDATE_AVAILABLE') {
      updateAvailable = true;
      showUpdateBanner();
    }
    if (event.data?.type === 'SHARED_FILE' && event.data.payload) {
      importXML(event.data.payload, { fromShare: true });
    }
  });

  // Al volver a primer plano, revisar si hay actualización del SW.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      navigator.serviceWorker.getRegistration().then(reg => reg?.update());
    }
  });
}

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
(async function init() {
  // Migra el guardado de una sola ranura de versiones anteriores (si
  // existe) a un registro IndexedDB, antes de cualquier otra cosa.
  await migrateLegacyStorage();

  // El archivo compartido SIEMPRE tiene prioridad — incluso sobre un
  // personaje ya activo (ver comentario en processSharedFile). Crea un
  // personaje nuevo y lo deja como activo.
  if (await processSharedFile()) return;

  if (await loadActiveCharacter()) {
    document.getElementById('screen-tracker').style.display = 'flex';
    render(); return;
  }
  document.getElementById('screen-import').style.display = 'flex';
})();
</script>
